<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Marketplace — HashidHub</title>
  <link rel="stylesheet" href="hh-shared.css" />
  <link rel="icon" href="icon.svg" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a class="back-btn" href="index.html" title="رجوع">← الرئيسية</a>
        <span class="dot">H</span>
        <span>Marketplace</span>
      </div>
      <nav class="nav-pills">
        <a class="on" href="marketplace.html">🛍️ السوق</a>
        <a href="jobs.html">💼 وظائف</a>
        <a href="academy.html">🎓 أكاديمية</a>
        <a href="ai.html">✨ AI</a>
        <a href="creator-center.html">📊 المبدع</a>
      </nav>
      <div id="authBox" class="user-chip">…</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>🛍️ سوق HashidHub</h1>
      <p>منتجات وخدمات رقمية من صناع المحتوى والشباب — بيع، اشتري، وابنِ حضورك.</p>
    </section>

    <div class="toolbar">
      <input id="q" type="search" placeholder="ابحث عن منتج أو خدمة…" />
      <select id="cat">
        <option value="">كل التصنيفات</option>
        <option>منتجات رقمية</option>
        <option>خدمات</option>
        <option>تصميم</option>
        <option>برمجة</option>
        <option>تسويق</option>
        <option>محتوى</option>
        <option>أخرى</option>
      </select>
      <button class="btn" id="btnAdd" hidden>+ إضافة عرض</button>
    </div>

    <div id="list" class="grid">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, query, where, orderBy, limit, onSnapshot, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let me = null, items = [], unsub = null;

    const $ = (s, r) => (r || document).querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    function toast(m, ms = 2600) {
      const el = $("#toast"); el.textContent = m; el.classList.add("show");
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), ms);
    }

    function renderAuth() {
      const box = $("#authBox");
      if (!me) {
        box.innerHTML = `<button class="btn alt" id="loginBtn" style="padding:8px 12px;min-height:auto">تسجيل الدخول</button>`;
        $("#loginBtn")?.addEventListener("click", () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast(e.message)));
        $("#btnAdd").hidden = true;
      } else {
        box.innerHTML = `<img class="av" src="${esc(me.photoURL || "")}" alt=""><span>${esc(me.displayName || "عضو")}</span>`;
        $("#btnAdd").hidden = false;
      }
    }

    function filtered() {
      const q = ($("#q").value || "").trim().toLowerCase();
      const cat = $("#cat").value;
      return items.filter(x => {
        if (cat && x.category !== cat) return false;
        if (!q) return true;
        return (x.title || "").toLowerCase().includes(q) || (x.description || "").toLowerCase().includes(q);
      });
    }

    function renderList() {
      const data = filtered();
      const root = $("#list");
      if (!data.length) {
        root.innerHTML = `<div class="empty" style="grid-column:1/-1">لا توجد عروض بعد. كن أول من ينشر في السوق 🚀</div>`;
        return;
      }
      root.innerHTML = data.map(x => {
        const own = me && x.ownerId === me.uid;
        return `<article class="card">
          <div class="meta"><span class="tag">${esc(x.category || "عام")}</span>
            ${own ? `<span class="tag gold">عرضك</span>` : ""}</div>
          <h3>${esc(x.title)}</h3>
          <p style="color:var(--mute);font-size:.92rem;margin:0 0 10px">${esc((x.description || "").slice(0, 140))}${(x.description||"").length>140?"…":""}</p>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">
            <span class="price">${Number(x.price||0).toLocaleString()} ${esc(x.currency||"USD")}</span>
            ${own ? `<button class="btn ghost" data-del="${esc(x.id)}" style="padding:8px 12px;min-height:auto">حذف</button>` : `<button class="btn alt" data-contact style="padding:8px 12px;min-height:auto">تواصل</button>`}
          </div>
        </article>`;
      }).join("");
    }

    function listen() {
      if (unsub) unsub();
      const qy = query(collection(db, "marketplace"), where("status", "==", "published"), orderBy("createdAt", "desc"), limit(60));
      unsub = onSnapshot(qy, snap => {
        items = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
        renderList();
      }, err => {
        console.error(err);
        $("#list").innerHTML = `<div class="empty" style="grid-column:1/-1">تعذر تحميل السوق. تأكد من قواعد Firestore والفهارس.<br><small>${esc(err.code||err.message)}</small></div>`;
      });
    }

    function openCreate() {
      if (!me) return toast("سجّل الدخول أولاً");
      const wrap = document.createElement("div");
      wrap.className = "sheet";
      wrap.innerHTML = `<div class="sheet-panel">
        <h2>إضافة عرض جديد</h2>
        <div class="field"><label>العنوان</label><input id="f-title" maxlength="160" placeholder="مثال: تصميم هوية بصرية" /></div>
        <div class="field"><label>الوصف</label><textarea id="f-desc" maxlength="2000" placeholder="تفاصيل العرض…"></textarea></div>
        <div class="field"><label>التصنيف</label>
          <select id="f-cat"><option>منتجات رقمية</option><option>خدمات</option><option>تصميم</option><option>برمجة</option><option>تسويق</option><option>محتوى</option><option>أخرى</option></select>
        </div>
        <div class="field" style="display:flex;gap:10px">
          <div style="flex:1"><label>السعر</label><input id="f-price" type="number" min="0" step="1" value="0" /></div>
          <div style="flex:0 0 110px"><label>العملة</label><input id="f-cur" maxlength="3" value="USD" /></div>
        </div>
        <div style="display:flex;gap:10px;margin-top:8px">
          <button class="btn" id="f-save">نشر</button>
          <button class="btn alt" id="f-cancel">إلغاء</button>
        </div>
      </div>`;
      document.body.appendChild(wrap);
      const close = () => wrap.remove();
      wrap.addEventListener("click", e => { if (e.target === wrap) close(); });
      $("#f-cancel", wrap).onclick = close;
      $("#f-save", wrap).onclick = async () => {
        const title = $("#f-title", wrap).value.trim();
        const description = $("#f-desc", wrap).value.trim();
        const price = Math.max(0, Number($("#f-price", wrap).value) || 0);
        if (title.length < 3) return toast("اكتب عنواناً واضحاً");
        if (description.length < 10) return toast("الوصف قصير جداً");
        try {
          await addDoc(collection(db, "marketplace"), {
            ownerId: me.uid,
            title: title.slice(0, 160),
            description: description.slice(0, 2000),
            category: $("#f-cat", wrap).value,
            price,
            currency: ($("#f-cur", wrap).value || "USD").toUpperCase().slice(0, 3),
            status: "published",
            createdAt: Date.now(),
            updatedAt: Date.now()
          });
          toast("تم نشر العرض ✨");
          close();
        } catch (e) {
          toast(e.message || "فشل النشر");
        }
      };
    }

    document.addEventListener("click", async e => {
      const del = e.target.closest("[data-del]");
      if (del) {
        if (!confirm("حذف هذا العرض؟")) return;
        try { await deleteDoc(doc(db, "marketplace", del.dataset.del)); toast("تم الحذف"); }
        catch (err) { toast(err.message || "تعذر الحذف"); }
      }
      if (e.target.closest("[data-contact]")) {
        if (!me) return toast("سجّل الدخول للتواصل");
        toast("افتح الملف الشخصي من الرئيسية للتواصل مع البائع");
      }
    });

    $("#btnAdd").onclick = openCreate;
    $("#q").oninput = () => renderList();
    $("#cat").onchange = () => renderList();
    onAuthStateChanged(auth, u => { me = u; renderAuth(); });
    listen();
  </script>
</body>
</html>
