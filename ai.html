<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Hashid AI — HashidHub</title>
  <link rel="stylesheet" href="hh-shared.css" />
  <link rel="icon" href="icon.svg" />
  <style>
    .ai-layout { display:grid; gap:16px; }
    @media(min-width:900px){ .ai-layout{ grid-template-columns: 1.1fr .9fr; align-items:start; } }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
    .chip {
      border:1px solid var(--line); background:var(--card); color:var(--ink);
      border-radius:999px; padding:8px 12px; font-weight:700; font-size:.85rem;
    }
    .chip:hover { border-color: var(--brand); }
    .chip.on { background: rgba(34,211,166,.15); border-color: var(--brand); color: var(--brand); }
    .out-box {
      min-height: 180px; white-space: pre-wrap; line-height: 1.7;
      background: var(--bg2); border: 1px solid var(--line); border-radius: 16px; padding: 16px;
      color: var(--ink);
    }
    .out-box.muted { color: var(--mute); }
    .status-line { font-size: .85rem; color: var(--mute); margin-top: 8px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a class="back-btn" href="index.html">← الرئيسية</a>
        <span class="dot">✦</span>
        <span>Hashid AI</span>
      </div>
      <nav class="nav-pills">
        <a href="marketplace.html">🛍️ السوق</a>
        <a href="jobs.html">💼 وظائف</a>
        <a href="academy.html">🎓 أكاديمية</a>
        <a class="on" href="ai.html">✨ AI</a>
        <a href="creator-center.html">📊 المبدع</a>
      </nav>
      <div id="authBox" class="user-chip">ضيف</div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>✨ Hashid AI</h1>
      <p>مساعد ذكي لتحسين منشوراتك، بناء سيرة ذاتية، توليد أفكار مشاريع، والترجمة الفورية.</p>
    </section>

    <div class="ai-layout">
      <section class="card">
        <h2 style="margin-top:0">ماذا تريد؟</h2>
        <div class="chips" id="modes">
          <button type="button" class="chip on" data-mode="general">💬 عام</button>
          <button type="button" class="chip" data-mode="improve">📝 تحسين منشور</button>
          <button type="button" class="chip" data-mode="cv">📄 سيرة ذاتية</button>
          <button type="button" class="chip" data-mode="ideas">💡 أفكار مشاريع</button>
          <button type="button" class="chip" data-mode="translate">🌐 ترجمة</button>
        </div>
        <div class="field">
          <label>اكتب طلبك</label>
          <textarea id="prompt" maxlength="4000" placeholder="مثال: حسّن هذا المنشور عن ريادة الأعمال للشباب…"></textarea>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn" id="go">توليد ✨</button>
          <button class="btn alt" id="clear">مسح</button>
          <button class="btn ghost" id="copy" hidden>نسخ النتيجة</button>
        </div>
        <p class="status-line" id="status">جاهز — يتطلب إعداد OPENAI_API_KEY على Vercel</p>
      </section>

      <section class="card">
        <h2 style="margin-top:0">النتيجة</h2>
        <div class="out-box muted" id="output">سيظهر الرد هنا بعد التوليد.</div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    let me = null, mode = "general";

    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    function toast(m, ms = 2600) {
      const el = $("#toast"); el.textContent = m; el.classList.add("show");
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), ms);
    }

    onAuthStateChanged(auth, u => {
      me = u;
      const box = $("#authBox");
      if (!u) {
        box.innerHTML = `<button class="btn alt" id="loginBtn" style="padding:8px 12px;min-height:auto">دخول</button>`;
        $("#loginBtn")?.addEventListener("click", () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast(e.message)));
      } else {
        box.innerHTML = `<img class="av" src="${esc(u.photoURL||"")}" alt=""><span>${esc(u.displayName||"عضو")}</span>`;
      }
    });

    $("#modes").addEventListener("click", e => {
      const b = e.target.closest("[data-mode]");
      if (!b) return;
      mode = b.dataset.mode;
      $("#modes").querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
    });

    $("#clear").onclick = () => {
      $("#prompt").value = "";
      $("#output").classList.add("muted");
      $("#output").textContent = "سيظهر الرد هنا بعد التوليد.";
      $("#copy").hidden = true;
      $("#status").textContent = "تم المسح";
    };

    $("#copy").onclick = async () => {
      try {
        await navigator.clipboard.writeText($("#output").textContent || "");
        toast("تم النسخ");
      } catch { toast("تعذر النسخ"); }
    };

    $("#go").onclick = async () => {
      const prompt = ($("#prompt").value || "").trim();
      if (prompt.length < 2) return toast("اكتب طلبك أولاً");
      const btn = $("#go");
      btn.disabled = true;
      $("#status").textContent = "جاري التوليد…";
      $("#output").classList.remove("muted");
      $("#output").textContent = "…";

      try {
        const r = await fetch("/api/ai", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, mode })
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          const msg = data.message || data.error || ("خطأ " + r.status);
          $("#output").classList.add("muted");
          $("#output").textContent = msg;
          $("#status").textContent = "فشل التوليد";
          toast(msg, 4000);
          return;
        }
        $("#output").textContent = data.text || "(لا يوجد رد)";
        $("#copy").hidden = false;
        $("#status").textContent = "تم عبر " + (data.model || "AI") + " · وضع: " + (data.mode || mode);
      } catch (e) {
        $("#output").classList.add("muted");
        $("#output").textContent = "تعذر الاتصال بخدمة AI. تأكد من نشر api/ai.js وإضافة OPENAI_API_KEY.";
        $("#status").textContent = "خطأ شبكة";
        toast("تعذر الاتصال بالخادم");
      } finally {
        btn.disabled = false;
      }
    };
  </script>
</body>
</html>
