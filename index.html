<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,GoogleAuthProvider,FacebookAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,getDoc,setDoc,addDoc,deleteDoc,updateDoc,onSnapshot,query,orderBy,limit,increment,where,getDocs,arrayUnion} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {getMessaging,getToken,onMessage,isSupported as messagingIsSupported} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js';
var app=initializeApp(firebaseConfig),auth=getAuth(app),db;
try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(_){db=getFirestore(app);}
auth.languageCode='ar';
var messaging=null,me=null,prof=null,isAdmin=false,tab='home',activeProfile=null,feedMode='all';
var subscriptions=[],posts=[],users=[],reels=[],stories=[],likes=[],comments=[],follows=[],pages=[],groups=[],groupMembers=[],notifications=[],messages=[],savedItems=[],blocks=new Set(),pendingRequests=[],achievements=[],xpRecords=[],drawTimer=0,streamState={cursor:null,more:true,loading:false},searchTimer=0;
var COLORS={};
function $(s,r){return (r||document).querySelector(s)}function $$ (s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function t(ar,en){return localStorage.getItem('hh_lang')==='en'?en:ar}function toast(s,ms){var el=$('#toast');if(!el)return;el.textContent=s;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(function(){el.classList.remove('show');},ms||2500);}
function track(unsub){if(typeof unsub==='function')subscriptions.push(unsub);return unsub}function stopListeners(){subscriptions.splice(0).forEach(function(u){try{u();}catch(_){}});}
function scheduleRender(){clearTimeout(drawTimer);drawTimer=setTimeout(render,60)}
function safeImage(url){return url?esc(url):'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" fill="#9aa596"/><circle cx="20" cy="15" r="7" fill="white"/><ellipse cx="20" cy="38" rx="14" ry="12" fill="white"/></svg>');}
function showError(e){console.error(e);toast(e&&e.code==='permission-denied'?'ليس لديك صلاحية لهذا الإجراء':(e&&e.message)||'حدث خطأ. حاول مجدداً.',4500);}
function subscribeQuery(q,handler){return track(onSnapshot(q,function(snap){handler(snap.docs.map(function(d){return Object.assign({id:d.id},d.data());}));scheduleRender();},function(err){console.error('Firestore listener',err);if(err.code==='permission-denied')toast('تعذر تحميل بيانات بسبب صلاحيات Firestore');}));}
function startBaseListeners(){stopListeners();if(!me){startGuestListeners();return;}
  subscribeQuery(query(collection(db,'posts'),orderBy('ts','desc'),limit(25)),function(v){posts=v;streamState.cursor=v.length?v[v.length-1]:null;streamState.more=v.length===25;});
  subscribeQuery(query(collection(db,'users'),limit(60)),function(v){users=v;});
  subscribeQuery(query(collection(db,'reels'),orderBy('ts','desc'),limit(16)),function(v){reels=v;});
  subscribeQuery(query(collection(db,'stories'),where('exp','>',Date.now()),orderBy('exp'),limit(50)),function(v){stories=v;});
  subscribeQuery(query(collection(db,'likes'),where('uid','==',me.uid),limit(100)),function(v){likes=v;});
  subscribeQuery(query(collection(db,'comments'),orderBy('ts','desc'),limit(100)),function(v){comments=v;});
  subscribeQuery(query(collection(db,'follows'),where('a','==',me.uid),limit(500)),function(v){follows=v;});
  subscribeQuery(query(collection(db,'pages'),orderBy('ts','desc'),limit(30)),function(v){pages=v;});
  subscribeQuery(query(collection(db,'groups'),orderBy('ts','desc'),limit(30)),function(v){groups=v;});
  subscribeQuery(query(collection(db,'groupMembers'),where('uid','==',me.uid),limit(100)),function(v){groupMembers=v;});
  subscribeQuery(query(collection(db,'notifs'),where('to','==',me.uid),orderBy('ts','desc'),limit(30)),function(v){notifications=v;});
  subscribeQuery(query(collection(db,'messages'),where('members','array-contains',me.uid),orderBy('ts','desc'),limit(50)),function(v){messages=v;});
  subscribeQuery(query(collection(db,'savedPosts'),where('uid','==',me.uid),limit(100)),function(v){savedItems=v;});
  subscribeQuery(query(collection(db,'blocks'),where('a','==',me.uid),limit(500)),function(v){blocks=new Set(v.map(function(x){return x.b;}));});
  subscribeQuery(query(collection(db,'friendReqs'),where('to','==',me.uid),limit(50)),function(v){pendingRequests=v;});
  subscribeQuery(query(collection(db,'achievements'),orderBy('order','asc'),limit(50)),function(v){achievements=v;});
  subscribeQuery(query(collection(db,'xp'),where('uid','==',me.uid),orderBy('createdAt','desc'),limit(50)),function(v){xpRecords=v;});
}
function startGuestListeners(){stopListeners();subscribeQuery(query(collection(db,'posts'),orderBy('ts','desc'),limit(15)),function(v){posts=v;});subscribeQuery(query(collection(db,'reels'),orderBy('ts','desc'),limit(12)),function(v){reels=v;});}
function userById(id){return users.find(function(u){return u.id===id;})||{id:id,name:'عضو'};}
function countFollowers(id){return follows.filter(function(f){return f.b===id;}).length;}
function levelFor(points){return Math.floor(Math.sqrt(Math.max(0,points)/100))+1;}
function xpTotal(){return xpRecords.reduce(function(s,x){return s+(Number(x.points)||0);},0);}
function navButton(id,label,icon){return '<button type="button" data-tab="'+id+'" class="'+(tab===id?'on':'')+'" aria-label="'+esc(label)+'"><span>'+icon+'</span><span>'+esc(label)+'</span></button>';}
function header(){return '<header><div><div class="logo">Hashid<b>Hub</b></div><div class="brand-sub">تواصل · شارك · انطلق</div></div><div class="row"><button class="hbtn" data-action="search-open" aria-label="بحث">⌕</button><div class="hdr-menu"><button class="hbtn" data-action="menu-toggle" aria-label="القائمة" aria-expanded="false">☰</button><div id="menu" class="hdr-dd"><button data-tab="ai">✨ Hashid AI</button><button data-tab="marketplace">🛍️ Marketplace</button><button data-tab="jobs">💼 Jobs</button><button data-tab="academy">🎓 Academy</button><button data-tab="creator">📊 Creator Center</button><button data-tab="verification">✅ التحقق</button><button data-action="theme">🌓 الوضع الليلي</button><button data-action="logout">تسجيل الخروج</button></div></div></div></header>';}
function bottomNav(){return '<nav class="bnav" aria-label="التنقل">'+navButton('home','الرئيسية','⌂')+navButton('reels','ريلز','▷')+navButton('search','بحث','⌕')+navButton('messages','رسائل','✉')+navButton('profile','ملفي','◉')+'</nav>';}
function homeView(){var html='';html+='<div class="feed-toolbar" role="tablist"><button data-feed="all" class="'+(feedMode==='all'?'on':'')+'">🕒 الأحدث</button><button data-feed="following" class="'+(feedMode==='following'?'on':'')+'">متابَعون</button><button data-feed="forYou" class="'+(feedMode==='forYou'?'on':'')+'">✨ لك</button></div>';
  html+='<div class="stories">'+(me?'<button class="story-bubble" data-action="story-add"><span class="story-ring"><img src="'+safeImage(prof&&prof.photo)+'" alt=""><span>＋</span></span><span>قصتي</span></button>':'');var seen={};stories.forEach(function(s){if(seen[s.uid]||blocks.has(s.uid))return;seen[s.uid]=1;var u=userById(s.uid);html+='<button class="story-bubble" data-action="story-view" data-id="'+esc(s.id)+'"><span class="story-ring"><img loading="lazy" src="'+safeImage(s.media||u.photo)+'" alt=""></span><span>'+esc(u.name||s.name||'عضو')+'</span></button>';});html+='</div>';
  if(reels.length){html+='<div class="shelf-head"><h3>ريلز تستحق المشاهدة</h3><button class="mini" data-tab="reels">عرض الكل</button></div><div class="reel-shelf">';reels.slice(0,8).forEach(function(r){html+='<button class="reel-tile" data-action="reel-open" data-id="'+esc(r.id)+'"><img loading="lazy" src="'+safeImage(r.poster||r.photo)+'" alt=""><span>'+esc(r.caption||r.name||'ريل')+'</span></button>';});html+='</div>';}
  if(me)html+='<section class="card composer-card"><div class="row"><img class="av" src="'+safeImage(prof&&prof.photo)+'" alt=""><strong>ما الذي تريد مشاركته؟</strong></div><textarea id="compose" maxlength="5000" placeholder="شارك فكرة أو لحظة مع مجتمعك…"></textarea><div class="row" style="justify-content:space-between;margin-top:8px"><label class="btn alt">📷 صورة<input id="post-image" type="file" accept="image/*" hidden></label><button class="btn" data-action="post-create">نشر</button></div><p class="note">يمكنك كتابة منشور، إضافة صورة، أو استخدام مساعد Hashid AI.</p></section>';
  var list=posts.filter(function(p){return !blocks.has(p.uid)&&((p.privacy||'public')!=='friends'||p.uid===me?.uid);});if(feedMode==='following'&&me)list=list.filter(function(p){return p.uid===me.uid||follows.some(function(f){return f.b===p.uid;});});if(feedMode==='forYou')list.sort(function(a,b){return ((b.likes||0)+(b.comments||0)*2)-( (a.likes||0)+(a.comments||0)*2)||b.ts-a.ts;});
  html+='<div id="feed">'+(list.length?list.map(postCard).join(''):'<div class="card empty">لا توجد منشورات بعد. كن أول من يشارك!</div>')+'</div>';if(streamState.more)html+='<button class="btn gray" data-action="feed-more" '+(streamState.loading?'disabled':'')+'>تحميل المزيد</button>';return html;}
function postCard(p){var u=userById(p.uid),mine=me&&p.uid===me.uid,liked=likes.some(function(l){return l.pid===p.id;});var body=esc(p.t||'');var media=p.media?'<img class="media" loading="lazy" decoding="async" src="'+safeImage(p.media)+'" alt="">':'';var cs=comments.filter(function(c){return c.pid===p.id;}).slice(0,2);return '<article class="card post-card" data-post="'+esc(p.id)+'"><div class="row"><img class="av" loading="lazy" src="'+safeImage(u.photo||p.photo)+'" alt=""><div style="flex:1"><button class="name" data-action="profile-open" data-id="'+esc(p.uid)+'">'+esc(u.name||p.name||'عضو')+'</button><div class="time">'+new Date(p.ts||Date.now()).toLocaleString()+'</div></div>'+(mine?'<button class="mini" data-action="post-delete" data-id="'+esc(p.id)+'" aria-label="حذف">⋯</button>':'')+'</div><div class="body">'+body+'</div>'+media+'<div class="stats"><span>'+Number(p.likes||0)+' إعجاب</span><span>'+cs.length+' تعليق</span></div><div class="acts"><button class="'+(liked?'on':'')+'" data-action="post-like" data-id="'+esc(p.id)+'">👍 إعجاب</button><button data-action="comment-focus" data-id="'+esc(p.id)+'">💬 تعليق</button><button data-action="post-share" data-id="'+esc(p.id)+'">↗ مشاركة</button></div>'+cs.map(function(c){return '<div class="cm"><b>'+esc(c.name||'عضو')+'</b> '+esc(c.t||'')+'</div>';}).join('')+(me?'<div class="row"><input type="text" data-comment="'+esc(p.id)+'" maxlength="2000" placeholder="اكتب تعليقاً…"><button class="mini" data-action="comment-send" data-id="'+esc(p.id)+'">إرسال</button><button class="mini" data-action="ai-comment" data-id="'+esc(p.id)+'">✨ AI</button></div>':'')+'</article>';}
function profileView(){var id=activeProfile||me.uid,u=userById(id),isMe=id===me.uid,total=users.find(function(x){return x.id===id;})||prof,score=isMe?xpTotal():Number(total.xp||0);return '<section class="pcard"><div class="row"><img class="av lg" src="'+safeImage(total.photo)+'" alt=""><div><h2>'+esc(total.name||u.name||'HashidHub member')+'</h2><p>'+esc(total.bio||'')+'</p><span class="chip">Level '+levelFor(score)+'</span> <span class="chip">'+score+' XP</span></div></div><div class="grid"><div><b>'+countFollowers(id)+'</b>متابعون</div><div><b>'+posts.filter(function(p){return p.uid===id;}).length+'</b>منشورات</div><div><b>'+reels.filter(function(r){return r.uid===id;}).length+'</b>ريلز</div></div></section>'+(isMe?'<section class="card"><h3>تطوير ملفي</h3><input id="profile-name" maxlength="40" value="'+esc(prof.name||'')+'" placeholder="الاسم"><textarea id="profile-bio" maxlength="200" placeholder="نبذة ومهاراتك">'+esc(prof.bio||'')+'</textarea><input id="profile-skills" maxlength="300" value="'+esc((prof.skills||[]).join(', '))+'" placeholder="المهارات مفصولة بفواصل"><button class="btn" data-action="profile-save">حفظ الملف</button><button class="btn alt" data-tab="creator">Creator Center</button><button class="btn alt" data-tab="verification">طلب توثيق</button></section>':'<button class="btn" data-action="follow" data-id="'+esc(id)+'">متابعة</button>')+posts.filter(function(p){return p.uid===id;}).map(postCard).join('');}
function reelsView(){return '<h2>ريلز</h2><div class="reel-page">'+reels.map(function(r){return '<button class="reel-tile" data-action="reel-open" data-id="'+esc(r.id)+'"><img loading="lazy" src="'+safeImage(r.poster||r.photo)+'" alt=""><span>'+esc(r.caption||'ريل')+'</span></button>';}).join('')+'</div>';}
function searchView(){return '<section class="card"><h2>بحث HashidHub</h2><input id="global-search" type="search" placeholder="ابحث عن أشخاص، منشورات، صفحات ومجموعات…" autocomplete="off"><div id="search-results" class="note">اكتب للبحث ضمن البيانات المحمّلة حالياً.</div></section>';}
function searchLocal(q){var box=$('#search-results');if(!box)return;var n=q.trim().toLocaleLowerCase();if(n.length<2){box.textContent='اكتب حرفين على الأقل.';return;}var out=[];users.filter(function(u){return (u.name||'').toLocaleLowerCase().includes(n);}).slice(0,8).forEach(function(u){out.push('<button class="btn alt" data-action="profile-open" data-id="'+esc(u.id)+'">👤 '+esc(u.name||'عضو')+'</button>');});posts.filter(function(p){return (p.t||'').toLocaleLowerCase().includes(n);}).slice(0,10).forEach(function(p){out.push('<button class="btn alt" data-action="post-jump" data-id="'+esc(p.id)+'">📝 '+esc((p.t||'').slice(0,90))+'</button>');});pages.filter(function(p){return (p.name||'').toLocaleLowerCase().includes(n);}).slice(0,5).forEach(function(p){out.push('<span class="chip">📄 '+esc(p.name)+'</span>');});groups.filter(function(g){return (g.name||'').toLocaleLowerCase().includes(n);}).slice(0,5).forEach(function(g){out.push('<span class="chip">👥 '+esc(g.name)+'</span>');});box.innerHTML=out.length?out.join(''):'لا توجد نتائج محلية. البحث الشامل يتطلب محرك فهرسة خارجي.';}
function creatorView(){var ownPosts=posts.filter(function(p){return p.uid===me.uid;}),ownReels=reels.filter(function(r){return r.uid===me.uid;}),views=ownReels.reduce(function(n,r){return n+(Number(r.views)||0);},0),likesCount=ownPosts.reduce(function(n,p){return n+(Number(p.likes)||0);},0)+ownReels.reduce(function(n,r){return n+(Number(r.likes)||0);},0),followers=countFollowers(me.uid),eng=views?((likesCount+ownPosts.reduce(function(n,p){return n+(Number(p.comments)||0);},0))/views*100):0;return '<h2>Creator Center</h2><div class="grid"><div><b>'+views+'</b>مشاهدات ريلز</div><div><b>'+likesCount+'</b>إعجابات</div><div><b>'+eng.toFixed(1)+'%</b>تفاعل تقريبي</div><div><b>'+followers+'</b>متابعاً</div></div><section class="card"><h3>نمو الجمهور</h3><p class="note">المتاح حالياً لقطة آنية من البيانات التي حمّلها التطبيق؛ لا توجد أحداث تاريخية مجمّعة أو تقارير أرباح موثقة.</p><h3>محتواي</h3>'+ownPosts.slice(0,10).map(postCard).join('')+'</section>'+(isAdmin?'<section class="card"><h3>صندوق المبدعين</h3><p class="note">إظهار الرصيد يتطلب اعتماد سجلات server-side لـ creatorFund؛ لا نعرض إيرادات تقديرية كأنها مدفوعات حقيقية.</p></section>':'');}
var catalog={marketplace:{title:'Marketplace',col:'marketplace',owner:'ownerId'},jobs:{title:'الوظائف',col:'jobPosts',owner:'ownerId'},academy:{title:'الأكاديمية',col:'courses',owner:'ownerId'}};
function catalogView(kind){var cfg=catalog[kind],records=window.__catalog&&window.__catalog[kind]||[];var form=kind==='marketplace'?'<input id="item-category" maxlength="60" placeholder="التصنيف"><input id="item-price" type="number" min="0" step="0.01" placeholder="السعر"><input id="item-currency" maxlength="3" value="USD" placeholder="العملة">':kind==='jobs'?'<input id="item-company" maxlength="120" placeholder="الشركة"><input id="item-location" maxlength="120" placeholder="الموقع / عن بُعد"><input id="item-category" maxlength="60" placeholder="التخصص">':'<input id="item-category" maxlength="60" placeholder="التصنيف"><input id="item-language" maxlength="16" value="ar" placeholder="لغة الدورة"><textarea id="item-description" maxlength="2000" placeholder="وصف الدورة"></textarea>';return '<h2>'+cfg.title+'</h2><div class="card"><input id="item-title" maxlength="160" placeholder="العنوان"><textarea id="item-body" maxlength="3000" placeholder="التفاصيل"></textarea>'+form+'<button class="btn" data-action="catalog-create" data-kind="'+kind+'">إنشاء</button></div><div>'+records.map(function(x){return '<article class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||x.body||'')+'</p><span class="chip">'+esc(x.category||x.location||x.language||'')+'</span>'+(x.price!=null?'<b> '+esc(x.currency||'USD')+' '+Number(x.price).toFixed(2)+'</b>':'')+(x.ownerId===me.uid?'<div class="row"><button class="mini" data-action="catalog-edit" data-kind="'+kind+'" data-id="'+esc(x.id)+'">تعديل</button><button class="mini" data-action="catalog-delete" data-kind="'+kind+'" data-id="'+esc(x.id)+'">حذف</button></div>':kind==='jobs'?'<button class="mini" data-action="apply-job" data-id="'+esc(x.id)+'">التقديم</button>':'')+'</article>';}).join('')+'</div>';}
function aiView(){return '<section class="card"><h2>✨ Hashid AI</h2><p class="note">مساعد صياغة محلي بدون إرسال بياناتك إلى مزود خارجي. لا يمثل نموذجاً توليدياً سحابياً.</p><textarea id="ai-prompt" maxlength="2000" placeholder="اكتب فكرة المنشور"></textarea><div class="row"><button class="btn" data-action="ai-generate">صياغة مسودة</button><button class="btn alt" data-action="ai-translate">ترجمة عبر المتصفح</button></div><pre id="ai-output" class="body"></pre></section>';}
function verificationView(){return '<section class="card"><h2>طلب التحقق</h2><p class="note">التحقق يراجعه فريق المنصة؛ إرسال الطلب لا يمنح الشارة.</p><select id="verify-type"><option value="creator">Creator</option><option value="business">Business</option><option value="organization">Organization</option></select><textarea id="verify-reason" maxlength="500" placeholder="اشرح سبب الطلب"></textarea><button class="btn" data-action="verify-submit">إرسال الطلب</button></section>';}
function messagesView(){return '<section class="card"><h2>الرسائل</h2><p class="note">تُحمّل أحدث المحادثات فقط. اختر محادثة من ملف المستخدم لبدئها.</p>'+messages.slice(0,30).map(function(m){return '<div class="cm">'+esc(m.t||'رسالة')+'</div>';}).join('')+'</section>';}
function view(){switch(tab){case'reels':return reelsView();case'search':return searchView();case'profile':return profileView();case'creator':return creatorView();case'ai':return aiView();case'marketplace':return catalogView('marketplace');case'jobs':return catalogView('jobs');case'academy':return catalogView('academy');case'verification':return verificationView();case'messages':return messagesView();default:return homeView();}}
function render(){var root=$('#app');if(!root)return;if(!me){root.innerHTML=header()+'<main class="wrap"><section class="card"><h1>HashidHub</h1><p>المنصة غير متاحة مؤقتاً حتى استعادة إعداد الدخول.</p><a href="https://hashid-net.firebaseapp.com">فتح تسجيل الدخول عبر Firebase</a></section></main>'+bottomNav();return;}root.innerHTML=header()+'<main class="wrap">'+view()+'<aside class="desktop-rail"><section class="card discovery-card"><h3>مساحتك في HashidHub</h3><p>اكتشف المجتمعات والمحتوى وصنّاعه.</p><button class="btn alt" data-tab="creator">لوحة المبدع</button></section><section class="card"><button class="mini" data-tab="ai">✨ Hashid AI</button><button class="mini" data-tab="marketplace">🛍️ السوق</button><button class="mini" data-tab="jobs">💼 وظائف</button><button class="mini" data-tab="academy">🎓 أكاديمية</button></section></aside></main>'+bottomNav();}
async function loadCollection(kind){if(!me)return;var cfg=catalog[kind];try{var s=await getDocs(query(collection(db,cfg.col),where('status','==','published'),orderBy('createdAt','desc'),limit(30)));window.__catalog=window.__catalog||{};window.__catalog[kind]=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});scheduleRender();}catch(e){showError(e);}}
function watchCatalog(){Object.keys(catalog).forEach(function(kind){var cfg=catalog[kind];track(onSnapshot(query(collection(db,cfg.col),where('status','==','published'),orderBy('createdAt','desc'),limit(20)),function(s){window.__catalog=window.__catalog||{};window.__catalog[kind]=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});scheduleRender();},function(e){console.warn('catalog query',cfg.col,e.code);}));});}
async function createPost(){if(!me)return;var text=($('#compose')&&$('#compose').value||'').trim();if(!text)return toast('اكتب محتوى المنشور أولاً');try{var data={uid:me.uid,name:prof.name||'',t:text,ts:Date.now(),privacy:'public'};await addDoc(collection(db,'posts'),data);awardLocal('post_created',5);toast('تم نشر المنشور');}catch(e){showError(e);}}
async function awardLocal(reason,points){if(!me)return;/* Client never writes XP: awards require a trusted server workflow. */toast('تم تسجيل النشاط. نقاط XP الموثقة تتطلب خدمة خلفية.');}
async function postLike(id){if(!me)return;var ref=doc(db,'likes',id+'_'+me.uid),has=likes.some(function(l){return l.pid===id;});try{if(has)await deleteDoc(ref);else await setDoc(ref,{pid:id,uid:me.uid,ts:Date.now()});}catch(e){showError(e);}}
async function sendComment(id){var input=$('[data-comment="'+CSS.escape(id)+'"]');if(!me||!input||!input.value.trim())return;try{await addDoc(collection(db,'comments'),{pid:id,uid:me.uid,name:prof.name||'',t:input.value.trim().slice(0,2000),ts:Date.now()});input.value='';}catch(e){showError(e);}}
async function catalogCreate(kind){var cfg=catalog[kind],title=($('#item-title')?.value||'').trim(),body=($('#item-body')?.value||'').trim();if(!title||!body)return toast('يرجى إدخال العنوان والتفاصيل');var data={ownerId:me.uid,title:title.slice(0,160),description:body.slice(0,3000),status:'published',createdAt:Date.now(),updatedAt:Date.now(),category:($('#item-category')?.value||'').trim()};if(kind==='marketplace'){data.price=Math.max(0,Number($('#item-price').value)||0);data.currency=(($('#item-currency').value||'USD').toUpperCase()).slice(0,3);}if(kind==='jobs'){data.company=($('#item-company').value||'').trim();data.location=($('#item-location').value||'').trim();}if(kind==='academy'){data.language=($('#item-language').value||'ar').trim();}try{await addDoc(collection(db,cfg.col),data);toast('تمت الإضافة');}catch(e){showError(e);}}
async function verifySubmit(){var reason=($('#verify-reason')?.value||'').trim();if(reason.length<10)return toast('يرجى كتابة سبب واضح (10 أحرف على الأقل)');try{await addDoc(collection(db,'verificationRequests'),{uid:me.uid,type:$('#verify-type').value,reason:reason.slice(0,500),status:'pending',createdAt:Date.now()});toast('وصل طلبك للمراجعة');}catch(e){showError(e);}}
function bind(){document.addEventListener('click',async function(e){var nav=e.target.closest('[data-tab]');if(nav){tab=nav.dataset.tab;activeProfile=null;closeMenu();render();if(catalog[tab])loadCollection(tab);return;}var feed=e.target.closest('[data-feed]');if(feed){feedMode=feed.dataset.feed;render();return;}var b=e.target.closest('[data-action]');if(!b)return;var a=b.dataset.action,id=b.dataset.id;try{if(a==='menu-toggle'){var m=$('#menu');m.classList.toggle('open');b.setAttribute('aria-expanded',m.classList.contains('open'));}else if(a==='logout'){stopListeners();await signOut(auth);}else if(a==='theme'){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('hn_theme',document.documentElement.dataset.theme);}else if(a==='post-create')await createPost();else if(a==='post-like')await postLike(id);else if(a==='comment-send')await sendComment(id);else if(a==='comment-focus')$('[data-comment="'+CSS.escape(id)+'"]')?.focus();else if(a==='post-delete'){if(confirm('حذف المنشور؟'))await deleteDoc(doc(db,'posts',id));}else if(a==='post-share'){if(navigator.share)await navigator.share({title:'HashidHub',url:location.origin+'/#p='+id});else{await navigator.clipboard.writeText(location.origin+'/#p='+id);toast('تم نسخ الرابط');}}else if(a==='profile-open'){activeProfile=id;tab='profile';render();}else if(a==='profile-save'){var skills=($('#profile-skills').value||'').split(',').map(function(x){return x.trim();}).filter(Boolean).slice(0,20);await updateDoc(doc(db,'users',me.uid),{name:($('#profile-name').value||'').trim().slice(0,40),bio:($('#profile-bio').value||'').trim().slice(0,200),skills:skills});toast('تم حفظ الملف');}else if(a==='follow'){var ref=doc(db,'follows',me.uid+'_'+id),has=follows.some(function(f){return f.b===id;});if(has)await deleteDoc(ref);else await setDoc(ref,{a:me.uid,b:id,ts:Date.now()});}else if(a==='search-open'){tab='search';render();$('#global-search')?.focus();}else if(a==='feed-more')await loadMorePosts();else if(a==='catalog-create')await catalogCreate(b.dataset.kind);else if(a==='catalog-delete'){var c=catalog[b.dataset.kind];if(confirm('حذف العنصر؟'))await deleteDoc(doc(db,c.col,id));}else if(a==='catalog-edit'){var c2=catalog[b.dataset.kind],old=(window.__catalog||{})[b.dataset.kind]?.find(function(x){return x.id===id;});if(!old)return;var title=prompt('العنوان',old.title);if(title===null)return;var description=prompt('التفاصيل',old.description||'');if(description===null)return;await updateDoc(doc(db,c2.col,id),{title:title.slice(0,160),description:description.slice(0,3000),updatedAt:Date.now()});}else if(a==='apply-job'){var jobId=id,docRef=await addDoc(collection(db,'applications'),{jobId:jobId,applicantId:me.uid,ownerId:'pending-owner',status:'submitted',createdAt:Date.now()});toast('تم إرسال التقديم');}else if(a==='verify-submit')await verifySubmit();else if(a==='ai-generate'){var text=($('#ai-prompt').value||'').trim();$('#ai-output').textContent=text?'مسودة مقترحة:\n\n'+text+'\n\nما الفكرة التي تضيفها من تجربتك؟':'اكتب فكرة أولاً';}else if(a==='ai-translate'){var tx=($('#ai-prompt').value||'').trim();$('#ai-output').textContent=tx?await translateBrowser(tx):'اكتب نصاً للترجمة';}else if(a==='ai-comment'){var inp=$('[data-comment="'+CSS.escape(id)+'"]');if(inp)inp.value='شكراً لمشاركة هذا المحتوى! أحببت الفكرة، ما أبرز خطوة تقترحها للبدء؟';}else if(a==='reel-open'){var r=reels.find(function(x){return x.id===id;});if(r&&r.videoUrl)window.open(r.videoUrl,'_blank','noopener');}else if(a==='story-add'){toast('إضافة قصة تتطلب اختيار وسيط من واجهة القصص.');}else if(a==='story-view'){toast('عرض القصة متاح من قائمة القصص.');}else if(a==='post-jump'){tab='home';render();setTimeout(function(){document.querySelector('[data-post="'+CSS.escape(id)+'"]')?.scrollIntoView({behavior:'smooth'});},100);}}catch(err){showError(err);}});
 document.addEventListener('input',function(e){if(e.target.id==='global-search'){clearTimeout(searchTimer);searchTimer=setTimeout(function(){searchLocal(e.target.value);},180);}});
 document.addEventListener('change',async function(e){if(e.target.id==='post-image'){var f=e.target.files&&e.target.files[0];if(f)toast('تم اختيار '+f.name+'؛ إرفاق الوسائط متاح عبر الواجهة الأصلية.');}});
}
function closeMenu(){var m=$('#menu');if(m)m.classList.remove('open');}
async function loadMorePosts(){if(streamState.loading||!streamState.more||!streamState.cursor)return;streamState.loading=true;try{var q=query(collection(db,'posts'),orderBy('ts','desc'),startAfter(streamState.cursor),limit(25));var s=await getDocs(q);var extra=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});posts=posts.concat(extra);streamState.cursor=extra.length?extra[extra.length-1]:streamState.cursor;streamState.more=extra.length===25;}catch(e){showError(e);}finally{streamState.loading=false;scheduleRender();}}
async function translateBrowser(text){var lang=localStorage.getItem('hh_lang')||'ar';if(!('Translator' in self))return 'الترجمة التلقائية غير متاحة في هذا المتصفح. النص الأصلي:\n'+text;try{var translator=await self.Translator.create({sourceLanguage:'ar',targetLanguage:lang==='ar'?'en':lang});var result=await translator.translate(text);translator.destroy&&translator.destroy();return result;}catch(_){return text;}}
async function initPush(){try{if(!('serviceWorker'in navigator)||!('Notification'in window))return;var supported=await messagingIsSupported().catch(function(){return false;});if(!supported)return;messaging=getMessaging(app);onMessage(messaging,function(p){toast((p.notification&&p.notification.title)||'HashidHub');});}catch(e){console.warn('FCM init',e);}}
initPush();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(function(e){console.warn('SW register',e);});
bind();onAuthStateChanged(auth,async function(user){stopListeners();me=user;if(!user){prof=null;startGuestListeners();render();return;}try{var snap=await getDoc(doc(db,'users',user.uid));prof=snap.exists()?snap.data():{name:user.displayName||user.email||'عضو',photo:user.photoURL||''};if(!snap.exists())await setDoc(doc(db,'users',user.uid),Object.assign({},prof,{ts:Date.now(),verified:false}));var admin=await getDoc(doc(db,'admins',user.uid));isAdmin=admin.exists();}catch(e){console.warn(e);prof={name:user.displayName||'عضو',photo:user.photoURL||''};}window.__catalog={marketplace:[],jobs:[],academy:[]};startBaseListeners();watchCatalog();render();});
</script>
