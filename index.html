<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7a5f">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<script src="media-config.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HashidHub — تواصل، شارك، وانطلق</title>
<meta name="description" content="HashidHub منصة اجتماعية تجمع الأصدقاء والمجتمعات والمقاطع القصيرة في مكان واحد.">
<meta property="og:title" content="HashidHub">
<meta property="og:description" content="مساحتك للتواصل والمشاركة وصناعة المجتمع.">
<script>
try{
  var t = localStorage.getItem("hn_theme");
  if(t) document.documentElement.dataset.theme = t;
}catch(e){}
</script>
<style>
:root{
  --bg:#f0f7f4;--card:#ffffff;--ink:#0f1f1a;--mute:#5a6b63;--line:#d4e5dc;
  --brand:#0d7a5f;--brand2:#0f9a75;--gold:#d4a017;--like:#e11d48;
  --sh:0 2px 8px rgba(13,122,95,.08)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1210;--card:#15201c;--ink:#e8f0ec;--mute:#8fa39a;--line:#24332c;
    --brand:#2dd4a8;--brand2:#1faf8a;--gold:#f0c14b;--like:#fb7185;
    --sh:0 2px 12px rgba(0,0,0,.45)
  }
}
:root[data-theme="dark"]{
  --bg:#0c1210;--card:#15201c;--ink:#e8f0ec;--mute:#8fa39a;--line:#24332c;
  --brand:#2dd4a8;--brand2:#1faf8a;--gold:#f0c14b;--like:#fb7185;
  --sh:0 2px 12px rgba(0,0,0,.45)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px;box-shadow:var(--sh)}
.logo{font-size:1.4rem;font-weight:800}
.logo b{color:#ffd27a}
.hbtn{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.15);color:#fff;font-weight:600;font-size:.9rem}
.hbtn:active{background:rgba(255,255,255,.28)}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.av.sm{width:32px;height:32px}
.av.lg{width:84px;height:84px}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}
textarea,input[type=text],input[type=url],input[type=email],input[type=password],input[type=tel],input[type=search],input[type=number]{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
textarea{resize:vertical;min-height:70px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;max-width:100%}
.btn{background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.gold{background:linear-gradient(135deg,#e0a94a,#c8902b);color:#fff}
.btn.red{background:#b3261e;color:#fff}
.btn.gray{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.btn.big{width:100%;padding:13px;font-size:1.05rem;border-radius:12px}
.name{font-weight:700;text-align:start;background:none;color:inherit;padding:0}
.time{font-size:.8rem;color:var(--mute)}
.mini{font-size:.8rem;color:var(--mute);padding:4px 8px;border-radius:8px}
.mini:active{background:var(--bg)}
.body{white-space:pre-wrap;word-break:break-word;margin:6px 0 10px}
.media{max-width:100%;max-height:480px;border-radius:10px;display:block;margin:6px 0;cursor:zoom-in}
.media.vid{max-height:600px;width:100%;cursor:default}
.stats{font-size:.85rem;color:var(--mute);display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.acts{display:flex;justify-content:space-around;padding-top:6px}
.acts button{padding:8px 12px;border-radius:8px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:4px}
.acts .on{color:var(--like)}
.cm{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.95rem;word-break:break-word}
.cm small{color:var(--mute)}
.ad{border:1.5px dashed var(--gold);position:relative}
.tag{font-size:.7rem;color:var(--gold);font-weight:700;position:absolute;top:8px;inset-inline-end:12px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.note{font-size:.8rem;color:var(--mute)}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tools label{cursor:pointer;color:var(--brand);font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid div{background:var(--bg);border-radius:10px;padding:10px}
.grid b{display:block;font-size:1.4rem;color:var(--brand)}
.login{max-width:400px;margin:6vh auto}
.login h1{text-align:center;color:var(--brand);font-size:2.2rem;margin:0}
.login h1 b{color:var(--gold)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.tabs .on{background:var(--brand);color:#fff;border-color:var(--brand)}
h3{margin:0 0 10px;font-size:1.05rem}
.err{color:#b3261e;font-size:.9rem;min-height:1.4em;margin-top:6px}
.vb{width:.9em;height:.9em;vertical-align:-.13em;margin-inline-start:3px;flex:none}
.crown{width:1em;height:1em;vertical-align:-.15em;margin-inline-start:3px}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.chip.green{background:#e7f5ef;color:var(--brand);border-color:transparent}
.chip.gold{background:linear-gradient(135deg,#ffe9bd,#f7d488);color:#7a5410;border-color:transparent}

/* زر المتابعة البارز */
.fbtn{flex:1;padding:11px;border-radius:12px;font-weight:800;font-size:.95rem}
.fbtn.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 3px 10px rgba(15,107,79,.35)}
.fbtn.off{background:var(--bg);color:var(--brand);border:1.5px solid var(--brand)}

.pcard{background:linear-gradient(160deg,var(--card),var(--bg));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

.sug-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sug-row:last-child{border-bottom:0}

.pg-card{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.pg-av{width:56px;height:56px;border-radius:16px;object-fit:cover;background:var(--line);flex:none}
.pg-av.round{border-radius:50%}

.bnav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:.68rem;padding:6px 4px;position:relative;font-weight:600}
.bnav button.on{color:var(--brand)}
.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav b{position:absolute;top:2px;inset-inline-end:calc(50% - 18px);background:#c2410c;color:#fff;border-radius:999px;font-size:.6rem;padding:1px 5px;min-width:16px;text-align:center}
.bnav b:empty{display:none}

#toast{position:fixed;bottom:84px;inset-inline:20px;background:#1f2a24;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;font-size:.9rem}
#toast.show{transform:translateY(0);opacity:1}

.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 4px;margin-bottom:12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-bubble{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--mute)}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--gold),var(--brand));display:flex;align-items:center;justify-content:center}
.story-ring.seen{background:var(--line)}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--card);background:var(--card)}
.story-ring .new{background:var(--card);color:var(--brand);width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:300}
.story-viewer{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.story-progress{display:flex;gap:4px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top))}
.story-progress i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-progress i.done{background:#fff}
.story-progress i.on{background:rgba(255,255,255,.5)}
.story-head{display:flex;align-items:center;gap:10px;padding:0 16px 10px;color:#fff}
.story-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.story-body img{max-width:100%;max-height:100%;object-fit:contain}
.story-cap{position:absolute;bottom:20px;inset-inline:16px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);text-align:center}

.reel-page{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.reel-cell{position:relative;display:block;width:100%;padding:0;text-align:inherit;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;border:0;color:#fff}
.reel-cell video{width:100%;height:100%;object-fit:cover}
.reel-meta{position:absolute;bottom:0;inset-inline:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:.78rem;display:block}.reel-play-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:999px;background:#0009;color:#fff;font-weight:700;pointer-events:none}

.reel-player{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel-player::-webkit-scrollbar{display:none}
.reel-item{height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;flex:0 0 100vh;flex-basis:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.reel-item video{width:100%;height:100%;object-fit:contain;max-height:100vh}
.reel-info{position:absolute;bottom:80px;inset-inline:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.reel-info .u{display:flex;flex-direction:column;gap:6px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.reel-actions{display:flex;flex-direction:column;gap:16px;align-items:center}
.reel-actions button{color:#fff;display:flex;flex-direction:column;align-items:center;font-size:.75rem;gap:2px}
.reel-retry{color:#fff;background:#1877f2;padding:8px 14px;border-radius:999px;pointer-events:auto}.reel-sound{position:absolute;top:calc(20px + env(safe-area-inset-top));inset-inline-start:16px;color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:9px 13px;z-index:70;font-size:.85rem}.reel-close{position:absolute;top:20px;inset-inline-end:16px;color:#fff;background:rgba(0,0,0,.5);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;z-index:70}
.brand-sub{font-size:.66rem;opacity:.86;font-weight:500;letter-spacing:.02em}
.reel-shelf{display:flex;gap:9px;overflow-x:auto;padding:4px 1px 12px;scrollbar-width:none}
.reel-shelf::-webkit-scrollbar{display:none}
.reel-tile{flex:0 0 116px;height:190px;border-radius:13px;overflow:hidden;background:#111;position:relative;color:#fff;border:1px solid var(--line)}
.reel-tile video{width:100%;height:100%;object-fit:cover}
.reel-tile span{position:absolute;inset-inline:6px;bottom:6px;font-size:.72rem;text-shadow:0 1px 4px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-wrap{position:relative;background:#0d1110;border-radius:10px;overflow:hidden;margin:6px 0}
.video-wrap .media{margin:0;border-radius:0}.feed-sound{position:absolute;z-index:4;top:10px;inset-inline-end:10px;padding:7px 10px;border-radius:999px;background:#000a;color:#fff;font-size:.78rem}
.video-loader{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.32);color:#fff;pointer-events:none;text-align:center;font-size:.84rem}
.video-wrap.is-loading .video-loader{display:flex}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.upload-banner{position:fixed;z-index:300;left:16px;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));max-width:520px;margin:auto;background:var(--card);border:1px solid #1877f2;border-radius:14px;padding:13px 15px;box-shadow:0 8px 32px #0002}
.upload-banner strong{display:block;color:#1877f2;margin-bottom:7px}
.upload-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.upload-track i{display:block;height:100%;width:38%;background:#1877f2;border-radius:99px;animation:uploadPulse 1.15s ease-in-out infinite alternate}
@keyframes uploadPulse{from{transform:translateX(160%)}to{transform:translateX(-10%)}}
.loading-soft{margin:12px 0;padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mute);text-align:center}
.reel-item .reel-loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.3);pointer-events:none;color:white}
.reel-item.is-loading .reel-loader{display:flex}
.reel-item .reel-info{z-index:2}
@media(min-width:800px){.wrap{max-width:760px}.reel-tile{flex-basis:132px;height:210px}}

.search-tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.search-tabs button{padding:6px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.85rem;white-space:nowrap}
.search-tabs .on{background:var(--brand);color:#fff;border-color:var(--brand)}
.hashtag{color:var(--brand);font-weight:700}
.mention{color:var(--gold);font-weight:700}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-in{background:var(--card);border-radius:16px;padding:20px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:85vh;overflow-y:auto}
.modal-in h3{margin-top:0}
.modal-in .btn{width:100%;margin-top:8px}

/* المكالمات */
.call-ui{position:fixed;inset:0;background:#0b0f0d;z-index:120;display:flex;flex-direction:column}
.call-remote{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.call-remote video{width:100%;height:100%;object-fit:cover}
.call-local{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;width:110px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#222;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.call-local video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.call-info{position:absolute;top:calc(20px + env(safe-area-inset-top));inset-inline-start:18px;color:#fff;z-index:5;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.call-info b{font-size:1.2rem}
.call-status{font-size:.85rem;opacity:.85}
.call-bar{display:flex;justify-content:center;gap:18px;padding:22px 0 calc(26px + env(safe-area-inset-bottom));background:rgba(0,0,0,.35)}
.call-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);color:#fff}
.call-btn.end{background:#d93025}
.call-btn.on{background:#fff;color:#111}
.incoming{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:130;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff}

.premium-hero{background:linear-gradient(135deg,#1c1408,#3a2c10);border:1.5px solid var(--gold);border-radius:16px;padding:18px;color:#ffe9bd;margin-bottom:12px}
.premium-hero h2{margin:0 0 6px;color:#ffd27a}
.feat{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(200,144,43,.25)}
.feat:last-child{border-bottom:0}
.feat .ic{width:34px;height:34px;border-radius:10px;background:rgba(200,144,43,.18);display:flex;align-items:center;justify-content:center;flex:none;font-size:1.1rem}

.reaction-picker{display:flex;gap:4px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 8px 28px rgba(0,0,0,.15);margin:6px 0;animation:pop .18s ease}
.reaction-picker button{font-size:1.45rem;padding:4px 8px;border-radius:50%;transition:transform .12s}
.reaction-picker button:active{transform:scale(1.25)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet-in{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:12px 16px 28px;box-shadow:0 -8px 32px rgba(0,0,0,.2);max-height:80vh;overflow:auto}
.sheet-in h3{margin:4px 0 12px;text-align:center}
.sheet-opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 10px;border-radius:12px;font-weight:600;font-size:1rem;text-align:start}
.sheet-opt:active,.sheet-opt:hover{background:var(--bg)}
.sheet-opt.danger{color:#b3261e}
.cm{position:relative}
.cm .cm-actions{display:none;gap:6px;margin-top:4px}
.cm.show-actions .cm-actions{display:flex;flex-wrap:wrap}
.cm-reply{margin-inline-start:28px;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.cm.hidden-cm{opacity:.45}
.cm.hidden-cm .cm-body{font-style:italic;color:var(--mute)}
.stats-react{display:flex;gap:6px;flex-wrap:wrap;font-size:.82rem}
.stats-react span{background:var(--bg);padding:2px 8px;border-radius:999px}
.acts button{transition:color .15s,background .15s}
.acts button:active{background:var(--bg)}
.menu-section-label{padding:8px 12px 4px;font-size:.78rem;font-weight:800;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.settings-list label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.settings-list input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.install-box .btn{font-size:.95rem}


.reel-side-actions{position:absolute;inset-inline-end:12px;bottom:100px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:5}
.rsa{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:.75rem;font-weight:700;background:none;border:0;padding:0}
.rsa-ico{font-size:1.7rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.rsa-n{font-size:.72rem}
.rsa-av{width:42px;height:42px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#333}
.reel-info{position:absolute;bottom:70px;inset-inline-start:14px;inset-inline-end:70px;z-index:4;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.reel-info .u b{display:block;font-size:1rem;margin-bottom:4px}

<script type="module">
import {firebaseConfig} from "./firebase-config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

var messaging = null;
async function initPushNotifications(){
  try{
    if(!("Notification" in window) || !("serviceWorker" in navigator)) return;
    var supported = await messagingIsSupported().catch(function(){ return false; });
    if(!supported) return;
    messaging = getMessaging(app);
    onMessage(messaging, function(payload){
      var title = (payload.notification && payload.notification.title) || "HashidHub";
      var body = (payload.notification && payload.notification.body) || "لديك إشعار جديد";
      toast("🔔 " + title + ": " + body, 4000);
      try{
        if(Notification.permission === "granted"){
          new Notification(title, { body: body, icon: "icon.svg", tag: "hh-fcm" });
        }
      }catch(e){}
    });
  }catch(e){ console.warn("FCM init", e); }
}
async function enablePushNotifications(){
  try{
    if(!("Notification" in window)){ toast("المتصفح لا يدعم الإشعارات"); return; }
    var perm = await Notification.requestPermission();
    if(perm !== "granted"){ toast("لم يتم منح إذن الإشعارات"); return; }
    if(!messaging){
      var supported = await messagingIsSupported().catch(function(){ return false; });
      if(!supported){ toast("الإشعارات الفورية غير مدعومة على هذا الجهاز"); return; }
      messaging = getMessaging(app);
    }
    // ضع مفتاح VAPID من Firebase Console → Project Settings → Cloud Messaging
    var vapidKey = (typeof window !== "undefined" && window.__HH_VAPID_KEY) || "";
    var reg = await navigator.serviceWorker.ready;

    if(vapidKey) tokenOpts.vapidKey = vapidKey;
    var token = await getToken(messaging, tokenOpts);
    if(token && me){
      await setDoc(doc(db, "users", me.uid), { fcmToken: token, fcmUpdatedAt: Date.now() }, { merge: true });
      toast("تم تفعيل الإشعارات الفورية");
    } else {
      toast("تم منح الإذن. أكمل إعداد VAPID في Firebase لتصل الإشعارات والجهاز مغلق.");
    }
  }catch(e){
    console.warn(e);
    toast("تعذر تفعيل الإشعارات: " + ((e && e.message) || "خطأ"));
  }
}
initPushNotifications();

function ago(ts){
  if(!ts) return "الآن";
  var s = (Date.now() - ts) / 1000;
  if(s < 60) return "الآن";
  if(s < 3600) return "منذ " + Math.floor(s/60) + " دقيقة";
  if(s < 86400) return "منذ " + Math.floor(s/3600) + " ساعة";
  if(s < 2592000) return "منذ " + Math.floor(s/86400) + " يوم";
  return new Date(ts).toLocaleDateString("ar");
}

    '<button class="btn gray" style="width:100%;margin-top:10px" data-si="close">إلغاء</button></div>';

    var opt = options[+si];
    d.remove();
    if(opt && opt.action) opt.action();
  });

async function compressImage(file, maxBytes){
  maxBytes = maxBytes || (1200 * 1024); // ~1.2MB هدف
  if(!file || !/^image\//.test(file.type) || file.type === "image/gif" || file.type === "image/svg+xml") return file;
  // حتى الصور الصغيرة نسبياً نضغطها إن تجاوزت الحد
  if(file.size <= maxBytes && file.size <= 900 * 1024) return file;
  try{
    var bitmap;
    if("createImageBitmap" in window){
      bitmap = await createImageBitmap(file);
    } else {
      bitmap = await new Promise(function(resolve, reject){
        var img = new Image();
        img.onload = function(){ resolve(img); };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    var maxSide = 1920;
    var w = bitmap.width || bitmap.naturalWidth;
    var h = bitmap.height || bitmap.naturalHeight;
    var scale = Math.min(1, maxSide / Math.max(w, h));
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(w * scale));
    canvas.height = Math.max(1, Math.round(h * scale));
    var ctx = canvas.getContext("2d", { alpha: false, colorSpace: "srgb" });
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    try{ if(bitmap.close) bitmap.close(); }catch(e){}
    var quality = 0.82;
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, "image/jpeg", quality); });
    while(blob && blob.size > maxBytes && quality > 0.45){
      quality -= 0.08;
      blob = await new Promise(function(resolve){ canvas.toBlob(resolve, "image/jpeg", quality); });
    }
    // إن بقيت كبيرة صغّر الأبعاد أكثر
    while(blob && blob.size > maxBytes && canvas.width > 720){
      canvas.width = Math.round(canvas.width * 0.8);
      canvas.height = Math.round(canvas.height * 0.8);
      ctx = canvas.getContext("2d", { alpha: false });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // نحتاج إعادة رسم من blob السابق كصورة
      var tmp = await createImageBitmap(blob);
      ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
      try{ tmp.close(); }catch(e){}
      quality = 0.75;
      blob = await new Promise(function(resolve){ canvas.toBlob(resolve, "image/jpeg", quality); });
    }
    if(!blob) return file;
    var name = (file.name || "image").replace(/\.\w+$/, "") + ".jpg";
    return new File([blob], name, { type: "image/jpeg", lastModified: Date.now() });
  }catch(err){
    console.warn("compress failed", err);
    return file;
  }
}


/* ============ رفع الوسائط: Worker تيليجرام (بث مباشر عبر Cloudflare، لا يمرّ بـ Vercel) ============ */
var MEDIA_MAX_SRC = 50 * 1024 * 1024; // أقصى حجم لفيديو يختاره المستخدم
var MEDIA_MAX_OUT = 19 * 1024 * 1024; // أقصى حجم يُخزَّن (حد تحميل Bot API هو 20MB)
function mediaErr(msg){ return Object.assign(new Error(msg), {code: "media"}); }
function mediaApi(){
  var u = String(window.HH_MEDIA_API || "").replace(/\/+$/, "");
  if(!u || /YOUR-SUBDOMAIN/.test(u)) throw mediaErr("خدمة الوسائط غير مضبوطة بعد: عدّل media-config.js");
  return u;
}

/* ضغط الفيديو داخل المتصفح (إعادة ترميز بـ MediaRecorder بزمن التشغيل الحقيقي) */
async function compressVideo(file, onProgress){
  if(typeof MediaRecorder === "undefined" || !HTMLCanvasElement.prototype.captureStream)
    throw mediaErr("متصفحك لا يدعم ضغط الفيديو. اختر فيديو أصغر من 19MB.");
  var url = URL.createObjectURL(file), v = document.createElement("video"), actx = null, stream = null, stopped = false;
  function cleanup(){
    stopped = true;
    try{ v.pause(); }catch(e){}
    try{ if(stream) stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    try{ if(actx) actx.close(); }catch(e){}
    URL.revokeObjectURL(url); v.removeAttribute("src");
  }
  try{
    v.playsInline = true; v.preload = "auto"; v.src = url;
    await new Promise(function(res, rej){ v.onloadedmetadata = res; v.onerror = function(){ rej(mediaErr("تعذّر قراءة الفيديو")); }; });
    var dur = v.duration;
    if(!isFinite(dur) || dur <= 0) throw mediaErr("تعذّر معرفة مدة الفيديو");
    if(dur > 300) throw mediaErr("الفيديو أطول من 5 دقائق. قصّه أو اختر فيديو أصغر من 19MB.");
    var vw = v.videoWidth, vh = v.videoHeight;
    var sc = Math.min(1, 1280 / Math.max(vw, vh), 720 / Math.min(vw, vh));
    var cw = Math.max(2, Math.round(vw * sc / 2) * 2), ch = Math.max(2, Math.round(vh * sc / 2) * 2);
    var audioBps = 96000;
    var vbps = Math.min(2500000, Math.floor((MEDIA_MAX_OUT * 0.88 * 8) / dur - audioBps));
    if(vbps < 300000) throw mediaErr("الفيديو طويل جداً بالنسبة لحجمه. قصّه أو اختر فيديو أصغر.");
    var canvas = document.createElement("canvas"); canvas.width = cw; canvas.height = ch;
    var ctx = canvas.getContext("2d", {alpha: false});
    stream = canvas.captureStream(30);
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      actx = new AC();
      var node = actx.createMediaElementSource(v), dest = actx.createMediaStreamDestination();
      node.connect(dest); // لا نوصله بالسماعات: التسجيل صامت للمستخدم
      dest.stream.getAudioTracks().forEach(function(t){ stream.addTrack(t); });
      if(actx.state === "suspended") await actx.resume();
    }catch(e){ actx = null; v.muted = true; }
    var mime = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].filter(function(m){ return MediaRecorder.isTypeSupported(m); })[0];
    var rec = new MediaRecorder(stream, mime ? {mimeType: mime, videoBitsPerSecond: vbps, audioBitsPerSecond: audioBps} : {videoBitsPerSecond: vbps});
    var chunks = [];
    rec.ondataavailable = function(e){ if(e.data && e.data.size) chunks.push(e.data); };
    var finished = new Promise(function(res){ rec.onstop = res; });
    v.onended = function(){ stopped = true; try{ rec.stop(); }catch(e){} };
    v.onerror = function(){ stopped = true; try{ rec.stop(); }catch(e){} };
    function loop(){
      if(stopped) return;
      ctx.drawImage(v, 0, 0, cw, ch);
      onProgress(Math.min(99, v.currentTime / dur * 100));
      if(v.requestVideoFrameCallback) v.requestVideoFrameCallback(loop); else requestAnimationFrame(loop);
    }
    rec.start(1000);
    try{ await v.play(); }
    catch(e){ try{ rec.stop(); }catch(x){} throw mediaErr("منع المتصفح التشغيل اللازم للضغط. اختر فيديو أصغر من 19MB أو أعد المحاولة."); }
    loop();
    await finished;
    var type = ((rec.mimeType || mime || "video/webm").split(";")[0]);
    var blob = new Blob(chunks, {type: type});
    if(!blob.size) throw mediaErr("فشل ضغط الفيديو");
    return new File([blob], (file.name || "video").replace(/\.\w+$/, "") + (type.indexOf("mp4") > -1 ? ".mp4" : ".webm"), {type: type});
  } finally { cleanup(); }
}

function xhrUpload(url, file, folder, token, onPct){
  return new Promise(function(resolve, reject){
    var x = new XMLHttpRequest();
    x.open("POST", url);
    x.setRequestHeader("Authorization", "Bearer " + token);
    x.timeout = 5 * 60 * 1000;
    x.upload.onprogress = function(e){ if(e.lengthComputable) onPct(Math.round(e.loaded / e.total * 100)); };
    x.onload = function(){
      var j = {}; try{ j = JSON.parse(x.responseText); }catch(e){}
      if(x.status >= 200 && x.status < 300 && j.url) resolve(j.url);
      else reject(mediaErr(j.message || ("فشل الرفع (" + x.status + ")")));
    };
    x.onerror = function(){ reject(mediaErr("تعذّر الاتصال بخدمة الوسائط. تحقق من الشبكة ومن media-config.js")); };
    x.ontimeout = function(){ reject(mediaErr("انتهت مهلة الرفع. جرّب شبكة أقوى.")); };
    var fd = new FormData(); fd.append("folder", folder); fd.append("file", file, file.name || "media");
    x.send(fd);
  });
}

async function upUpload(file, folder){
  if(!me || !auth.currentUser) throw Object.assign(new Error("يجب تسجيل الدخول أولاً"), {code: "auth-required"});
  var isVideo = file.type.indexOf("video/") === 0, isImage = file.type.indexOf("image/") === 0;
  if(!isImage && !isVideo) throw Object.assign(new Error("نوع الملف غير مدعوم"), {code: "badtype"});
  if(!/^(avatars|videos|posts|pages|groups|stories|reels)$/.test(folder)) throw new Error("مسار رفع غير مسموح");
  var base = mediaApi();
  if(isImage){
    uploadNotice(true, "نضغط الصورة تلقائياً…");
    try{ file = await compressImage(file, 1500 * 1024); } finally { uploadNotice(false); }
    if(file.size > 4 * 1024 * 1024) throw mediaErr("تعذّر ضغط الصورة بما يكفي. جرّب صورة أصغر.");
  } else {
    if(file.size > MEDIA_MAX_SRC) throw mediaErr("الحد الأقصى للفيديو 50 ميجابايت.");
    if(file.size > MEDIA_MAX_OUT || !/^video\/(mp4|webm|quicktime)$/.test(file.type)){
      try{
        file = await compressVideo(file, function(p){ uploadNotice(true, "نضغط الفيديو تلقائياً… " + Math.round(p) + "%"); });
      } finally { uploadNotice(false); }
      if(file.size > MEDIA_MAX_OUT) throw mediaErr("تعذّر ضغط الفيديو إلى أقل من 19MB. قصّه أو اختر فيديو أقصر.");
    }
  }
  uploadNotice(true, "يتم رفع الملف…");
  try{
    var idToken = await auth.currentUser.getIdToken();
    return await xhrUpload(base + "/upload", file, folder, idToken, function(p){ uploadNotice(true, "يتم رفع الملف… " + p + "%"); });
  } finally { uploadNotice(false); }
}

function errMsg(e){
  if(e && e.code === "media" && e.message) return e.message;
  var map = {
    "auth/invalid-credential":"البيانات غير صحيحة",
    "auth/email-already-in-use":"الحساب مسجل، اضغط دخول",
    "auth/weak-password":"كلمة المرور ضعيفة (6 أحرف فأكثر)",
    "auth/invalid-email":"البريد غير صحيح",
    "auth/too-many-requests":"محاولات كثيرة، حاول لاحقا",
    "auth/popup-blocked":"المتصفح حظر النافذة",
    "auth/popup-closed-by-user":"أغلقت النافذة",
    "auth/account-exists-with-different-credential":"هذا البريد مسجّل بطريقة دخول أخرى (مثل Google أو البريد). ادخل بها أولاً.",
    "auth/operation-not-allowed":"طريقة الدخول هذه غير مفعّلة بعد في Firebase",
    "auth/network-request-failed":"تعذّر الاتصال بالشبكة",
    "auth/unauthorized-domain":"الرابط غير مصرح في Firebase",
    "big":"الملف كبير جدا",
    "badtype":"نوع الملف غير مدعوم",
    "permission-denied":"تعذر إكمال العملية. حاول مجدداً."
  };
  var msg = map[e.code] || ("خطأ: " + (e.code || e.message || "غير معروف"));
  // تفاصيل تقنية للإدارة فقط — لا تُعرض للعامة
  if(e && e.code === "permission-denied" && typeof isAdmin !== "undefined" && isAdmin){
    msg = "مرفوض (إدارة): " + (e.message || e.code) + " — راجع قواعد Firestore";
  } else if(e && e.code === "permission-denied"){
    msg = "تعذر إكمال العملية حالياً. حاول مرة أخرى.";
  }
  return msg;
}

  unsubs.forEach(function(f){ f(); });
  unsubs = [];

  if(!u) return loginView();
  var s = await getDoc(doc(db, "users", u.uid));
  prof = s.exists() ? s.data() : null;
  if(!prof) return setupView();
  var ad = await getDoc(doc(db, "admins", u.uid));
  isAdmin = ad.exists();
  loadUsers();
  listen();
  shell();
  if(isAdmin) setTimeout(testStorage, 2000);
});

function phoneEmail(){
  var raw = ($("#ph").value || "");
  var map = "٠١٢٣٤٥٦٧٨٩";
  var d = raw.replace(/[٠-٩]/g, function(c){ return map.indexOf(c).toString(); });
  d = d.replace(/\D/g, "");
  var cc = $("#cc").value;
  if(d.indexOf("00") === 0) d = d.slice(2);
  if(d.indexOf(cc) === 0 && d.length > cc.length + 6) d = d.slice(cc.length);
  d = d.replace(/^0+/, "");
  if(d.length < 6) throw Object.assign(new Error("ph"), {code:"badphone"});
  return cc + d + "@phone.hashidnet.app";
}

async function loadUsers(){
  if(usersLoaded) return;
  usersLoaded = true;
  try{
    var r = await getDocs(query(collection(db, "users"), limit(300)));
    users = r.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    draw();
  }catch(e){}
}

/* ============ الاستماع للبيانات ============ */
function listen(){
  var L = function(q, fn){ unsubs.push(onSnapshot(q, function(s){ fn(s); draw(); })); };

  if(unP) unP();
  unP = onSnapshot(query(collection(db, "posts"), orderBy("ts", "desc"), limit(plim)), function(s){
    posts = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    draw();
  });
  unsubs.push(function(){ if(unP) unP(); });

  L(collection(db, "likes"), function(s){ likes = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(query(collection(db, "comments"), orderBy("ts", "asc")), function(s){ comments = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "ads"), function(s){ ads = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  if(typeof adComments === "undefined") window.adComments = [];
  L(collection(db, "adComments"), function(s){ adComments = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "promoteRequests"), function(s){ promoteRequests = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "verifyRequests"), function(s){ verifyRequests = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "banned"), function(s){ banned = {}; s.docs.forEach(function(d){ banned[d.id] = 1; }); });
  L(collection(db, "follows"), function(s){ follows = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "friends"), function(s){
    friends = s.docs.map(function(d){ return Object.assign({id:d.id, u1:d.data().u1, u2:d.data().u2}, d.data()); });
  });
  L(collection(db, "friendReqs"), function(s){
    reqs = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .filter(function(r){ return r.from === me.uid || r.to === me.uid; });
  });
  L(collection(db, "premium"), function(s){
    premium = {};
    s.docs.forEach(function(d){ premium[d.id] = d.data(); });
  });
  var hadNotifSnapshot=false, seenNotifIds=new Set();
  L(query(collection(db, "notifs"), where("to", "==", me.uid)), function(s){
    var incoming=s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    if(hadNotifSnapshot && document.hidden && window.Notification && Notification.permission==="granted") incoming.forEach(function(n){if(!seenNotifIds.has(n.id)){try{new Notification("HashidHub",{body:(n.name||"عضو")+" قام بتفاعل جديد",icon:"icon.svg",tag:n.id});}catch(e){}}});
    incoming.forEach(function(n){seenNotifIds.add(n.id);}); hadNotifSnapshot=true;
    notifs = incoming.sort(function(x,y){ return y.ts - x.ts; }).slice(0, 60);
  });
  L(query(collection(db, "messages"), where("members", "array-contains", me.uid)), function(s){
    msgs = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(x,y){ return x.ts - y.ts; });
  });
  L(query(collection(db,"messageRequests"),where("members","array-contains",me.uid)),function(s){msgReqs=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  L(query(collection(db,"savedPosts"),where("uid","==",me.uid)),function(s){savedItems=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  L(collection(db,"storyViews"),function(s){storyViews=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  L(query(collection(db, "blocks"), where("a", "==", me.uid)), function(s){
    blocks = new Set(s.docs.map(function(d){ return d.data().b; }));
  });
  L(query(collection(db, "stories"), orderBy("ts", "desc"), limit(60)), function(s){
    var now = Date.now();
    stories = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .filter(function(x){ return x.exp > now; });
  });
  L(query(collection(db, "reels"), orderBy("ts", "desc"), limit(60)), function(s){
    reels = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  unsubs.push(onSnapshot(query(collection(db, "reelLikes"), where("uid", "==", me.uid)), function(sn){
    window._reelLiked = {};
    sn.docs.forEach(function(d){ var r = d.data().rid; if(r) window._reelLiked[r] = true; });
  }, function(){}));
  L(query(collection(db, "pages"), orderBy("ts", "desc"), limit(100)), function(s){
    pages = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  L(query(collection(db, "groups"), orderBy("ts", "desc"), limit(100)), function(s){
    groups = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  L(collection(db, "pageFollows"), function(s){
    pageFollows = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  L(collection(db, "groupMembers"), function(s){
    groupMembers = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  // المكالمات الواردة
  unsubs.push(onSnapshot(query(collection(db, "calls"), where("to", "==", me.uid)), function(s){
    s.docs.forEach(function(d){
      var c = d.data();
      if(c.status === "ringing" && !callBusy) showIncoming(d.id, c);
    });
  }));

  if(isAdmin){
    L(collection(db, "reports"), function(s){ reports = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
    L(query(collection(db, "users"), limit(500)), function(s){
      users = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    });
    L(collection(db, "premiumReqs"), function(s){
      premiumReqs = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    });
    L(collection(db, "adstats"), function(s){
      clicks = {};
      s.docs.forEach(function(d){ clicks[d.id] = d.data().clicks || 0; });
    });
  }
}

var tm;

function bindFeedVideos(){
  var wraps = document.querySelectorAll(".video-wrap video.media.vid");
  wraps.forEach(function(v){
    if(v._hhBound) return;
    v._hhBound = true;
    var wrap = v.closest(".video-wrap");
    var loadTimer = null;
    function showLoader(){
      if(loadTimer) return;
      loadTimer = setTimeout(function(){ if(wrap) wrap.classList.add("is-loading"); }, 350);
    }
    function hideLoader(){
      if(loadTimer){ clearTimeout(loadTimer); loadTimer = null; }
      if(wrap) wrap.classList.remove("is-loading");
    }
    v.addEventListener("loadstart", showLoader);
    v.addEventListener("waiting", showLoader);
    v.addEventListener("loadeddata", hideLoader);
    v.addEventListener("canplay", hideLoader);
    v.addEventListener("playing", hideLoader);
    v.addEventListener("error", function(){
      hideLoader();
      if(wrap && !wrap.querySelector(".vid-err")){
        var e = document.createElement("div");
        e.className = "vid-err";
        e.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:rgba(0,0,0,.55);padding:16px;text-align:center;font-size:.9rem";
        e.textContent = "تعذّر تشغيل الفيديو";
        wrap.appendChild(e);
      }
    });
    // لا تشغّل تلقائياً إذا أوقف المستخدم التشغيل التلقائي
    v.addEventListener("click", function(){ hideLoader(); });
  });
  if(!window._feedVidObs && "IntersectionObserver" in window){
    window._feedVidObs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        var v = en.target;
        if(en.isIntersecting && en.intersectionRatio > 0.6){
          if(getPref("autoplay") !== "off"){
            // حمّل ثم شغّل صامتاً
            if(v.preload !== "auto"){ v.preload = "auto"; }
            v.muted = true;
            var p = v.play();
            if(p && p.catch) p.catch(function(){});
          }
        } else {
          if(!v.paused) v.pause();
        }
      });
    }, { threshold: [0, 0.6, 1] });
  }
  if(window._feedVidObs){
    wraps.forEach(function(v){ window._feedVidObs.observe(v); });
  }
}

function exList(q){
  var stab = window._stab || "users";
  if(!q){
    var out = "";
    var count = 0;
    for(var i = 0; i < users.length && count < 40; i++){
      if(users[i].id === me.uid || banned[users[i].id]) continue;
      out += userRow(users[i]);
      count++;
    }
    return out || '<div class="note">جار التحميل…</div>';
  }
  if(stab === "posts"){
    var o2 = "";
    posts.forEach(function(p){ if((p.t || "").indexOf(q) > -1) o2 += postHtml(p); });
    return o2 || '<div class="note">لا نتائج.</div>';
  }
  if(stab === "pages"){
    var op = "";
    pages.forEach(function(p){ if((p.name || "").indexOf(q) > -1 || (p.about || "").indexOf(q) > -1) op += pageRow(p); });
    return op || '<div class="note">لا صفحات.</div>';
  }
  if(stab === "groups"){
    var og = "";
    groups.forEach(function(g){ if((g.name || "").indexOf(q) > -1 || (g.about || "").indexOf(q) > -1) og += groupRow(g); });
    return og || '<div class="note">لا مجموعات.</div>';
  }
  if(stab === "tags"){
    var tags = {};
    posts.forEach(function(p){
      var m = (p.t || "").match(/#[\u0600-\u06FF\w]+/g);
      if(m) m.forEach(function(t){ tags[t] = 1; });
    });
    var keys = Object.keys(tags).filter(function(t){ return t.indexOf(q) > -1; });
    if(!keys.length) return '<div class="note">لا هاشتاغات.</div>';
    return keys.map(function(t){ return '<button class="row" data-a="ht" data-h="' + t.slice(1) + '" style="width:100%;padding:10px 0"><b>' + esc(t) + '</b></button>'; }).join("");
  }
  var ou = "";
  users.forEach(function(u){
    if(u.id !== me.uid && (u.name || "").indexOf(q) > -1) ou += userRow(u);
  });
  return ou || '<div class="note">لا نتائج.</div>';
}

function paintReelLike(rid){
  var on = !!window._reelLiked[rid], r = reels.filter(function(x){ return x.id === rid; })[0];
  document.querySelectorAll('#reelplayer [data-reel-item="' + rid + '"] [data-a="reellike"]').forEach(function(b){
    b.classList.toggle("on", on);
    var n = b.querySelector(".rsa-n"); if(n && r) n.textContent = fmtN(r.likes);
  });
}
async function toggleReelLike(rid, onlyLike){
  var rel = reels.filter(function(x){ return x.id === rid; })[0];
  if(!rel) return;
  if(!window._reelLiked) window._reelLiked = {};
  var was = !!window._reelLiked[rid];
  if(was && onlyLike) return;
  window._reelLiked[rid] = !was;
  rel.likes = Math.max(0, (rel.likes || 0) + (was ? -1 : 1));
  paintReelLike(rid);
  try{
    var rl = doc(db, "reelLikes", rid + "_" + me.uid);
    if(was){ await deleteDoc(rl); await updateDoc(doc(db, "reels", rid), {likes: increment(-1)}); }
    else { await setDoc(rl, {rid: rid, uid: me.uid, ts: Date.now()}); await updateDoc(doc(db, "reels", rid), {likes: increment(1)}); }
  }catch(err){
    window._reelLiked[rid] = was;
    rel.likes = Math.max(0, (rel.likes || 0) + (was ? 1 : -1));
    paintReelLike(rid);
    toast(friendlyErr(err));
  }
}

      '</div>' +
      '<div class="reel-bar" role="slider" aria-label="' + t("شريط التقدم","Progress") + '"><i></i></div>' +
    '</section>';
  });
  h += '</div></div></div>';

  var holder = document.createElement("div");
  holder.innerHTML = h;
  var viewer = holder.firstElementChild;
  document.body.appendChild(viewer);
  document.body.style.overflow = "hidden";
  var stage = viewer.querySelector(".reel-stage");
  var scroller = viewer.querySelector("#reelscroll");
  var items = Array.prototype.slice.call(scroller.querySelectorAll(".reel-item"));
  var cur = -1, tapT = null, lastTap = 0, lastTapItem = null, viewT = null, seeking = null;

  function vid(it){ return it.querySelector("video"); }
  function setLoading(it, on){ it.classList.toggle("is-loading", !!on); }
  function paintMute(){
    var b = viewer.querySelector('[data-a="reelsound"]');
    if(b){ b.innerHTML = window._hhReelMuted ? RIC.volOff : RIC.volOn; b.setAttribute("aria-label", window._hhReelMuted ? t("تشغيل الصوت","Unmute") : t("كتم الصوت","Mute")); }
  }
  function ensureWindow(i){
    items.forEach(function(it, k){
      var v = vid(it), d = Math.abs(k - i);
      if(d <= 1 || k === i + 2){
        if(!v.getAttribute("src") && it.dataset.src){ v.preload = (d <= 1 && k >= i) ? "auto" : "metadata"; v.src = it.dataset.src; }
      } else if(d > 3 && v.getAttribute("src")){
        try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
        setLoading(it, false);
      }
    });
  }
  function playItem(it){
    var v = vid(it); if(!v) return;
    if(!v.getAttribute("src") && it.dataset.src) v.src = it.dataset.src;
    v.muted = !!window._hhReelMuted;
    setLoading(it, v.readyState < 3);
    var p = v.play();
    if(p && p.catch) p.catch(function(err){
      if(err && err.name === "AbortError") return;
      if(!v.muted){
        v.muted = true; window._hhReelMuted = true; paintMute();
        toast(t("الصوت مكتوم — اضغط أيقونة الصوت لتشغيله","Muted — tap the speaker to unmute"), 3000);
        var p2 = v.play();
        if(p2 && p2.catch) p2.catch(function(){ it.classList.add("paused"); setLoading(it, false); });
      } else { it.classList.add("paused"); setLoading(it, false); }
    });
  }
  function togglePlay(it){ var v = vid(it); if(!v) return; if(v.paused) playItem(it); else v.pause(); }
  function countView(rid){
    var seen = window._reelViewed || (window._reelViewed = {});
    if(seen[rid]) return;
    clearTimeout(viewT);
    viewT = setTimeout(function(){
      if(!items[cur] || items[cur].dataset.reelItem !== rid || seen[rid]) return;
      seen[rid] = 1;
      var r = reels.filter(function(x){ return x.id === rid; })[0];
      if(r && r.uid === me.uid) return;
      updateDoc(doc(db, "reels", rid), {views: increment(1)}).catch(function(){});
    }, 2000);
  }
  function activate(i){
    if(i === cur || !items[i]) return;
    cur = i;
    items.forEach(function(it, k){ it.classList.toggle("cur", k === i); if(k !== i){ try{ vid(it).pause(); }catch(e){} } });
    ensureWindow(i);
    var it = items[i];
    try{ vid(it).currentTime = 0; }catch(e){}
    playItem(it);
    countView(it.dataset.reelItem);
  }
  function heart(it, e){
    var r = it.getBoundingClientRect(), el = it.querySelector(".reel-heart");
    el.style.left = (e.clientX - r.left) + "px"; el.style.top = (e.clientY - r.top) + "px";
    el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  }
  function seek(it, e){
    var bar = it.querySelector(".reel-bar"), r = bar.getBoundingClientRect(), v = vid(it);
    var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if(v.duration) { v.currentTime = f * v.duration; it.querySelector(".reel-bar i").style.width = (f * 100) + "%"; }
  }

  items.forEach(function(it){
    var v = vid(it), bar = it.querySelector(".reel-bar i"), loader = it.querySelector(".reel-loader");
    v.addEventListener("loadedmetadata", function(){ if(v.videoWidth > v.videoHeight) it.classList.add("land"); });
    v.addEventListener("playing", function(){ it.classList.remove("paused"); setLoading(it, false); });
    v.addEventListener("pause", function(){ if(items[cur] === it && !v.ended && !document.hidden) it.classList.add("paused"); });
    v.addEventListener("waiting", function(){ if(!v.paused) setLoading(it, true); });
    v.addEventListener("canplay", function(){ setLoading(it, false); });
    v.addEventListener("timeupdate", function(){ if(!seeking && v.duration) bar.style.width = (v.currentTime / v.duration * 100) + "%"; });
    v.addEventListener("error", function(){
      if(!v.getAttribute("src")) return;
      setLoading(it, false);
      loader.innerHTML = '<span>' + t("تعذّر تحميل المقطع","Couldn't load") + '</span><button type="button" class="reel-retry" data-a="reelretry">' + t("إعادة المحاولة","Retry") + '</button>';
      loader.style.display = "flex"; loader.style.pointerEvents = "auto";
    });
  });

  function openComments(rid){
    var old = document.getElementById("reelsheet"); if(old) old.remove();
    var sh = document.createElement("div");
    sh.className = "reel-sheet"; sh.id = "reelsheet"; sh.dataset.rid = rid;
    sh.innerHTML = '<div class="rs-head"><span>' + t("التعليقات","Comments") + '</span><button type="button" data-a="reelcclose" aria-label="' + t("إغلاق","Close") + '">✕</button></div>' +
      '<div class="rs-list" id="rslist"><div class="note">' + t("جارٍ التحميل…","Loading…") + '</div></div>' +
      '<div class="rs-form"><input type="text" id="rsin" maxlength="500" placeholder="' + t("اكتب تعليقاً…","Add a comment…") + '"><button type="button" class="btn" data-a="reelcsend">' + t("إرسال","Send") + '</button></div>';
    stage.appendChild(sh);
    var list = sh.querySelector("#rslist");
    getDocs(query(collection(db, "reelComments"), where("rid", "==", rid))).then(function(sn){
      var arr = sn.docs.map(function(d){ return d.data(); }).sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); });
      list.innerHTML = arr.length ? arr.map(commentHtml).join("") : '<div class="note">' + t("لا تعليقات بعد. كن الأول!","No comments yet.") + '</div>';
    }).catch(function(){ list.innerHTML = '<div class="note">' + t("تعذّر تحميل التعليقات","Couldn't load comments") + '</div>'; });
  }
  function commentHtml(c){ return '<div class="rs-c"><b>' + esc(c.name || t("عضو","Member")) + '</b> <small>' + ago(c.ts) + '</small><div>' + esc(c.t || "") + '</div></div>'; }
  async function sendComment(){
    var sh = document.getElementById("reelsheet"), inp = document.getElementById("rsin");
    if(!sh || !inp) return;
    var txt = inp.value.trim(); if(!txt) return;
    var rid = sh.dataset.rid;
    inp.value = "";
    try{
      var c = {rid: rid, uid: me.uid, name: prof.name, t: txt, ts: Date.now()};
      await addDoc(collection(db, "reelComments"), c);
      updateDoc(doc(db, "reels", rid), {comments: increment(1)}).catch(function(){});
      var r = reels.filter(function(x){ return x.id === rid; })[0]; if(r) r.comments = (r.comments || 0) + 1;
      var list = document.getElementById("rslist");
      if(list){ if(!list.querySelector(".rs-c")) list.innerHTML = ""; list.insertAdjacentHTML("beforeend", commentHtml(c)); list.scrollTop = list.scrollHeight; }
      var nb = viewer.querySelector('[data-reel-item="' + rid + '"] [data-a="reelcomment"] .rsa-n'); if(nb && r) nb.textContent = fmtN(r.comments);
    }catch(err){ inp.value = txt; toast(friendlyErr(err)); }
  }

  viewer.addEventListener("click", function(e){
    var b = e.target.closest("button[data-a]");
    if(b){
      var a = b.dataset.a, it0 = b.closest(".reel-item");
      if(a === "closereel"){ closeReelPlayer(false); }
      else if(a === "prof"){ closeReelPlayer(false); }
      else if(a === "reelsound"){
        window._hhReelMuted = !window._hhReelMuted; setPref("reelmuted", window._hhReelMuted ? "on" : "off");
        if(items[cur]){ var cv = vid(items[cur]); cv.muted = window._hhReelMuted; if(cv.paused && !window._hhReelMuted) playItem(items[cur]); }
        paintMute();
      }
      else if(a === "reellike"){ toggleReelLike(b.dataset.i, false); }
      else if(a === "reelshare"){ share("#reel=" + b.dataset.i); }
      else if(a === "reelcomment"){ openComments(b.dataset.i); }
      else if(a === "reelcclose"){ var sh0 = document.getElementById("reelsheet"); if(sh0) sh0.remove(); }
      else if(a === "reelcsend"){ sendComment(); }
      else if(a === "reelretry" && it0){
        var rv = vid(it0), ld = it0.querySelector(".reel-loader");
        ld.style.display = ""; ld.style.pointerEvents = ""; ld.innerHTML = '<span class="spinner"></span>';
        rv.load(); playItem(it0);
      }
      e.stopPropagation();
      return;
    }
    if(e.target.closest(".reel-sheet")) return;
    var cap = e.target.closest(".ri-cap");
    if(cap){ cap.classList.toggle("open"); return; }
    if(e.target.closest(".reel-bar")) return;
    var it = e.target.closest(".reel-item"); if(!it) return;
    var sh1 = document.getElementById("reelsheet"); if(sh1){ sh1.remove(); return; }
    var now = Date.now();
    if(lastTapItem === it && now - lastTap < 300){
      clearTimeout(tapT); lastTap = 0; lastTapItem = null;
      heart(it, e); toggleReelLike(it.dataset.reelItem, true);
      return;
    }
    lastTap = now; lastTapItem = it;
    clearTimeout(tapT);
    tapT = setTimeout(function(){ togglePlay(it); }, 260);
  });
  scroller.addEventListener("pointerdown", function(e){
    var bar = e.target.closest(".reel-bar"); if(!bar) return;
    seeking = bar.closest(".reel-item");
    try{ bar.setPointerCapture(e.pointerId); }catch(x){}
    seek(seeking, e); e.preventDefault();
  });
  scroller.addEventListener("pointermove", function(e){ if(seeking) seek(seeking, e); });
  ["pointerup","pointercancel"].forEach(function(n){ scroller.addEventListener(n, function(){ seeking = null; }); });
  stage.addEventListener("keydown", function(e){ if(e.key === "Enter" && e.target.id === "rsin"){ e.preventDefault(); sendComment(); } });

  function onKey(e){
    if(!document.getElementById("reelplayer")) return;
    if(e.target && e.target.id === "rsin") { if(e.key === "Escape"){ var s2 = document.getElementById("reelsheet"); if(s2) s2.remove(); } return; }
    var hgt = scroller.clientHeight;
    if(e.key === "ArrowDown" || e.key === "PageDown"){ e.preventDefault(); scroller.scrollBy({top: hgt, behavior: "smooth"}); }
    else if(e.key === "ArrowUp" || e.key === "PageUp"){ e.preventDefault(); scroller.scrollBy({top: -hgt, behavior: "smooth"}); }
    else if(e.key === " " || e.key === "k"){ e.preventDefault(); if(items[cur]) togglePlay(items[cur]); }
    else if(e.key === "m" || e.key === "M"){ var mb = viewer.querySelector('[data-a="reelsound"]'); if(mb) mb.click(); }
    else if(e.key === "Escape"){ var s3 = document.getElementById("reelsheet"); if(s3) s3.remove(); else closeReelPlayer(false); }
  }
  function onVis(){
    if(!items[cur]) return;
    if(document.hidden) vid(items[cur]).pause();
    else if(!items[cur].classList.contains("paused")) playItem(items[cur]);
  }
  function onPop(){ closeReelPlayer(true); }
  document.addEventListener("keydown", onKey);
  document.addEventListener("visibilitychange", onVis);
  window.addEventListener("popstate", onPop);
  try{ history.pushState({hhReel: 1}, ""); }catch(e){}

  scroller.scrollTop = startIdx * scroller.clientHeight;
  activate(startIdx);
  var io = null;
  if("IntersectionObserver" in window){
    io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting && en.intersectionRatio >= 0.6) activate(parseInt(en.target.dataset.reelIdx, 10));
      });
    }, {root: scroller, threshold: [0.6]});
    items.forEach(function(it){ io.observe(it); });
  }
  viewer._cleanup = function(){
    if(io) io.disconnect();
    document.removeEventListener("keydown", onKey);
    document.removeEventListener("visibilitychange", onVis);
    window.removeEventListener("popstate", onPop);
    clearTimeout(tapT); clearTimeout(viewT);
  };
}

    '<div class="story-progress">' + bars + '</div>' +
    '<div class="story-head"><img class="av sm" src="' + (esc(list[0].photo) || DEF) + '" alt=""><b>' + esc(list[0].name || "") + '</b>' +
    '<button type="button" class="mini" data-a="closestory" style="margin-inline-start:auto;color:#fff;font-size:1.2rem">✕</button></div>' +
    '<div class="story-body"></div></div>';
  var viewer = d.firstElementChild;
  document.body.appendChild(viewer);

  function markProgress(running){
    var bs = viewer.querySelectorAll(".story-progress i");
    for(var j = 0; j < bs.length; j++){
      bs[j].className = (j < i) ? "done" : (j === i ? "on" : "");
      bs[j].innerHTML = "";
    }
    if(!running) return;
    var cur = bs[i];
    if(!cur) return;
    var fill = document.createElement("span");
    fill.style.cssText = "display:block;height:100%;width:0;background:#fff;border-radius:2px";
    cur.appendChild(fill);
    // force reflow then animate
    void fill.offsetWidth;
    fill.style.transition = "width 5.5s linear";
    fill.style.width = "100%";
  }

  function show(idx){
    i = idx;
    if(i >= list.length){ closeStory(); return; }
    if(i < 0){ i = 0; }
    var s = list[i];
    if(!viewer.isConnected) return;
    var media = s.media || s.image || s.url || s.photo || "";
    if(s.uid !== me.uid){
      setDoc(doc(db,"storyViews",s.id+"_"+me.uid),{storyId:s.id,uid:me.uid,name:prof.name||"",photo:prof.photo||"",ts:Date.now()}).catch(function(){});
    }
    var vc = storyViews.filter(function(v){ return v.storyId === s.id; }).length;
    var body = viewer.querySelector(".story-body");
    body.innerHTML = "";
    // صورة كاملة الشاشة
    if(media){
      var img = document.createElement("img");
      img.className = "story-img";
      img.alt = "";
      img.draggable = false;
      img.src = media;
      body.appendChild(img);
    } else {
      var capOnly = document.createElement("div");
      capOnly.className = "story-cap-only";
      capOnly.textContent = s.caption || "";
      body.appendChild(capOnly);
    }
    if(s.caption && media){
      var cap = document.createElement("div");
      cap.className = "story-cap";
      cap.textContent = s.caption;
      body.appendChild(cap);
    }
    var actions = document.createElement("div");
    actions.className = "story-actions";
    if(s.uid === me.uid){
      actions.innerHTML = '<button type="button" data-a="storyviews" data-i="'+s.id+'">👁 '+vc+' مشاهدة</button>';
    } else {
      actions.innerHTML = '<button type="button" data-a="storyreact" data-i="'+s.id+'" style="font-size:1.4rem">❤️</button>';
    }
    body.appendChild(actions);

    clearTimeout(window.storyTimer);
    markProgress(false);

    function startTimer(){
      if(!viewer.isConnected) return;
      markProgress(true);
      clearTimeout(window.storyTimer);
      window.storyTimer = setTimeout(function(){ show(i + 1); }, 5500);
    }

    var imgEl = body.querySelector("img.story-img");
    if(imgEl){
      if(imgEl.complete && imgEl.naturalWidth > 0) startTimer();
      else {
        var started = false;
        var go = function(){ if(started) return; started = true; startTimer(); };
        imgEl.addEventListener("load", go, { once: true });
        imgEl.addEventListener("error", function(){
          if(started) return;
          started = true;
          var err = document.createElement("div");
          err.className = "story-cap-only";
          err.textContent = "تعذّر تحميل الصورة";
          body.insertBefore(err, body.firstChild);
          startTimer();
        }, { once: true });
        // لا تُغلق قبل أن تُمنح الصورة وقتاً كافياً
        setTimeout(go, 10000);
      }
    } else {
      startTimer();
    }
  }

  show(0);
  setTimeout(function(){ readyNav = true; }, 450);

  var bodyEl = viewer.querySelector(".story-body");
  bodyEl.addEventListener("click", function(e){
    if(!readyNav) return;
    if(e.target.closest("button")) return;
    e.preventDefault();
    e.stopPropagation();
    var r = bodyEl.getBoundingClientRect();
    clearTimeout(window.storyTimer);
    if((e.clientX - r.left) < r.width * 0.35) show(i - 1);
    else show(i + 1);
  });
  viewer.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive: false });
}
function closeStory(){
  clearTimeout(window.storyTimer);
  window.storyTimer = null;
  var m = $("#sv");
  if(m) m.remove();
}

var pc = null, localStream = null, callId = null, callType = "audio", callRole = "caller";
var callUnsub = null, callerStarted = false, appliedCands = 0, appliedACands = 0;

function showIncoming(id, c){
  if($("#incoming")) return;

    '<div class="call-status" style="color:#ddd">' + (c.type === "video" ? "مكالمة فيديو واردة…" : "مكالمة صوتية واردة…") + '</div></div>' +
    '<div class="row"><button class="call-btn" id="acceptCall" style="background:#1faa59;width:64px;height:64px">✓</button>' +
    '<button class="call-btn end" id="declineCall" style="width:64px;height:64px">✕</button></div>';
  document.body.appendChild(d);
  $("#declineCall").onclick = async function(){
    await updateDoc(doc(db, "calls", id), {status: "ended"}).catch(function(){});

    endCallCleanup();
  };
  $("#acceptCall").onclick = function(){ acceptCall(id, c.type, c.fromName); };
}
async function acceptCall(id, type, fromName){
  callId = id; callType = type; callRole = "callee"; callBusy = true;
  var inc = $("#incoming"); if(inc) inc.remove();
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: type === "video"});
  }catch(e){
    toast("تعذر الوصول للميكروفون/الكاميرا");
    await deleteDoc(doc(db, "calls", id)).catch(function(){});
    endCallCleanup();
    return;
  }
  openCallUI(fromName || "مكالمة");
  setupPC();
  callUnsub = onSnapshot(doc(db, "calls", id), callDocHandler);
  await updateDoc(doc(db, "calls", id), {status: "active"});
}
async function startCall(uid, name, type){
  if(!isPremium(me.uid)) return toast("المكالمات خاصة بالأعضاء المميزين 👑 — اشترك الآن");
  if(callBusy) return toast("أنت في مكالمة بالفعل");
  callId = me.uid + "_" + uid;
  callType = type; callRole = "caller"; callBusy = true;
  chatWith = uid; chatName = name;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: type === "video"});
  }catch(e){
    toast("تعذر الوصول للميكروفون/الكاميرا");
    callBusy = false;
    return;
  }
  await setDoc(doc(db, "calls", callId), {
    from: me.uid, to: uid, fromName: prof.name, type: type,
    status: "ringing", ts: Date.now(), cands: [], acands: []
  });
  notify(uid, "call");
  openCallUI(name);
  setupPC();
  callUnsub = onSnapshot(doc(db, "calls", callId), callDocHandler);
}
function setupPC(){
  pc = new RTCPeerConnection({iceServers: [{urls: ["stun:stun.l.google.com:19302"]}]});
  pc.onicecandidate = function(e){
    if(!e.candidate || !callId) return;
    var field = callRole === "caller" ? "cands" : "acands";
    var o = {};
    o[field] = arrayUnion(JSON.stringify(e.candidate.toJSON()));
    updateDoc(doc(db, "calls", callId), o).catch(function(){});
  };
  pc.ontrack = function(e){
    var rv = $("#remoteV");
    if(rv) rv.srcObject = e.streams[0];
  };
  localStream.getTracks().forEach(function(t){ pc.addTrack(t, localStream); });
}
async function callDocHandler(snap){
  var d = snap.data();
  if(!snap.exists() || !d){ endCallCleanup(); return; }
  if(d.status === "ended"){ toast("انتهت المكالمة"); endCallCleanup(); return; }
  if(callRole === "caller"){
    if(d.status === "active" && !callerStarted){
      callerStarted = true;
      setStatus("جار إنشاء الاتصال…");
      try{
        var offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await updateDoc(doc(db, "calls", callId), {offer: JSON.stringify(offer)});
      }catch(e){}
    }
    if(d.answer && pc && !pc.currentRemoteDescription){
      try{ await pc.setRemoteDescription(JSON.parse(d.answer)); }catch(e){}
    }
    var ac = d.acands || [];
    if(pc && pc.currentRemoteDescription){
      for(var i = appliedACands; i < ac.length; i++){
        try{ await pc.addIceCandidate(JSON.parse(ac[i])); }catch(e){}
      }
      appliedACands = ac.length;
    }
  } else {
    if(d.offer && pc && !pc.currentRemoteDescription){
      try{
        await pc.setRemoteDescription(JSON.parse(d.offer));
        var ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        await updateDoc(doc(db, "calls", callId), {answer: JSON.stringify(ans)});
      }catch(e){}
    }
    var cc = d.cands || [];
    if(pc && pc.currentRemoteDescription){
      for(var j = appliedCands; j < cc.length; j++){
        try{ await pc.addIceCandidate(JSON.parse(cc[j])); }catch(e){}
      }
      appliedCands = cc.length;
    }
  }
  if(d.status === "active") setStatus("متصل الآن 🟢");
}
function openCallUI(name){
  var d = document.createElement("div");
  d.id = "callui";
  d.className = "call-ui";
  d.innerHTML =
    '<div class="call-remote"><video id="remoteV" autoplay playsinline></video>' +
    '<div class="call-info"><b id="callName"></b><div class="call-status" id="callStatus">جار الاتصال…</div></div>' +
    '<div class="call-local" id="localBox"><video id="localV" autoplay playsinline muted></video></div></div>' +
    '<div class="call-bar">' +
    '<button class="call-btn" id="muteBtn">🎙</button>' +
    (callType === "video" ? '<button class="call-btn" id="camBtn">📷</button>' : "") +
    '<button class="call-btn end" id="endBtn" style="width:70px;height:70px">📵</button></div>';
  document.body.appendChild(d);
  $("#callName").textContent = name;
  if(localStream){
    $("#localV").srcObject = localStream;
    if(callType !== "video"){ var lb = $("#localBox"); if(lb) lb.style.display = "none"; }
  }
  $("#muteBtn").onclick = function(){
    var tr = localStream.getAudioTracks()[0];
    if(tr){ tr.enabled = !tr.enabled; this.classList.toggle("on", !tr.enabled); this.textContent = tr.enabled ? "🎙" : "🔇"; }
  };
  var cb = $("#camBtn");
  if(cb) cb.onclick = function(){
    var tr = localStream.getVideoTracks()[0];
    if(tr){ tr.enabled = !tr.enabled; this.classList.toggle("on", !tr.enabled); }
  };
  $("#endBtn").onclick = hangup;
}
function setStatus(t){ var s = $("#callStatus"); if(s) s.textContent = t; }
async function hangup(){
  if(callId){
    await updateDoc(doc(db, "calls", callId), {status: "ended"}).catch(function(){});
    await deleteDoc(doc(db, "calls", callId)).catch(function(){});
  }
  endCallCleanup();
}
function endCallCleanup(){
  callBusy = false;
  if(callUnsub){ callUnsub(); callUnsub = null; }
  if(pc){ try{ pc.close(); }catch(e){} pc = null; }
  if(localStream){ localStream.getTracks().forEach(function(t){ t.stop(); }); localStream = null; }
  var u = $("#callui"); if(u) u.remove();
  var inc = $("#incoming"); if(inc) inc.remove();
  callId = null; callerStarted = false; appliedCands = 0; appliedACands = 0;
}

async function ssoSignIn(provider){
  try{
    await signInWithPopup(auth, provider);
  }catch(e){
    // على بعض الهواتف/التطبيقات المثبّتة تُحجب النوافذ المنبثقة: ننتقل للتحويل المباشر
    if(e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")){
      await signInWithRedirect(auth, provider);
      return;
    }
    if(e && e.code === "auth/cancelled-popup-request") return;
    throw e;
  }
}

async function openHash(){
  if(!me || !$("#main")) return;
  var h = location.hash;
  var m;
  try{
    m = h.match(/^#reel=(\w+)/);
    if(m){
      tab = "reels"; draw();
      var tries = 0, rid0 = m[1];
      (function wait(){ if(reels.length || tries++ > 12){ openReelPlayer(rid0); } else setTimeout(wait, 500); })();
      return;
    }
    m = h.match(/^#p=(\w+)/);
    if(m){
      var d1 = await getDoc(doc(db, "posts", m[1]));
      single = d1.exists() ? Object.assign({id: d1.id}, d1.data()) : null;
      tab = "post";
      draw();
      return;
    }
    m = h.match(/^#u=(\w+)/);
    if(m){
      pv = m[1];
      var d2 = await getDoc(doc(db, "users", pv));
      pd = d2.exists() ? d2.data() : {name: "عضو"};
      tab = "profile";
      draw();
    }
  }catch(e){}
}

var deferredPrompt = null;
function detectOS(){
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  return { isIOS: isIOS, isAndroid: isAndroid, isMobile: isIOS || isAndroid || /Mobile/i.test(ua) };
}
function isStandaloneApp(){
  return window.matchMedia("(display-mode: standalone)").matches || !!navigator.standalone;
}
function refreshInstallUI(){
  var os = detectOS();
  var pwaBtn = document.getElementById("pwa-install");
  var iosTip = document.getElementById("ios-tip");
  var box = document.getElementById("install-box") || document.querySelector(".install-box");
  if(isStandaloneApp()){
    if(box) box.style.display = "none";
    return;
  }
  if(pwaBtn){
    pwaBtn.style.display = "block";
    pwaBtn.type = "button";
    if(os.isIOS){
      pwaBtn.textContent = (getLang()==="en") ? "🍎 Add to Home Screen (iPhone)" : "🍎 إضافة إلى الشاشة الرئيسية (آيفون)";
    } else if(os.isAndroid){
      pwaBtn.textContent = (getLang()==="en") ? "⬇️ Install App on Android" : "⬇️ تثبيت التطبيق على أندرويد";
    } else {
      pwaBtn.textContent = (getLang()==="en") ? "⬇️ Install HashidHub App" : "⬇️ تثبيت تطبيق HashidHub";
    }
  }
  if(iosTip) iosTip.classList.remove("show");
}
function showInstallInstructions(){
  var os = detectOS();
  var en = getLang()==="en";
  var title = en ? "Install HashidHub" : "تثبيت HashidHub";
  var body;
  if(os.isIOS){
    body = en
      ? "1) Tap the Share button □↑ at the bottom of Safari\n2) Choose «Add to Home Screen»\n3) Tap «Add» — HashidHub icon will appear like an app."
      : "1) اضغط زر المشاركة □↑ أسفل Safari\n2) اختر «إضافة إلى الشاشة الرئيسية»\n3) اضغط «إضافة» — ستظهر أيقونة HashidHub كتطبيق.";
  } else if(os.isAndroid){
    body = en
      ? "1) Tap the browser menu ⋮ (top right)\n2) Choose «Install app» or «Add to Home screen»\n3) Confirm — HashidHub will open like a native app."
      : "1) اضغط قائمة المتصفح ⋮ (أعلى اليمين)\n2) اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»\n3) أكّد — سيفتح HashidHub كتطبيق.";
  } else {
    body = en
      ? "In Chrome/Edge: open the browser menu and choose «Install HashidHub» or the install icon in the address bar."
      : "في Chrome/Edge: من قائمة المتصفح اختر «تثبيت HashidHub» أو أيقونة التثبيت في شريط العنوان.";
  }
  openSheet(title, [
    {label: en ? "Got it" : "حسناً", action: function(){}}
  ]);
  // also show tip text under login if present
  var tip = document.getElementById("ios-tip");
  if(tip){
    tip.innerHTML = body.replace(/\n/g, "<br>");
    tip.classList.add("show");
  } else {
    toast(body.split("\n")[0], 4000);
  }
}
async function handleInstallClick(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(isStandaloneApp()){ toast(getLang()==="en"?"Already installed":"التطبيق مثبت بالفعل"); return; }
  if(deferredPrompt){
    try{
      deferredPrompt.prompt();
      var choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      refreshInstallUI();
      if(choice && choice.outcome === "accepted") toast(getLang()==="en"?"Installing…":"جاري التثبيت…");
    }catch(err){
      showInstallInstructions();
    }
    return;
  }
  showInstallInstructions();
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredPrompt = e;
  refreshInstallUI();
});
document.addEventListener("click", function(e){
  var t = e.target;
  if(!t) return;
  if(t.id === "pwa-install" || (t.closest && t.closest("#pwa-install"))){
    handleInstallClick(e);
  }
});

document.addEventListener("click", function(e){
  var btn = e.target.closest("#hdr-menu-btn");
  var dd = document.getElementById("hdr-dd");
  if(btn && dd){
    e.stopPropagation();
    dd.classList.toggle("open");
    return;
  }
  if(dd && !e.target.closest(".hdr-menu")) dd.classList.remove("open");
  else if(dd && e.target.closest("#hdr-dd button") && !e.target.closest("[data-acc]") && !e.target.closest('[data-a="setlang"]')) dd.classList.remove("open");
});


document.addEventListener("input", function(e){
  if(e.target && e.target.id === "admin-user-q"){
    var q = (e.target.value || "").toLowerCase().trim();
    document.querySelectorAll(".admin-user-row").forEach(function(row){
      var name = row.dataset.uname || "";
      var uid = row.dataset.uid || "";
      row.style.display = (!q || name.indexOf(q) > -1 || uid.indexOf(q) > -1) ? "" : "none";
    });
  }
});


document.addEventListener("input", function(e){
  if(!e.target) return;
  if(e.target.id === "admin-page-q"){
    var q = (e.target.value||"").toLowerCase().trim();
    document.querySelectorAll(".admin-user-row[data-pname]").forEach(function(row){
      row.style.display = (!q || (row.dataset.pname||"").indexOf(q)>-1) ? "" : "none";
    });
  }
  if(e.target.id === "admin-group-q"){
    var q2 = (e.target.value||"").toLowerCase().trim();
    document.querySelectorAll(".admin-user-row[data-gname]").forEach(function(row){
      row.style.display = (!q2 || (row.dataset.gname||"").indexOf(q2)>-1) ? "" : "none";
    });
  }
});

window.addEventListener("hashchange", openHash);
setTimeout(openHash, 1500);
</script>
