    }, 2000);
  }
  function activate(i){
    if(i === cur || !items[i]) return;
    cur = i;
    items.forEach(function(it, k){ it.classList.toggle("cur", k === i); if(k !== i){ try{ vid(it).pause(); }catch(e){} } });
    var it = items[i];
    try{ vid(it).currentTime = 0; }catch(e){}
    Promise.race([prepare(it, false), new Promise(function(r){ setTimeout(r, 150); })]).then(function(){
      if(cur !== i) return;
      ensureWindow(i);
      playItem(it);
      countView(it.dataset.reelItem);
    });
  }
  function heart(it, e){
    var r = it.getBoundingClientRect(), el = it.querySelector(".reel-heart");
    el.style.left = (e.clientX - r.left) + "px"; el.style.top = (e.clientY - r.top) + "px";
    el.classList.remove("go"); void el.offsetWidth; el.classList.add("go");
  }
  function seek(it, e){
    var bar = it.querySelector(".reel-bar"), r = bar.getBoundingClientRect(), v = vid(it);
    var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if(v.duration) { v.currentTime = f * v.duration; it.querySelector(".reel-bar i").style.width = (f * 100) + "%"; }
  }

  items.forEach(function(it){
    var v = vid(it), bar = it.querySelector(".reel-bar i"), loader = it.querySelector(".reel-loader");
    v.addEventListener("loadedmetadata", function(){ if(v.videoWidth > v.videoHeight) it.classList.add("land"); });
    v.addEventListener("playing", function(){ it.classList.remove("paused"); setLoading(it, false); });
    v.addEventListener("pause", function(){ if(items[cur] === it && !v.ended && !document.hidden) it.classList.add("paused"); });
    v.addEventListener("waiting", function(){ if(!v.paused) setLoading(it, true); });
    v.addEventListener("canplay", function(){ setLoading(it, false); if(items[cur] === it) warm(it); });
    v.addEventListener("timeupdate", function(){ if(!seeking && v.duration) bar.style.width = (v.currentTime / v.duration * 100) + "%"; });
    v.addEventListener("error", function(){
      if(!v.getAttribute("src")) return;
      if(/^blob:/.test(v.getAttribute("src")) && it.dataset.src){ v.src = it.dataset.src; v.load(); if(items[cur] === it) playItem(it); return; }
      setLoading(it, false);
      loader.innerHTML = '<span>' + t("تعذّر تحميل المقطع","Couldn't load") + '</span><button type="button" class="reel-retry" data-a="reelretry">' + t("إعادة المحاولة","Retry") + '</button>';
      loader.style.display = "flex"; loader.style.pointerEvents = "auto";
    });
  });

  function openComments(rid){
    var old = document.getElementById("reelsheet"); if(old) old.remove();
    var sh = document.createElement("div");
    sh.className = "reel-sheet"; sh.id = "reelsheet"; sh.dataset.rid = rid;
    sh.innerHTML = '<div class="rs-head"><span>' + t("التعليقات","Comments") + '</span><button type="button" data-a="reelcclose" aria-label="' + t("إغلاق","Close") + '">✕</button></div>' +
      '<div class="rs-list" id="rslist"><div class="note">' + t("جارٍ التحميل…","Loading…") + '</div></div>' +
      '<div class="rs-form"><input type="text" id="rsin" maxlength="500" placeholder="' + t("اكتب تعليقاً…","Add a comment…") + '"><button type="button" class="btn" data-a="reelcsend">' + t("إرسال","Send") + '</button></div>';
    stage.appendChild(sh);
    var list = sh.querySelector("#rslist");
    getDocs(query(collection(db, "reelComments"), where("rid", "==", rid))).then(function(sn){
      var arr = sn.docs.map(function(d){ return d.data(); }).sort(function(a, b){ return (a.ts || 0) - (b.ts || 0); });
      list.innerHTML = arr.length ? arr.map(commentHtml).join("") : '<div class="note">' + t("لا تعليقات بعد. كن الأول!","No comments yet.") + '</div>';
    }).catch(function(){ list.innerHTML = '<div class="note">' + t("تعذّر تحميل التعليقات","Couldn't load comments") + '</div>'; });
  }
  function commentHtml(c){ return '<div class="rs-c"><b>' + esc(c.name || t("عضو","Member")) + '</b> <small>' + ago(c.ts) + '</small><div>' + esc(c.t || "") + '</div></div>'; }
  async function sendComment(){
    var sh = document.getElementById("reelsheet"), inp = document.getElementById("rsin");
    if(!sh || !inp) return;
    var txt = inp.value.trim(); if(!txt) return;
    var rid = sh.dataset.rid;
    inp.value = "";
    try{
      var c = {rid: rid, uid: me.uid, name: prof.name, t: txt, ts: Date.now()};
      await addDoc(collection(db, "reelComments"), c);
      updateDoc(doc(db, "reels", rid), {comments: increment(1)}).catch(function(){});
      var r = reels.filter(function(x){ return x.id === rid; })[0]; if(r) r.comments = (r.comments || 0) + 1;
      var list = document.getElementById("rslist");
      if(list){ if(!list.querySelector(".rs-c")) list.innerHTML = ""; list.insertAdjacentHTML("beforeend", commentHtml(c)); list.scrollTop = list.scrollHeight; }
      var nb = viewer.querySelector('[data-reel-item="' + rid + '"] [data-a="reelcomment"] .rsa-n'); if(nb && r) nb.textContent = fmtN(r.comments);
    }catch(err){ inp.value = txt; toast(friendlyErr(err)); }
  }

  viewer.addEventListener("click", function(e){
    var b = e.target.closest("button[data-a]");
    if(b){
      var a = b.dataset.a, it0 = b.closest(".reel-item");
      if(isGuest && /^(reellike|reelcomment|reelcsend|reelmenu|prof|openpage)$/.test(a)){ showAuthModal(); e.stopPropagation(); return; }
      if(a === "closereel"){ closeReelPlayer(false); }
      else if(a === "prof" || a === "openpage"){ closeReelPlayer(false); return; }
      else if(a === "reelsound"){
        window._hhReelMuted = !window._hhReelMuted; setPref("reelmuted", window._hhReelMuted ? "on" : "off");
        if(items[cur]){ var cv = vid(items[cur]); cv.muted = window._hhReelMuted; if(cv.paused && !window._hhReelMuted) playItem(items[cur]); }
        paintMute();
      }
      else if(a === "reellike"){ toggleReelLike(b.dataset.i, false); }
      else if(a === "reelshare"){ shareContent("reel", b.dataset.i, false); }
      else if(a === "reelmenu"){ reelMenu(b.dataset.i); }
      else if(a === "reelcomment"){ openComments(b.dataset.i); }
      else if(a === "reelcclose"){ var sh0 = document.getElementById("reelsheet"); if(sh0) sh0.remove(); }
      else if(a === "reelcsend"){ sendComment(); }
      else if(a === "reelretry" && it0){
        var rv = vid(it0), ld = it0.querySelector(".reel-loader");
        ld.style.display = ""; ld.style.pointerEvents = ""; ld.innerHTML = '<span class="spinner"></span>';
        rv.load(); playItem(it0);
      }
      e.stopPropagation();
      return;
    }
    if(e.target.closest(".reel-sheet")) return;
    var cap = e.target.closest(".ri-cap");
    if(cap){ cap.classList.toggle("open"); return; }
    if(e.target.closest(".reel-bar")) return;
    var it = e.target.closest(".reel-item"); if(!it) return;
    var sh1 = document.getElementById("reelsheet"); if(sh1){ sh1.remove(); return; }
    var now = Date.now();
    if(lastTapItem === it && now - lastTap < 300){
      clearTimeout(tapT); lastTap = 0; lastTapItem = null;
      heart(it, e); toggleReelLike(it.dataset.reelItem, true);
      return;
    }
    lastTap = now; lastTapItem = it;
    clearTimeout(tapT);
    tapT = setTimeout(function(){ togglePlay(it); }, 260);
  });
  scroller.addEventListener("pointerdown", function(e){
    var bar = e.target.closest(".reel-bar"); if(!bar) return;
    seeking = bar.closest(".reel-item");
    try{ bar.setPointerCapture(e.pointerId); }catch(x){}
    seek(seeking, e); e.preventDefault();
  });
  scroller.addEventListener("pointermove", function(e){ if(seeking) seek(seeking, e); });
  ["pointerup","pointercancel"].forEach(function(n){ scroller.addEventListener(n, function(){ seeking = null; }); });
  stage.addEventListener("keydown", function(e){ if(e.key === "Enter" && e.target.id === "rsin"){ e.preventDefault(); sendComment(); } });

  function onKey(e){
    if(!document.getElementById("reelplayer")) return;
    if(e.target && e.target.id === "rsin") { if(e.key === "Escape"){ var s2 = document.getElementById("reelsheet"); if(s2) s2.remove(); } return; }
    var hgt = scroller.clientHeight;
    if(e.key === "ArrowDown" || e.key === "PageDown"){ e.preventDefault(); scroller.scrollBy({top: hgt, behavior: "smooth"}); }
    else if(e.key === "ArrowUp" || e.key === "PageUp"){ e.preventDefault(); scroller.scrollBy({top: -hgt, behavior: "smooth"}); }
    else if(e.key === " " || e.key === "k"){ e.preventDefault(); if(items[cur]) togglePlay(items[cur]); }
    else if(e.key === "m" || e.key === "M"){ var mb = viewer.querySelector('[data-a="reelsound"]'); if(mb) mb.click(); }
    else if(e.key === "Escape"){ var s3 = document.getElementById("reelsheet"); if(s3) s3.remove(); else closeReelPlayer(false); }
  }
  function onVis(){
    if(!items[cur]) return;
    if(document.hidden) vid(items[cur]).pause();
    else if(!items[cur].classList.contains("paused")) playItem(items[cur]);
  }
  function onPop(){ closeReelPlayer(true); }
  document.addEventListener("keydown", onKey);
  document.addEventListener("visibilitychange", onVis);
  window.addEventListener("popstate", onPop);
  try{ history.pushState({hhReel: 1}, ""); }catch(e){}

  scroller.scrollTop = startIdx * scroller.clientHeight;
  activate(startIdx);

      entries.forEach(function(en){

      });
    }, {root: scroller, threshold: [0.6]});
    items.forEach(function(it){ io.observe(it); });
  }
  viewer._cleanup = function(){
    if(io) io.disconnect();
    document.removeEventListener("keydown", onKey);
    document.removeEventListener("visibilitychange", onVis);
    window.removeEventListener("popstate", onPop);
    clearTimeout(tapT); clearTimeout(viewT);
  };
}

/* ============ القصص ============ */
function openStory(uid){
  if($("#sv")) closeStory();
  var list = stories.filter(function(s){ return s.uid === uid; }).sort(function(a,b){ return (a.ts||0) - (b.ts||0); });
  if(!list.length){ toast("لا قصة متاحة"); return; }
  var i = 0;
  var readyNav = false;
  var bars = "";
  for(var k = 0; k < list.length; k++) bars += "<i></i>";
  var d = document.createElement("div");
  d.innerHTML = '<div class="story-viewer" id="sv">' +
    '<div class="story-progress">' + bars + '</div>' +
    '<div class="story-head"><img class="av sm" src="' + (esc(list[0].photo) || DEF) + '" alt=""><b>' + esc(list[0].name || "") + '</b>' +
    '<button type="button" class="mini" data-a="closestory" style="margin-inline-start:auto;color:#fff;font-size:1.2rem">✕</button></div>' +
    '<div class="story-body"></div></div>';
  var viewer = d.firstElementChild;
  document.body.appendChild(viewer);

  function markProgress(running){
    var bs = viewer.querySelectorAll(".story-progress i");
    for(var j = 0; j < bs.length; j++){
      bs[j].className = (j < i) ? "done" : (j === i ? "on" : "");
      bs[j].innerHTML = "";
    }
    if(!running) return;
    var cur = bs[i];
    if(!cur) return;
    var fill = document.createElement("span");
    fill.style.cssText = "display:block;height:100%;width:0;background:#fff;border-radius:2px";
    cur.appendChild(fill);
    // force reflow then animate
    void fill.offsetWidth;
    fill.style.transition = "width 5.5s linear";
    fill.style.width = "100%";
  }

  function show(idx){
    i = idx;
    if(i >= list.length){ closeStory(); return; }
    if(i < 0){ i = 0; }
    var s = list[i];
    if(!viewer.isConnected) return;
    var media = s.media || s.image || s.url || s.photo || "";
    if(s.uid !== me.uid){
      setDoc(doc(db,"storyViews",s.id+"_"+me.uid),{storyId:s.id,uid:me.uid,name:prof.name||"",photo:prof.photo||"",ts:Date.now()}).catch(function(){});
    }
    var vc = storyViews.filter(function(v){ return v.storyId === s.id; }).length;
    var body = viewer.querySelector(".story-body");
    body.innerHTML = "";
    // صورة كاملة الشاشة
    if(media){
      var img = document.createElement("img");
      img.className = "story-img";
      img.alt = "";
      img.draggable = false;
      img.src = media;
      body.appendChild(img);
    } else {
      var capOnly = document.createElement("div");
      capOnly.className = "story-cap-only";
      capOnly.textContent = s.caption || "";
      body.appendChild(capOnly);
    }
    if(s.caption && media){
      var cap = document.createElement("div");
      cap.className = "story-cap";
      cap.textContent = s.caption;
      body.appendChild(cap);
    }
    var actions = document.createElement("div");
    actions.className = "story-actions";
    if(s.uid === me.uid){
      actions.innerHTML = '<button type="button" data-a="storyviews" data-i="'+s.id+'">👁 '+vc+' مشاهدة</button>';
    } else {
      actions.innerHTML = '<button type="button" data-a="storyreact" data-i="'+s.id+'" style="font-size:1.4rem">❤️</button>';
    }
    body.appendChild(actions);

    clearTimeout(window.storyTimer);
    markProgress(false);

    function startTimer(){
      if(!viewer.isConnected) return;
      markProgress(true);
      clearTimeout(window.storyTimer);
      window.storyTimer = setTimeout(function(){ show(i + 1); }, 5500);
    }

    var imgEl = body.querySelector("img.story-img");
    if(imgEl){
      if(imgEl.complete && imgEl.naturalWidth > 0) startTimer();
      else {
        var started = false;
        var go = function(){ if(started) return; started = true; startTimer(); };
        imgEl.addEventListener("load", go, { once: true });
        imgEl.addEventListener("error", function(){
          if(started) return;
          started = true;
          var err = document.createElement("div");
          err.className = "story-cap-only";
          err.textContent = "تعذّر تحميل الصورة";
          body.insertBefore(err, body.firstChild);
          startTimer();
        }, { once: true });
        // لا تُغلق قبل أن تُمنح الصورة وقتاً كافياً
        setTimeout(go, 10000);
      }
    } else {
      startTimer();
    }
  }

  show(0);
  setTimeout(function(){ readyNav = true; }, 450);

  var bodyEl = viewer.querySelector(".story-body");
  bodyEl.addEventListener("click", function(e){
    if(!readyNav) return;
    if(e.target.closest("button")) return;
    e.preventDefault();
    e.stopPropagation();
    var r = bodyEl.getBoundingClientRect();
    clearTimeout(window.storyTimer);
    if((e.clientX - r.left) < r.width * 0.35) show(i - 1);
    else show(i + 1);
  });
  viewer.addEventListener("touchmove", function(e){ e.preventDefault(); }, { passive: false });
}
function closeStory(){
  clearTimeout(window.storyTimer);
  window.storyTimer = null;
  var m = $("#sv");
  if(m) m.remove();
}

var pc = null, localStream = null, callId = null, callType = "audio", callRole = "caller";
var callUnsub = null, callerStarted = false, appliedCands = 0, appliedACands = 0;

function showIncoming(id, c){
  if($("#incoming")) return;
  callBusy = true;
  var d = document.createElement("div");
  d.id = "incoming";
  d.className = "incoming";
  d.innerHTML =
    '<img class="av lg" src="' + DEF + '" alt="">' +
    '<div style="text-align:center"><b style="font-size:1.3rem">' + esc(c.fromName || "مكالمة واردة") + '</b>' +
    '<div class="call-status" style="color:#ddd">' + (c.type === "video" ? "مكالمة فيديو واردة…" : "مكالمة صوتية واردة…") + '</div></div>' +
    '<div class="row"><button class="call-btn" id="acceptCall" style="background:#1faa59;width:64px;height:64px">✓</button>' +
    '<button class="call-btn end" id="declineCall" style="width:64px;height:64px">✕</button></div>';
  document.body.appendChild(d);
  window._incId = id; startRing();
  $("#declineCall").onclick = async function(){
    await updateDoc(doc(db, "calls", id), {status: "ended"}).catch(function(){});
    await deleteDoc(doc(db, "calls", id)).catch(function(){});
    removeIncoming();
    endCallCleanup();
  };
  $("#acceptCall").onclick = function(){ acceptCall(id, c.type, c.fromName); };
}
async function acceptCall(id, type, fromName){
  callId = id; callType = type; callRole = "callee"; callBusy = true;
  window._incId = null; stopRing();
  var inc = $("#incoming"); if(inc) inc.remove();
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: type === "video"});
  }catch(e){
    toast("تعذر الوصول للميكروفون/الكاميرا");
    await deleteDoc(doc(db, "calls", id)).catch(function(){});
    endCallCleanup();
    return;
  }
  openCallUI(fromName || "مكالمة");
  setupPC();
  callUnsub = onSnapshot(doc(db, "calls", id), callDocHandler);
  await updateDoc(doc(db, "calls", id), {status: "active"});
}
async function startCall(uid, name, type){
  if(!isPremium(me.uid)) return toast("المكالمات خاصة بالأعضاء المميزين 👑 — اشترك الآن");
  if(callBusy) return toast("أنت في مكالمة بالفعل");
  callId = me.uid + "_" + uid;
  callType = type; callRole = "caller"; callBusy = true;
  chatWith = uid; chatName = name;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio: true, video: type === "video"});
  }catch(e){
    toast("تعذر الوصول للميكروفون/الكاميرا");
    callBusy = false;
    return;
  }
  await setDoc(doc(db, "calls", callId), {
    from: me.uid, to: uid, fromName: prof.name, type: type,
    status: "ringing", ts: Date.now(), cands: [], acands: []
  });
  notify(uid, "call", {callType: type});
  openCallUI(name);
  setupPC();
  callUnsub = onSnapshot(doc(db, "calls", callId), callDocHandler);
  clearTimeout(window._callTimer);
  window._callTimer = setTimeout(function(){ if(callId && !callerStarted){ toast("لم يرد على المكالمة"); hangup(); } }, 45000);
}
function setupPC(){
  pc = new RTCPeerConnection({iceServers: [{urls: ["stun:stun.l.google.com:19302"]}]});
  pc.onicecandidate = function(e){
    if(!e.candidate || !callId) return;
    var field = callRole === "caller" ? "cands" : "acands";
    var o = {};
    o[field] = arrayUnion(JSON.stringify(e.candidate.toJSON()));
    updateDoc(doc(db, "calls", callId), o).catch(function(){});
  };
  pc.ontrack = function(e){
    var rv = $("#remoteV");
    if(rv) rv.srcObject = e.streams[0];
  };
  localStream.getTracks().forEach(function(t){ pc.addTrack(t, localStream); });
}
async function callDocHandler(snap){
  var d = snap.data();
  if(!snap.exists() || !d){ endCallCleanup(); return; }
  if(d.status === "ended"){ toast("انتهت المكالمة"); endCallCleanup(); return; }
  if(callRole === "caller"){
    if(d.status === "active" && !callerStarted){
      callerStarted = true;
      setStatus("جار إنشاء الاتصال…");
      try{
        var offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await updateDoc(doc(db, "calls", callId), {offer: JSON.stringify(offer)});
      }catch(e){}
    }
    if(d.answer && pc && !pc.currentRemoteDescription){
      try{ await pc.setRemoteDescription(JSON.parse(d.answer)); }catch(e){}
    }
    var ac = d.acands || [];
    if(pc && pc.currentRemoteDescription){
      for(var i = appliedACands; i < ac.length; i++){
        try{ await pc.addIceCandidate(JSON.parse(ac[i])); }catch(e){}
      }
      appliedACands = ac.length;
    }
  } else {
    if(d.offer && pc && !pc.currentRemoteDescription){
      try{
        await pc.setRemoteDescription(JSON.parse(d.offer));
        var ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        await updateDoc(doc(db, "calls", callId), {answer: JSON.stringify(ans)});
      }catch(e){}
    }
    var cc = d.cands || [];
    if(pc && pc.currentRemoteDescription){
      for(var j = appliedCands; j < cc.length; j++){
        try{ await pc.addIceCandidate(JSON.parse(cc[j])); }catch(e){}
      }
      appliedCands = cc.length;
    }
  }
  if(d.status === "active") setStatus("متصل الآن 🟢");
}
function openCallUI(name){
  var d = document.createElement("div");
  d.id = "callui";
  d.className = "call-ui";
  d.innerHTML =
    '<div class="call-remote"><video id="remoteV" autoplay playsinline></video>' +
    '<div class="call-info"><b id="callName"></b><div class="call-status" id="callStatus">جار الاتصال…</div></div>' +
    '<div class="call-local" id="localBox"><video id="localV" autoplay playsinline muted></video></div></div>' +
    '<div class="call-bar">' +
    '<button class="call-btn" id="muteBtn">🎙</button>' +
    (callType === "video" ? '<button class="call-btn" id="camBtn">📷</button>' : "") +
    '<button class="call-btn end" id="endBtn" style="width:70px;height:70px">📵</button></div>';
  document.body.appendChild(d);
  $("#callName").textContent = name;
  if(localStream){
    $("#localV").srcObject = localStream;
    if(callType !== "video"){ var lb = $("#localBox"); if(lb) lb.style.display = "none"; }
  }
  $("#muteBtn").onclick = function(){
    var tr = localStream.getAudioTracks()[0];
    if(tr){ tr.enabled = !tr.enabled; this.classList.toggle("on", !tr.enabled); this.textContent = tr.enabled ? "🎙" : "🔇"; }
  };
  var cb = $("#camBtn");
  if(cb) cb.onclick = function(){
    var tr = localStream.getVideoTracks()[0];
    if(tr){ tr.enabled = !tr.enabled; this.classList.toggle("on", !tr.enabled); }
  };
  $("#endBtn").onclick = hangup;
}
function setStatus(t){ var s = $("#callStatus"); if(s) s.textContent = t; }
async function hangup(){
  if(callId){
    await updateDoc(doc(db, "calls", callId), {status: "ended"}).catch(function(){});
    await deleteDoc(doc(db, "calls", callId)).catch(function(){});
  }
  endCallCleanup();
}
function endCallCleanup(){
  callBusy = false;
  stopRing(); clearTimeout(window._callTimer);
  var incx = document.getElementById("incoming"); if(incx) incx.remove(); window._incId = null;
  if(callUnsub){ callUnsub(); callUnsub = null; }
  if(pc){ try{ pc.close(); }catch(e){} pc = null; }
  if(localStream){ localStream.getTracks().forEach(function(t){ t.stop(); }); localStream = null; }
  var u = $("#callui"); if(u) u.remove();
  var inc = $("#incoming"); if(inc) inc.remove();
  callId = null; callerStarted = false; appliedCands = 0; appliedACands = 0;
}

    if(b.id === "up"){ var c2 = cred(); await createUserWithEmailAndPassword(auth, c2.e, c2.p); return; }

      if(mode === "phone") return er("حسابات الهاتف لا تستعاد — تواصل مع الدعم");
      await sendPasswordResetEmail(auth, $("#em").value.trim());
      return er("تم إرسال رابط الاستعادة");
    }
    if(b.id === "gg"){ await ssoSignIn(new GoogleAuthProvider()); return; }

      fbp.addScope("email");

    }
    await actions(b, er);
  }catch(x){

});

async function ssoSignIn(provider){
  try{
    await signInWithPopup(auth, provider);
  }catch(e){
    // على بعض الهواتف/التطبيقات المثبّتة تُحجب النوافذ المنبثقة: ننتقل للتحويل المباشر
    if(e && (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment")){
      await signInWithRedirect(auth, provider);
      return;
    }
    if(e && e.code === "auth/cancelled-popup-request") return;
    throw e;
  }
}

    '<button type="button" class="btn gray" data-si="close" style="width:100%;margin-top:8px">'+(en?"Cancel":"إلغاء")+'</button></div>';
  document.body.appendChild(d);
  d.addEventListener("click", function(e){ if(e.target===d || e.target.closest("[data-si=close]")) d.remove(); });
  d.querySelector("#vr-send").onclick = async function(){
    var reason = (d.querySelector("#vr-reason").value||"").trim();
    var err = d.querySelector("#vr-err");
    if(reason.length < 10){ err.textContent = en?"Please write a longer reason":"اكتب سبباً أوضح (10 أحرف على الأقل)"; return; }
    err.textContent = en?"Sending…":"جاري الإرسال…";
    try{
      await addDoc(collection(db, "verifyRequests"), {
        uid: me.uid, name: prof.name||"", photo: prof.photo||"",
        kind: d.querySelector("#vr-kind").value,
        reason: reason,
        evidence: (d.querySelector("#vr-evidence").value||"").trim(),
        status: "pending", ts: Date.now()
      });
      d.remove();
      toast(en?"Request submitted":"تم إرسال طلب التوثيق");
    }catch(ex){ err.textContent = errMsg(ex); }
  };
}

(function(){
  var __hhPressButton=null, __hhPressTimer=null, __hhPressStart=0;
  function showReactionPicker(btn){
    var art = btn.closest("article");
    if(!art) return;
    window.__hhLongReact = true;
    var old = document.querySelector(".reaction-picker");
    if(old) old.remove();
    var picker = document.createElement("div");
    picker.className = "reaction-picker";
    picker.setAttribute("role","dialog");
    picker.innerHTML = '<button type="button" data-a="react" data-r="like" data-i="'+art.dataset.id+'">👍</button>'+
      '<button type="button" data-a="react" data-r="love" data-i="'+art.dataset.id+'">❤️</button>'+
      '<button type="button" data-a="react" data-r="laugh" data-i="'+art.dataset.id+'">😂</button>'+
      '<button type="button" data-a="react" data-r="sad" data-i="'+art.dataset.id+'">😢</button>'+
      '<button type="button" data-a="react" data-r="angry" data-i="'+art.dataset.id+'">😡</button>';
    var acts = art.querySelector(".acts");
    if(acts) acts.parentNode.insertBefore(picker, acts.nextSibling);
    else art.appendChild(picker);
  }
  document.addEventListener("pointerdown", function(e){
    var b = e.target.closest('button[data-a="like"]');
    if(!b) return;
    __hhPressButton = b;
    __hhPressStart = Date.now();
    clearTimeout(__hhPressTimer);
    __hhPressTimer = setTimeout(function(){
      if(!__hhPressButton) return;
      try{ if(navigator.vibrate) navigator.vibrate(12); }catch(err){}
      showReactionPicker(__hhPressButton);
    }, 420);
  }, true);
  function clearPress(){ clearTimeout(__hhPressTimer); __hhPressButton=null; }
  ["pointerup","pointercancel","pointerleave"].forEach(function(ev){
    document.addEventListener(ev, clearPress, true);
  });
  // Block native long-press menu (copy / search / share) on reaction button
  document.addEventListener("contextmenu", function(e){
    if(e.target.closest('button[data-a="like"]') || e.target.closest(".reaction-picker")){
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);
  document.addEventListener("touchstart", function(e){
    var b = e.target.closest('button[data-a="like"]');
    if(!b) return;
    // prevent iOS callout
  }, {passive:true});
  document.addEventListener("selectstart", function(e){
    if(e.target.closest('button[data-a="like"]')) e.preventDefault();
  }, true);
})();

/* روابط مباشرة */
async function openHash(){
  if(!me || !$("#main")) return;
  var h = location.hash;
  var m;
  try{
    m = h.match(/^#ask=([\w-]+)/);
    if(m){ history.replaceState(null, "", location.pathname + location.search); openAskModal(m[1]); return; }
    m = h.match(/^#reel=(\w+)/);
    if(m){
      tab = "reels"; draw();
      var tries = 0, rid0 = m[1];
      (function wait(){ if(reels.length || tries++ > 12){ openReelPlayer(rid0); } else setTimeout(wait, 500); })();
      return;
    }
    m = h.match(/^#p=(\w+)/);
    if(m){
      var d1 = await getDoc(doc(db, "posts", m[1]));
      single = d1.exists() ? Object.assign({id: d1.id}, d1.data()) : null;
      tab = "post";
      draw();
      return;
    }
    m = h.match(/^#u=(\w+)/);
    if(m){
      pv = m[1];
      var d2 = await getDoc(doc(db, "users", pv));
      pd = d2.exists() ? d2.data() : {name: "عضو"};
      tab = "profile";
      draw();
    }
  }catch(e){}
}

var deferredPrompt = null;
function detectOS(){
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  return { isIOS: isIOS, isAndroid: isAndroid, isMobile: isIOS || isAndroid || /Mobile/i.test(ua) };
}
function isStandaloneApp(){
  return window.matchMedia("(display-mode: standalone)").matches || !!navigator.standalone;
}
function refreshInstallUI(){
  var os = detectOS();
  var pwaBtn = document.getElementById("pwa-install");
  var iosTip = document.getElementById("ios-tip");
  var box = document.getElementById("install-box") || document.querySelector(".install-box");
  if(isStandaloneApp()){
    if(box) box.style.display = "none";
    return;
  }
  if(pwaBtn){
    pwaBtn.style.display = "block";
    pwaBtn.type = "button";
    if(os.isIOS){
      pwaBtn.textContent = (getLang()==="en") ? "🍎 Add to Home Screen (iPhone)" : "🍎 إضافة إلى الشاشة الرئيسية (آيفون)";
    } else if(os.isAndroid){
      pwaBtn.textContent = (getLang()==="en") ? "⬇️ Install App on Android" : "⬇️ تثبيت التطبيق على أندرويد";
    } else {
      pwaBtn.textContent = (getLang()==="en") ? "⬇️ Install HashidHub App" : "⬇️ تثبيت تطبيق HashidHub";
    }
  }
  if(iosTip) iosTip.classList.remove("show");
}
function showInstallInstructions(){
  var os = detectOS();
  var en = getLang()==="en";
  var title = en ? "Install HashidHub" : "تثبيت HashidHub";
  var body;
  if(os.isIOS){
    body = en
      ? "1) Tap the Share button □↑ at the bottom of Safari\n2) Choose «Add to Home Screen»\n3) Tap «Add» — HashidHub icon will appear like an app."
      : "1) اضغط زر المشاركة □↑ أسفل Safari\n2) اختر «إضافة إلى الشاشة الرئيسية»\n3) اضغط «إضافة» — ستظهر أيقونة HashidHub كتطبيق.";
  } else if(os.isAndroid){
    body = en
      ? "1) Tap the browser menu ⋮ (top right)\n2) Choose «Install app» or «Add to Home screen»\n3) Confirm — HashidHub will open like a native app."
      : "1) اضغط قائمة المتصفح ⋮ (أعلى اليمين)\n2) اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»\n3) أكّد — سيفتح HashidHub كتطبيق.";
  } else {
    body = en
      ? "In Chrome/Edge: open the browser menu and choose «Install HashidHub» or the install icon in the address bar."
      : "في Chrome/Edge: من قائمة المتصفح اختر «تثبيت HashidHub» أو أيقونة التثبيت في شريط العنوان.";
  }
  openSheet(title, [
    {label: en ? "Got it" : "حسناً", action: function(){}}
  ]);
  // also show tip text under login if present
  var tip = document.getElementById("ios-tip");
  if(tip){
    tip.innerHTML = body.replace(/\n/g, "<br>");
    tip.classList.add("show");
  } else {
    toast(body.split("\n")[0], 4000);
  }
}
async function handleInstallClick(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(isStandaloneApp()){ toast(getLang()==="en"?"Already installed":"التطبيق مثبت بالفعل"); return; }
  if(deferredPrompt){
    try{
      deferredPrompt.prompt();
      var choice = await deferredPrompt.userChoice;
      deferredPrompt = null;
      refreshInstallUI();
      if(choice && choice.outcome === "accepted") toast(getLang()==="en"?"Installing…":"جاري التثبيت…");
    }catch(err){
      showInstallInstructions();
    }
    return;
  }
  showInstallInstructions();
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredPrompt = e;
  refreshInstallUI();
});
document.addEventListener("click", function(e){
  var t = e.target;
  if(!t) return;
  if(t.id === "pwa-install" || (t.closest && t.closest("#pwa-install"))){
    handleInstallClick(e);
  }
});
