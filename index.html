<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7a5f">
<meta name="description" content="HashidHub — تواصل · شارك · انطلق">
<meta property="og:site_name" content="HashidHub">
<meta property="og:title" content="HashidHub">
<meta property="og:description" content="منصة تواصل اجتماعي: منشورات، ريلز، قصص، صفحات ومجموعات.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://esm.sh" crossorigin>
<script src="media-config.js"></script>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HashidHub — تواصل، شارك، وانطلق</title>
<meta name="description" content="HashidHub منصة اجتماعية تجمع الأصدقاء والمجتمعات والمقاطع القصيرة في مكان واحد.">
<meta property="og:title" content="HashidHub">
<meta property="og:description" content="مساحتك للتواصل والمشاركة وصناعة المجتمع.">
<script>
try{
  var t = localStorage.getItem("hn_theme");
  if(t) document.documentElement.dataset.theme = t;
}catch(e){}
</script>
<style>
:root{
  --bg:#f0f7f4;--card:#ffffff;--ink:#0f1f1a;--mute:#5a6b63;--line:#d4e5dc;
  --brand:#0d7a5f;--brand2:#0f9a75;--gold:#d4a017;--like:#e11d48;
  --sh:0 2px 8px rgba(13,122,95,.08)
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1210;--card:#15201c;--ink:#e8f0ec;--mute:#8fa39a;--line:#24332c;
    --brand:#2dd4a8;--brand2:#1faf8a;--gold:#f0c14b;--like:#fb7185;
    --sh:0 2px 12px rgba(0,0,0,.45)
  }
}
:root[data-theme="dark"]{
  --bg:#0c1210;--card:#15201c;--ink:#e8f0ec;--mute:#8fa39a;--line:#24332c;
  --brand:#2dd4a8;--brand2:#1faf8a;--gold:#f0c14b;--like:#fb7185;
  --sh:0 2px 12px rgba(0,0,0,.45)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Naskh Arabic",Tahoma,Arial,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 calc(70px + env(safe-area-inset-bottom))}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px;box-shadow:var(--sh)}
.logo{font-size:1.4rem;font-weight:800}
.logo b{color:#ffd27a}
.hbtn{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.15);color:#fff;font-weight:600;font-size:.9rem}
.hbtn:active{background:rgba(255,255,255,.28)}
.wrap{max-width:640px;margin:0 auto;padding:14px 12px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
.av.sm{width:32px;height:32px}
.av.lg{width:84px;height:84px}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:6px}
textarea,input[type=text],input[type=url],input[type=email],input[type=password],input[type=tel],input[type=search],input[type=number]{
  width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
textarea{resize:vertical;min-height:70px}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;max-width:100%}
.btn{background:var(--brand);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.gold{background:linear-gradient(135deg,#e0a94a,#c8902b);color:#fff}
.btn.red{background:#b3261e;color:#fff}
.btn.gray{background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.btn.big{width:100%;padding:13px;font-size:1.05rem;border-radius:12px}
.name{font-weight:700;text-align:start;background:none;color:inherit;padding:0}
.time{font-size:.8rem;color:var(--mute)}
.mini{font-size:.8rem;color:var(--mute);padding:4px 8px;border-radius:8px}
.mini:active{background:var(--bg)}
.body{white-space:pre-wrap;word-break:break-word;margin:6px 0 10px}
.media{max-width:100%;max-height:480px;border-radius:10px;display:block;margin:6px 0;cursor:zoom-in}
.media.vid{max-height:600px;width:100%;cursor:default}
.stats{font-size:.85rem;color:var(--mute);display:flex;justify-content:space-between;padding-bottom:8px;border-bottom:1px solid var(--line)}
.acts{display:flex;justify-content:space-around;padding-top:6px}
.acts button{padding:8px 12px;border-radius:8px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:4px}
.acts .on{color:var(--like)}
.cm{background:var(--bg);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:.95rem;word-break:break-word}
.cm small{color:var(--mute)}
.ad{border:1.5px dashed var(--gold);position:relative}
.tag{font-size:.7rem;color:var(--gold);font-weight:700;position:absolute;top:8px;inset-inline-end:12px}
.empty{text-align:center;color:var(--mute);padding:30px 0}
.note{font-size:.8rem;color:var(--mute)}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.tools label{cursor:pointer;color:var(--brand);font-weight:600;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.grid div{background:var(--bg);border-radius:10px;padding:10px}
.grid b{display:block;font-size:1.4rem;color:var(--brand)}
.login{max-width:400px;margin:6vh auto}
.login h1{text-align:center;color:var(--brand);font-size:2.2rem;margin:0}
.login h1 b{color:var(--gold)}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;padding:9px;border:1px solid var(--line);border-radius:10px;font-weight:600}
.tabs .on{background:var(--brand);color:#fff;border-color:var(--brand)}
h3{margin:0 0 10px;font-size:1.05rem}
.err{color:#b3261e;font-size:.9rem;min-height:1.4em;margin-top:6px}
.vb{width:.9em;height:.9em;vertical-align:-.13em;margin-inline-start:3px;flex:none}
.crown{width:1em;height:1em;vertical-align:-.15em;margin-inline-start:3px}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--mute);border:1px solid var(--line)}
.chip.green{background:#e7f5ef;color:var(--brand);border-color:transparent}
.chip.gold{background:linear-gradient(135deg,#ffe9bd,#f7d488);color:#7a5410;border-color:transparent}

/* زر المتابعة البارز */
.fbtn{flex:1;padding:11px;border-radius:12px;font-weight:800;font-size:.95rem}
.fbtn.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 3px 10px rgba(15,107,79,.35)}
.fbtn.off{background:var(--bg);color:var(--brand);border:1.5px solid var(--brand)}

.pcard{background:linear-gradient(160deg,var(--card),var(--bg));border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}

.sug-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sug-row:last-child{border-bottom:0}

.pg-card{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--card)}
.pg-av{width:56px;height:56px;border-radius:16px;object-fit:cover;background:var(--line);flex:none}
.pg-av.round{border-radius:50%}

.bnav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:.68rem;padding:6px 4px;position:relative;font-weight:600}
.bnav button.on{color:var(--brand)}
.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bnav b{position:absolute;top:2px;inset-inline-end:calc(50% - 18px);background:#c2410c;color:#fff;border-radius:999px;font-size:.6rem;padding:1px 5px;min-width:16px;text-align:center}
.bnav b:empty{display:none}

#toast{position:fixed;bottom:84px;inset-inline:20px;background:#1f2a24;color:#fff;padding:12px 16px;border-radius:12px;text-align:center;z-index:200;box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;font-size:.9rem}
#toast.show{transform:translateY(0);opacity:1}

.stories{display:flex;gap:10px;overflow-x:auto;padding:10px 4px;margin-bottom:12px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story-bubble{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;color:var(--mute)}
.story-ring{width:64px;height:64px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--gold),var(--brand));display:flex;align-items:center;justify-content:center}
.story-ring.seen{background:var(--line)}
.story-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid var(--card);background:var(--card)}
.story-ring .new{background:var(--card);color:var(--brand);width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:300}
.story-viewer{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column}
.story-progress{display:flex;gap:4px;padding:10px;padding-top:calc(10px + env(safe-area-inset-top))}
.story-progress i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden}
.story-progress i.done{background:#fff}
.story-progress i.on{background:rgba(255,255,255,.5)}
.story-head{display:flex;align-items:center;gap:10px;padding:0 16px 10px;color:#fff}
.story-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
.story-body img{max-width:100%;max-height:100%;object-fit:contain}
.story-cap{position:absolute;bottom:20px;inset-inline:16px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);text-align:center}

.reel-page{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.reel-cell{position:relative;display:block;width:100%;padding:0;text-align:inherit;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#000;cursor:pointer;border:0;color:#fff}
.reel-cell video{width:100%;height:100%;object-fit:cover}
.reel-meta{position:absolute;bottom:0;inset-inline:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:.78rem;display:block}.reel-play-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:999px;background:#0009;color:#fff;font-weight:700;pointer-events:none}

.reel-player{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;overflow-y:scroll;scroll-snap-type:y mandatory}
.reel-player::-webkit-scrollbar{display:none}
.reel-item{height:100vh;height:100dvh;min-height:100vh;min-height:100dvh;flex:0 0 100vh;flex-basis:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.reel-item video{width:100%;height:100%;object-fit:contain;max-height:100vh}
.reel-info{position:absolute;bottom:80px;inset-inline:16px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.reel-info .u{display:flex;flex-direction:column;gap:6px;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.reel-actions{display:flex;flex-direction:column;gap:16px;align-items:center}
.reel-actions button{color:#fff;display:flex;flex-direction:column;align-items:center;font-size:.75rem;gap:2px}
.reel-retry{color:#fff;background:#1877f2;padding:8px 14px;border-radius:999px;pointer-events:auto}.reel-sound{position:absolute;top:calc(20px + env(safe-area-inset-top));inset-inline-start:16px;color:#fff;background:rgba(0,0,0,.55);border-radius:999px;padding:9px 13px;z-index:70;font-size:.85rem}.reel-close{position:absolute;top:20px;inset-inline-end:16px;color:#fff;background:rgba(0,0,0,.5);border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;z-index:70}
.brand-sub{font-size:.66rem;opacity:.86;font-weight:500;letter-spacing:.02em}
.reel-shelf{display:flex;gap:9px;overflow-x:auto;padding:4px 1px 12px;scrollbar-width:none}
.reel-shelf::-webkit-scrollbar{display:none}
.reel-tile{flex:0 0 116px;height:190px;border-radius:13px;overflow:hidden;background:#111;position:relative;color:#fff;border:1px solid var(--line)}
.reel-tile video{width:100%;height:100%;object-fit:cover}
.reel-tile span{position:absolute;inset-inline:6px;bottom:6px;font-size:.72rem;text-shadow:0 1px 4px #000;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-wrap{position:relative;background:#0d1110;border-radius:10px;overflow:hidden;margin:6px 0}
.video-wrap .media{margin:0;border-radius:0}.feed-sound{position:absolute;z-index:4;top:10px;inset-inline-end:10px;padding:7px 10px;border-radius:999px;background:#000a;color:#fff;font-size:.78rem}
.video-loader{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.32);color:#fff;pointer-events:none;text-align:center;font-size:.84rem}
.video-wrap.is-loading .video-loader{display:flex}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.upload-banner{position:fixed;z-index:300;left:16px;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));max-width:520px;margin:auto;background:var(--card);border:1px solid #1877f2;border-radius:14px;padding:13px 15px;box-shadow:0 8px 32px #0002}
.upload-banner strong{display:block;color:#1877f2;margin-bottom:7px}
.upload-track{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.upload-track i{display:block;height:100%;width:38%;background:#1877f2;border-radius:99px;animation:uploadPulse 1.15s ease-in-out infinite alternate}
@keyframes uploadPulse{from{transform:translateX(160%)}to{transform:translateX(-10%)}}
.loading-soft{margin:12px 0;padding:13px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mute);text-align:center}
.reel-item .reel-loader{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:rgba(0,0,0,.3);pointer-events:none;color:white}
.reel-item.is-loading .reel-loader{display:flex}
.reel-item .reel-info{z-index:2}
@media(min-width:800px){.wrap{max-width:760px}.reel-tile{flex-basis:132px;height:210px}}

.search-tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.search-tabs button{padding:6px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:.85rem;white-space:nowrap}
.search-tabs .on{background:var(--brand);color:#fff;border-color:var(--brand)}
.hashtag{color:var(--brand);font-weight:700}
.mention{color:var(--gold);font-weight:700}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-in{background:var(--card);border-radius:16px;padding:20px;max-width:400px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:85vh;overflow-y:auto}
.modal-in h3{margin-top:0}
.modal-in .btn{width:100%;margin-top:8px}

/* المكالمات */
.call-ui{position:fixed;inset:0;background:#0b0f0d;z-index:120;display:flex;flex-direction:column}
.call-remote{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.call-remote video{width:100%;height:100%;object-fit:cover}
.call-local{position:absolute;top:calc(14px + env(safe-area-inset-top));inset-inline-end:14px;width:110px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#222;z-index:5;box-shadow:0 4px 16px rgba(0,0,0,.5)}
.call-local video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.call-info{position:absolute;top:calc(20px + env(safe-area-inset-top));inset-inline-start:18px;color:#fff;z-index:5;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.call-info b{font-size:1.2rem}
.call-status{font-size:.85rem;opacity:.85}
.call-bar{display:flex;justify-content:center;gap:18px;padding:22px 0 calc(26px + env(safe-area-inset-bottom));background:rgba(0,0,0,.35)}
.call-btn{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);color:#fff}
.call-btn.end{background:#d93025}
.call-btn.on{background:#fff;color:#111}
.incoming{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:130;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff}

.premium-hero{background:linear-gradient(135deg,#1c1408,#3a2c10);border:1.5px solid var(--gold);border-radius:16px;padding:18px;color:#ffe9bd;margin-bottom:12px}
.premium-hero h2{margin:0 0 6px;color:#ffd27a}
.feat{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed rgba(200,144,43,.25)}
.feat:last-child{border-bottom:0}
.feat .ic{width:34px;height:34px;border-radius:10px;background:rgba(200,144,43,.18);display:flex;align-items:center;justify-content:center;flex:none;font-size:1.1rem}

.reaction-picker{display:flex;gap:4px;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 10px;box-shadow:0 8px 28px rgba(0,0,0,.15);margin:6px 0;animation:pop .18s ease}
.reaction-picker button{font-size:1.45rem;padding:4px 8px;border-radius:50%;transition:transform .12s}
.reaction-picker button:active{transform:scale(1.25)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sheet{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet-in{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:12px 16px 28px;box-shadow:0 -8px 32px rgba(0,0,0,.2);max-height:80vh;overflow:auto}
.sheet-in h3{margin:4px 0 12px;text-align:center}
.sheet-opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px 10px;border-radius:12px;font-weight:600;font-size:1rem;text-align:start}
.sheet-opt:active,.sheet-opt:hover{background:var(--bg)}
.sheet-opt.danger{color:#b3261e}
.cm{position:relative}
.cm .cm-actions{display:none;gap:6px;margin-top:4px}
.cm.show-actions .cm-actions{display:flex;flex-wrap:wrap}
.cm-reply{margin-inline-start:28px;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.cm.hidden-cm{opacity:.45}
.cm.hidden-cm .cm-body{font-style:italic;color:var(--mute)}
.stats-react{display:flex;gap:6px;flex-wrap:wrap;font-size:.82rem}
.stats-react span{background:var(--bg);padding:2px 8px;border-radius:999px}
.acts button{transition:color .15s,background .15s}
.acts button:active{background:var(--bg)}
.menu-section-label{padding:8px 12px 4px;font-size:.78rem;font-weight:800;color:var(--muted);border-top:1px solid var(--line);margin-top:4px}
.settings-list label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600}
.settings-list input[type=checkbox]{width:20px;height:20px;accent-color:var(--brand)}
.install-box .btn{font-size:.95rem}


.reel-side-actions{position:absolute;inset-inline-end:12px;bottom:100px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:5}
.rsa{display:flex;flex-direction:column;align-items:center;gap:3px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-size:.75rem;font-weight:700;background:none;border:0;padding:0}
.rsa-ico{font-size:1.7rem;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.rsa-n{font-size:.72rem}
.rsa-av{width:42px;height:42px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#333}

/* ================= مشغّل الريلز ================= */
.reel-viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;justify-content:center;overscroll-behavior:contain}
.reel-stage{position:relative;width:100%;max-width:calc(100dvh * .5625);height:100%;background:#000;overflow:hidden}
.reel-scroller{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.reel-scroller::-webkit-scrollbar{display:none}
.reel-viewer .reel-item{position:relative;display:block;height:100%;min-height:0;flex:none;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000;color:#fff;user-select:none;-webkit-user-select:none}
.reel-viewer .reel-item video{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;background:#000}

.reel-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,transparent 22%,transparent 55%,rgba(0,0,0,.72) 100%)}
.reel-top{position:absolute;top:0;inset-inline:0;z-index:8;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;pointer-events:none}
.reel-top button{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.reel-top svg{width:24px;height:24px}
html[dir="rtl"] .reel-top .flip{transform:scaleX(-1)}
.reel-flash{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.7);pointer-events:none;z-index:5;transition:opacity .18s,transform .18s}
.reel-flash svg{width:40px;height:40px}
.reel-item.paused .reel-flash{opacity:1;transform:scale(1)}
.reel-heart{position:absolute;z-index:6;font-size:96px;line-height:1;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.4)}
.reel-heart.go{animation:hh-heart .8s ease-out}
@keyframes hh-heart{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}60%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-95%) scale(1)}}
.reel-viewer .reel-info{position:absolute;z-index:6;inset-inline-start:14px;inset-inline-end:78px;bottom:calc(24px + env(safe-area-inset-bottom));display:block;text-shadow:0 1px 4px rgba(0,0,0,.65)}
.ri-user{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.ri-av img{width:40px;height:40px;border-radius:50%;border:2px solid #fff;object-fit:cover;display:block;background:#333}
.ri-name{font-weight:800;font-size:1rem;color:#fff;text-align:start}
.ri-cap{font-size:.92rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;cursor:pointer}
.ri-cap.open{-webkit-line-clamp:unset;max-height:32vh;overflow:auto}
.ri-views{font-size:.78rem;opacity:.85;margin-top:6px}
.reel-viewer .reel-side-actions{position:absolute;z-index:7;inset-inline-end:10px;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;align-items:center}
.reel-viewer .rsa svg{width:31px;height:31px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

.reel-viewer .rsa-n{font-size:.76rem;font-weight:700}
.reel-bar{position:absolute;z-index:9;left:0;right:0;bottom:0;height:20px;direction:ltr;cursor:pointer;touch-action:none}
.reel-bar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.28)}
.reel-bar i{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fff;transition:width .25s linear}
.reel-bar:hover::before,.reel-bar:hover i{height:5px}

/* ================= v1.6 ================= */
/* نص المنشور المختصر + المزيد */
.body.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

/* مشغّل الفيديو في الموجز: حجم ثابت وغلاف واضح */
.vplayer{position:relative;width:100%;aspect-ratio:var(--ar,1.7778);max-height:78vh;background:#0b1220;border-radius:12px;overflow:hidden;margin-top:8px;user-select:none;-webkit-user-select:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.vplayer video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
.vplayer.started video{display:block}
.vplayer .vp-poster,.vplayer .vp-fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vplayer.started .vp-poster,.vplayer.started .vp-fallback{display:none}
.vp-fallback{background:linear-gradient(135deg,#0f9a75,#16324f);display:flex;align-items:center;justify-content:center}
.vp-fallback img{width:76px;height:76px;border-radius:50%;object-fit:cover;opacity:.92;border:3px solid rgba(255,255,255,.7)}
.vp-big{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:3;transition:transform .15s}
.vp-big:active{transform:scale(.92)}
.vplayer.playing .vp-big,.vplayer.loading .vp-big{display:none}
.vp-spin{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.vplayer.loading .vp-spin{display:flex}
.vp-ctrl{position:absolute;inset-inline:0;bottom:0;z-index:4;display:none;align-items:center;gap:6px;padding:22px 8px 6px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);color:#fff;direction:ltr;font-size:.78rem;font-variant-numeric:tabular-nums}
.vplayer.started .vp-ctrl{display:flex;opacity:0;transition:opacity .2s}
.vplayer.started.show .vp-ctrl,.vplayer.started:not(.playing) .vp-ctrl{opacity:1}
.vp-ctrl button{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.vp-ctrl button svg{width:22px;height:22px}
.vp-bar{position:relative;flex:1;height:26px;cursor:pointer;touch-action:none}
.vp-bar::before{content:"";position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:rgba(255,255,255,.3)}
.vp-bar i{position:absolute;left:0;top:11px;height:4px;width:0;border-radius:2px;background:#fff}
.vplayer:fullscreen{max-height:none;border-radius:0;aspect-ratio:auto;width:100%;height:100%;background:#000}
.vplayer:-webkit-full-screen{max-height:none;border-radius:0;aspect-ratio:auto;width:100%;height:100%;background:#000}

/* بطاقة الريل في الموجز */
.reel-card .vcover{position:relative;display:block;width:100%;aspect-ratio:4/5;max-height:70vh;border-radius:12px;overflow:hidden;background:#0b1220;margin-top:8px;padding:0;border:0}

.vp-big-s{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.vc-views{position:absolute;bottom:10px;inset-inline-start:10px;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.55);color:#fff;font-size:.78rem}

/* أغلفة الريلز بدل الشاشة السوداء */
.rc-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rc-fallback{position:absolute;inset:0;background:linear-gradient(160deg,#0f9a75,#16324f);display:flex;align-items:center;justify-content:center}
.rc-fallback img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.7)}
.reel-cell,.reel-tile{position:relative;overflow:hidden;background:#0b1220}

async function compressImage(file, maxBytes){
  maxBytes = maxBytes || (1200 * 1024); // ~1.2MB هدف

    var bitmap;
    if("createImageBitmap" in window){
      bitmap = await createImageBitmap(file);
    } else {
      bitmap = await new Promise(function(resolve, reject){
        var img = new Image();
        img.onload = function(){ resolve(img); };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });

    var maxSide = 1920;
    var w = bitmap.width || bitmap.naturalWidth;
    var h = bitmap.height || bitmap.naturalHeight;
    var scale = Math.min(1, maxSide / Math.max(w, h));
    var canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(w * scale));
    canvas.height = Math.max(1, Math.round(h * scale));
    var ctx = canvas.getContext("2d", { alpha: false, colorSpace: "srgb" });
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    try{ if(bitmap.close) bitmap.close(); }catch(e){}
    var quality = 0.82;
    var blob = await new Promise(function(resolve){ canvas.toBlob(resolve, "image/jpeg", quality); });
    while(blob && blob.size > maxBytes && quality > 0.45){
      quality -= 0.08;
      blob = await new Promise(function(resolve){ canvas.toBlob(resolve, "image/jpeg", quality); });
    }
    // إن بقيت كبيرة صغّر الأبعاد أكثر
    while(blob && blob.size > maxBytes && canvas.width > 720){
      canvas.width = Math.round(canvas.width * 0.8);
      canvas.height = Math.round(canvas.height * 0.8);
      ctx = canvas.getContext("2d", { alpha: false });
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // نحتاج إعادة رسم من blob السابق كصورة
      var tmp = await createImageBitmap(blob);
      ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
      try{ tmp.close(); }catch(e){}
      quality = 0.75;
      blob = await new Promise(function(resolve){ canvas.toBlob(resolve, "image/jpeg", quality); });
    }
    if(!blob) return file;
    var name = (file.name || "image").replace(/\.\w+$/, "") + ".jpg";
    return new File([blob], name, { type: "image/jpeg", lastModified: Date.now() });
  }catch(err){
    console.warn("compress failed", err);
    return file;
  }
}

function xhrUpload(url, file, folder, token, onPct){
  return new Promise(function(resolve, reject){
    var x = new XMLHttpRequest();
    x.open("POST", url);
    x.setRequestHeader("Authorization", "Bearer " + token);
    x.timeout = 5 * 60 * 1000;
    x.upload.onprogress = function(e){ if(e.lengthComputable) onPct(Math.round(e.loaded / e.total * 100)); };
    x.onload = function(){
      var j = {}; try{ j = JSON.parse(x.responseText); }catch(e){}
      if(x.status >= 200 && x.status < 300 && (j.path || j.url)) resolve(j);
      else reject(mediaErr(j.message || ("فشل الرفع (" + x.status + ")")));
    };
    x.onerror = function(){ reject(mediaErr("تعذّر الاتصال بخدمة الوسائط. تحقق من الشبكة ومن media-config.js")); };
    x.ontimeout = function(){ reject(mediaErr("انتهت مهلة الرفع. جرّب شبكة أقوى.")); };
    var fd = new FormData(); fd.append("folder", folder); fd.append("file", file, file.name || "media");
    x.send(fd);
  });
}

async function upUpload(file, folder){
  if(!me || !auth.currentUser) throw Object.assign(new Error("يجب تسجيل الدخول أولاً"), {code: "auth-required"});
  var isVideo = file.type.indexOf("video/") === 0, isImage = file.type.indexOf("image/") === 0, isAudio = file.type.indexOf("audio/") === 0;
  if(!isImage && !isVideo && !isAudio) throw Object.assign(new Error("نوع الملف غير مدعوم"), {code: "badtype"});
  if(!/^(avatars|videos|posts|pages|groups|stories|reels|voice)$/.test(folder)) throw new Error("مسار رفع غير مسموح");
  var base = mediaApi();
  if(isAudio){
    if(file.size > 6 * 1024 * 1024) throw mediaErr("التسجيل الصوتي كبير جداً");
  } else if(isImage){
    uploadNotice(true, "نضغط الصورة تلقائياً…");
    try{ file = await compressImage(file, 1500 * 1024); } finally { uploadNotice(false); }
    if(file.size > 4 * 1024 * 1024) throw mediaErr("تعذّر ضغط الصورة بما يكفي. جرّب صورة أصغر.");
  } else {
    if(file.size > MEDIA_MAX_SRC) throw mediaErr("الحد الأقصى للفيديو 50 ميجابايت.");
    var lim = folder === "reels" ? MEDIA_REEL_OUT : MEDIA_MAX_OUT;
    if(file.size > lim || !/^video\/(mp4|webm|quicktime)$/.test(file.type)){
      try{
        file = await compressVideo(file, function(p){ uploadNotice(true, "نضغط الفيديو تلقائياً… " + Math.round(p) + "%"); }, lim);
      } finally { uploadNotice(false); }
      if(file.size > MEDIA_MAX_OUT) throw mediaErr("تعذّر ضغط الفيديو إلى أقل من 19MB. قصّه أو اختر فيديو أقصر.");
    }
  }
  uploadNotice(true, "يتم رفع الملف…");
  try{
    var idToken = await auth.currentUser.getIdToken();
    var out = await xhrUpload(base + "/upload", file, folder, idToken, function(p){ uploadNotice(true, "يتم رفع الملف… " + p + "%"); });
    return out.path ? mediaPublic() + out.path : fixMedia(out.url);
  } finally { uploadNotice(false); }
}

  var rest = ok.filter(function(r){ return now - (r.ts || 0) >= FRESH; }).sort(function(a, b){ return reelScore(b) - reelScore(a); });
  return fresh.concat(rest); // الجديد أولاً ثم الأعلى مشاهدة/تفاعلاً
}

function phoneEmail(){
  var raw = ($("#ph").value || "");
  var map = "٠١٢٣٤٥٦٧٨٩";
  var d = raw.replace(/[٠-٩]/g, function(c){ return map.indexOf(c).toString(); });
  d = d.replace(/\D/g, "");
  var cc = $("#cc").value;
  if(d.indexOf("00") === 0) d = d.slice(2);
  if(d.indexOf(cc) === 0 && d.length > cc.length + 6) d = d.slice(cc.length);
  d = d.replace(/^0+/, "");
  if(d.length < 6) throw Object.assign(new Error("ph"), {code:"badphone"});
  return cc + d + "@phone.hashidnet.app";
}

function listen(){
  if(isGuest) return listenGuest();
  var L = function(q, fn){ unsubs.push(onSnapshot(q, function(s){ fn(s); draw(); })); };

  if(unP) unP();
  unP = onSnapshot(query(collection(db, "posts"), orderBy("ts", "desc"), limit(plim)), function(s){
    posts = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    draw();
  });
  unsubs.push(function(){ if(unP) unP(); });

  L(collection(db, "likes"), function(s){ likes = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(query(collection(db, "comments"), orderBy("ts", "asc")), function(s){ comments = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "ads"), function(s){ ads = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  if(typeof adComments === "undefined") window.adComments = [];
  L(collection(db, "adComments"), function(s){ adComments = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "promoteRequests"), function(s){ promoteRequests = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "verifyRequests"), function(s){ verifyRequests = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "banned"), function(s){ banned = {}; s.docs.forEach(function(d){ banned[d.id] = 1; }); });
  L(collection(db, "follows"), function(s){ follows = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
  L(collection(db, "friends"), function(s){
    friends = s.docs.map(function(d){ return Object.assign({id:d.id, u1:d.data().u1, u2:d.data().u2}, d.data()); });
  });
  L(collection(db, "friendReqs"), function(s){
    reqs = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .filter(function(r){ return r.from === me.uid || r.to === me.uid; });
  });
  L(collection(db, "premium"), function(s){
    premium = {};
    s.docs.forEach(function(d){ premium[d.id] = d.data(); });
  });
  var hadNotifSnapshot=false, seenNotifIds=new Set();
  L(query(collection(db, "notifs"), where("to", "==", me.uid)), function(s){
    var incoming=s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    if(hadNotifSnapshot && document.hidden && window.Notification && Notification.permission==="granted") incoming.forEach(function(n){if(!seenNotifIds.has(n.id)){try{new Notification("HashidHub",{body:(n.name||"عضو")+" قام بتفاعل جديد",icon:"icon.svg",tag:n.id});}catch(e){}}});
    incoming.forEach(function(n){seenNotifIds.add(n.id);}); hadNotifSnapshot=true;
    notifs = incoming.sort(function(x,y){ return y.ts - x.ts; }).slice(0, 60);
  });
  L(query(collection(db, "messages"), where("members", "array-contains", me.uid)), function(s){
    msgs = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .sort(function(x,y){ return x.ts - y.ts; });
  });
  L(query(collection(db,"messageRequests"),where("members","array-contains",me.uid)),function(s){msgReqs=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  L(collection(db, "pollVotes"), function(s){ pollVotes = s.docs.map(function(d){ return d.data(); }); });
  L(collection(db, "admins"), function(s){ adminIds = new Set(s.docs.map(function(d){ return d.id; })); });
  L(query(collection(db, "askQ"), where("to", "==", me.uid)), function(s){ askIn = s.docs.map(function(d){ return Object.assign({id: d.id}, d.data()); }); });
  L(query(collection(db,"savedPosts"),where("uid","==",me.uid)),function(s){savedItems=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  L(collection(db,"storyViews"),function(s){storyViews=s.docs.map(function(d){return Object.assign({id:d.id},d.data());});});
  L(query(collection(db, "blocks"), where("a", "==", me.uid)), function(s){
    blocks = new Set(s.docs.map(function(d){ return d.data().b; }));
  });
  L(query(collection(db, "stories"), orderBy("ts", "desc"), limit(60)), function(s){
    var now = Date.now();
    stories = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
      .filter(function(x){
        if(!x || (!x.media && !x.photo)) return false;
        var exp = Number(x.exp) || 0;
        var ts = Number(x.ts) || 0;
        if(!exp && ts) exp = ts + 86400000;
        if(!exp) return true; // keep if no expiry metadata
        return exp > now - 60000; // 1 min grace
      });
  }, function(err){ console.warn("stories listen", err && err.message); });
  L(query(collection(db, "reels"), orderBy("ts", "desc"), limit(60)), function(s){
    reels = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  unsubs.push(onSnapshot(query(collection(db, "reelLikes"), where("uid", "==", me.uid)), function(sn){
    window._reelLiked = {};
    sn.docs.forEach(function(d){ var r = d.data().rid; if(r) window._reelLiked[r] = true; });
  }, function(){}));
  L(query(collection(db, "pages"), orderBy("ts", "desc"), limit(100)), function(s){
    pages = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  L(query(collection(db, "groups"), orderBy("ts", "desc"), limit(100)), function(s){
    groups = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  L(collection(db, "pageFollows"), function(s){
    pageFollows = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  L(collection(db, "groupMembers"), function(s){
    groupMembers = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
  });
  // المكالمات الواردة
  unsubs.push(onSnapshot(query(collection(db, "calls"), where("to", "==", me.uid)), function(s){
    var ringing = null;
    s.docs.forEach(function(d){
      var c = d.data();
      if(c.status === "ringing"){
        if(Date.now() - (c.ts || 0) > 60000){ deleteDoc(doc(db, "calls", d.id)).catch(function(){}); return; }
        if(!ringing) ringing = {id: d.id, c: c};
      }
    });
    if(ringing && !callBusy) showIncoming(ringing.id, ringing.c);
    else if(!ringing && window._incId) removeIncoming();
  }));

  if(isAdmin){
    L(collection(db, "reports"), function(s){ reports = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); }); });
    L(query(collection(db, "users"), limit(500)), function(s){
      users = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    });
    L(collection(db, "premiumReqs"), function(s){
      premiumReqs = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    });
    L(collection(db, "adstats"), function(s){
      clicks = {};
      s.docs.forEach(function(d){ clicks[d.id] = d.data().clicks || 0; });
    });
  }
}

var MEDIA_REEL_OUT = 8 * 1024 * 1024; // الريلز تُضغط لحجم أصغر ليبدأ تشغيلها أسرع على الشبكات البطيئة

/* التقاط غلاف (صورة) من الفيديو + أبعاده قبل الرفع */
function videoPoster(file){
  return new Promise(function(resolve){
    var url = URL.createObjectURL(file), v = document.createElement("video"), done = false;
    function fin(r){ if(done) return; done = true; try{ URL.revokeObjectURL(url); }catch(e){} v.removeAttribute("src"); resolve(r); }
    setTimeout(function(){ fin(null); }, 9000);
    v.muted = true; v.playsInline = true; v.preload = "auto";
    v.onerror = function(){ fin(null); };
    v.onloadedmetadata = function(){ try{ v.currentTime = Math.min(1, (v.duration || 1) * 0.1); }catch(e){ fin(null); } };
    v.onseeked = function(){
      try{
        var w = v.videoWidth, h = v.videoHeight;
        if(!w || !h) return fin(null);
        var sc = Math.min(1, 640 / w), c = document.createElement("canvas");
        c.width = Math.round(w * sc); c.height = Math.round(h * sc);
        c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
        c.toBlob(function(b){
          fin({file: b ? new File([b], "poster.jpg", {type: "image/jpeg"}) : null, w: w, h: h, dur: v.duration || 0});
        }, "image/jpeg", 0.78);
      }catch(e){ fin(null); }
    };
    v.src = url;
  });
}
/* يرفع الفيديو مع غلافه ويعيد {url, poster, w, h} */
async function uploadVideoWithPoster(file, folder, skipPoster){
  var vm = await videoPoster(file);
  var url = await upUpload(file, folder);
  var poster = "";
  if(!skipPoster && vm && vm.file){ try{ poster = await upUpload(vm.file, "posts"); }catch(e){} }
  return {url: url, poster: poster, w: vm ? vm.w : 0, h: vm ? vm.h : 0};
}

async function shareContent(kind, id, copyOnly){
  var src = null, i;
  if(kind === "reel"){ for(i = 0; i < reels.length; i++) if(reels[i].id === id){ src = reels[i]; break; } }
  else { for(i = 0; i < posts.length; i++) if(posts[i].id === id){ src = posts[i]; break; } }
  var title = "HashidHub", desc = "";
  if(src){
    var img = kind === "reel" ? (src.poster || "") : (src.type === "video" ? (src.poster || "") : (src.media || ""));
    if(!img && /^https?:|^\//.test(src.photo || "")) img = src.photo;
    if(img.charAt(0) === "/") img = location.origin + img;
    var txt = String(kind === "reel" ? (src.caption || "") : (src.t || "")).replace(/\s+/g, " ").trim();
    title = ((src.name || "HashidHub") + (kind === "reel" ? " • ريل" : "")).slice(0, 110);

  }
  var url = location.origin + "/s/" + id;
  if(copyOnly || !navigator.share){
    try{ await navigator.clipboard.writeText(url); toast("تم نسخ الرابط"); }catch(e){ prompt("انسخ الرابط", url); }
    return;
  }
  navigator.share({title: title, text: desc, url: url}).catch(function(){});
}

function vpFmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }
function vpShow(el){ el.classList.add("show"); clearTimeout(el._ht); el._ht = setTimeout(function(){ el.classList.remove("show"); }, 2600); }
function vpMuteIcon(el){ var v = el.querySelector("video"), m = el.querySelector(".vp-mu"); if(m) m.innerHTML = v.muted ? RIC.volOff : RIC.volOn; }
function vpBind(el){
  if(el._b) return; el._b = true;
  var v = el.querySelector("video"), bar = el.querySelector(".vp-bar i"), tt = el.querySelector(".vp-t"), tg = el.querySelector(".vp-tg");
  function icon(){ tg.innerHTML = v.paused ? VPI.playSm : VPI.pause; }
  v.addEventListener("playing", function(){ el.classList.add("playing", "showvid"); el.classList.remove("ended", "loading"); icon(); });
  v.addEventListener("pause", function(){ el.classList.remove("playing"); icon(); });
  v.addEventListener("ended", function(){ el.classList.remove("playing"); el.classList.add("ended"); icon(); });
  v.addEventListener("waiting", function(){ if(!v.paused) el.classList.add("loading"); });
  v.addEventListener("canplay", function(){ el.classList.remove("loading"); });
  v.addEventListener("loadedmetadata", function(){ if(isFinite(v.duration)) tt.textContent = "0:00 / " + vpFmt(v.duration); });
  v.addEventListener("timeupdate", function(){
    if(el._seek) return;
    var d = v.duration;
    if(d && isFinite(d)){ bar.style.width = (v.currentTime / d * 100) + "%"; tt.textContent = vpFmt(v.currentTime) + " / " + vpFmt(d); }
    else tt.textContent = vpFmt(v.currentTime);
  });
  v.addEventListener("error", function(){ el.classList.remove("loading", "playing", "started", "showvid"); try{ v.removeAttribute("src"); }catch(e){} toast("تعذّر تشغيل الفيديو، حاول مجدداً"); });
}
function vpPlay(el){
  var v = el.querySelector("video"); vpBind(el);
  document.querySelectorAll(".vplayer.playing").forEach(function(o){ if(o !== el){ var ov = o.querySelector("video"); if(ov) ov.pause(); } });
  if(v.getAttribute("src") !== el.dataset.src){
    v.preload = "auto";
    v.setAttribute("data-started-by-user", "1");
    v.src = el.dataset.src;
  }
  if(el.classList.contains("ended")){ try{ v.currentTime = 0; }catch(e){} }
  el.classList.add("started", "loading");
  v.muted = !!window._hhFeedMuted; vpMuteIcon(el);
  var p = v.play();
  if(p && p.catch) p.catch(function(err){
    if(err && err.name === "NotAllowedError"){
      v.muted = true; window._hhFeedMuted = true; vpMuteIcon(el);
      var p2 = v.play(); if(p2 && p2.catch) p2.catch(function(){ el.classList.remove("loading"); });
    } else el.classList.remove("loading");
  });
  vpShow(el);
}
function vpHandle(el, kind){
  var v = el.querySelector("video");
  if(kind === "play"){ vpPlay(el); return; }
  vpBind(el);
  if(kind === "tap" || kind === "toggle"){ if(v.paused) vpPlay(el); else v.pause(); vpShow(el); return; }
  if(kind === "mute"){ v.muted = !v.muted; window._hhFeedMuted = v.muted; vpMuteIcon(el); vpShow(el); return; }
  if(kind === "fs"){
    var f = el.requestFullscreen || el.webkitRequestFullscreen;
    if(f){ try{ f.call(el); }catch(e){} } else if(v.webkitEnterFullscreen){ try{ v.webkitEnterFullscreen(); }catch(e){} }
  }
}
function vpSeek(el, e){
  var bar = el.querySelector(".vp-bar"), r = bar.getBoundingClientRect(), v = el.querySelector("video");
  var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if(v.duration && isFinite(v.duration)){ v.currentTime = f * v.duration; el.querySelector(".vp-bar i").style.width = (f * 100) + "%"; }
}
(function initFeedPlayers(){
  document.addEventListener("click", function(e){
    var el = e.target.closest && e.target.closest(".vplayer"); if(!el) return;
    e.stopPropagation(); e.preventDefault();
    var act = e.target.closest("[data-vp]");
    var kind = act ? act.dataset.vp : (el.classList.contains("started") ? "tap" : "play");
    if(kind === "seek") return;
    vpHandle(el, kind);
  }, true);
  var sk = null;
  document.addEventListener("pointerdown", function(e){
    var b = e.target.closest && e.target.closest(".vplayer .vp-bar"); if(!b) return;
    sk = b.closest(".vplayer"); sk._seek = true; vpBind(sk);
    try{ b.setPointerCapture(e.pointerId); }catch(x){}
    vpSeek(sk, e); vpShow(sk); e.preventDefault(); e.stopPropagation();
  }, true);
  document.addEventListener("pointermove", function(e){ if(sk) vpSeek(sk, e); }, true);
  ["pointerup", "pointercancel"].forEach(function(n){ document.addEventListener(n, function(){ if(sk){ sk._seek = false; sk = null; } }, true); });
})();

var _ring = {ctx: null, t: null};
function startRing(){
  stopRing();
  try{ var AC = window.AudioContext || window.webkitAudioContext; if(AC) _ring.ctx = new AC(); }catch(e){}
  function tone(freq, at, dur){
    var c = _ring.ctx; if(!c) return;
    var o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + at);
    g.gain.exponentialRampToValueAtTime(0.28, c.currentTime + at + 0.05);
    g.gain.setValueAtTime(0.28, c.currentTime + at + dur - 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + at + dur);
    o.connect(g); g.connect(c.destination); o.start(c.currentTime + at); o.stop(c.currentTime + at + dur + 0.05);
  }
  function ring(){
    try{ if(_ring.ctx && _ring.ctx.state === "suspended") _ring.ctx.resume(); tone(440, 0, 0.6); tone(480, 0, 0.6); tone(440, 0.8, 0.6); tone(480, 0.8, 0.6); }catch(e){}
    try{ if(navigator.vibrate) navigator.vibrate([500, 250, 500]); }catch(e){}
  }
  ring(); _ring.t = setInterval(ring, 3000);
}
function stopRing(){
  if(_ring.t){ clearInterval(_ring.t); _ring.t = null; }
  if(_ring.ctx){ try{ _ring.ctx.close(); }catch(e){} _ring.ctx = null; }
  try{ if(navigator.vibrate) navigator.vibrate(0); }catch(e){}
}

var REC = {mr: null, chunks: [], stream: null, t0: 0, timer: null, file: null, dur: 0, mime: "", cb: null};
function recMime(){
  if(!window.MediaRecorder) return "";
  return ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"].filter(function(m){ return MediaRecorder.isTypeSupported(m); })[0] || "";
}
function closeRecorder(){
  clearInterval(REC.timer);
  try{ if(REC.mr && REC.mr.state !== "inactive"){ REC.mr.onstop = null; REC.mr.stop(); } }catch(e){}
  try{ if(REC.stream) REC.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
  REC.mr = null; REC.stream = null; REC.file = null;
  var d = document.getElementById("recmodal"); if(d) d.remove();
  if(!document.getElementById("reelplayer") && !document.getElementById("authmodal")) document.body.style.overflow = "";
}
function recUI(state){
  var b = document.getElementById("rec-btns"), n = document.getElementById("rec-note"), w = document.getElementById("rec-wave"), pv = document.getElementById("rec-prev");
  if(!b) return;
  if(w) w.className = "rec-wave" + (state === "rec" ? " on" : "");
  if(pv) pv.hidden = state !== "prev";
  if(state === "idle"){ b.innerHTML = '<button type="button" class="btn big" data-rec="start" style="flex:1">● ابدأ التسجيل</button>'; n.textContent = "الحد الأقصى دقيقتان"; }
  if(state === "rec"){ b.innerHTML = '<button type="button" class="btn red big" data-rec="stop" style="flex:1">■ إيقاف</button>'; n.textContent = "جارٍ التسجيل…"; }
  if(state === "prev"){ b.innerHTML = '<button type="button" class="btn alt" data-rec="redo" style="flex:1">إعادة</button><button type="button" class="btn" data-rec="send" style="flex:1">استخدام التسجيل</button>'; n.textContent = "استمع قبل الإرسال"; }
}
function openRecorder(cb){
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast("متصفحك لا يدعم التسجيل الصوتي"); return; }
  closeRecorder(); REC.cb = cb;
  var d = document.createElement("div");
  d.id = "recmodal"; d.className = "amodal";
  d.innerHTML = '<div class="am-card rec-card"><button type="button" class="am-x" data-rec="close" aria-label="إغلاق">✕</button><h3>🎙 تسجيل صوتي</h3>' +
    '<div class="rec-time" id="rec-time">0:00</div><div class="rec-wave" id="rec-wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>' +
    '<audio id="rec-prev" controls hidden style="width:100%;margin:8px 0"></audio><div class="row" id="rec-btns"></div><div class="note" id="rec-note" style="text-align:center"></div></div>';
  document.body.appendChild(d);
  document.body.style.overflow = "hidden";
  d.addEventListener("click", async function(e){
    e.stopPropagation();
    var r = e.target.closest("[data-rec]"), k = r ? r.dataset.rec : (e.target === d ? "close" : "");
    if(k === "close"){ closeRecorder(); return; }
    if(k === "start" || k === "redo"){ await recStart(); return; }
    if(k === "stop"){ recStop(); return; }
    if(k === "send"){ var f = REC.file, du = REC.dur, c = REC.cb; closeRecorder(); if(f && c) c(f, du); return; }
  });
  recUI("idle");
}
async function recStart(){
  try{ REC.stream = await navigator.mediaDevices.getUserMedia({audio: true}); }
  catch(e){ toast("لم يُسمح بالوصول إلى الميكروفون. فعّله من إعدادات المتصفح."); return; }
  REC.mime = recMime(); REC.chunks = [];
  try{ REC.mr = new MediaRecorder(REC.stream, REC.mime ? {mimeType: REC.mime, audioBitsPerSecond: 48000} : {audioBitsPerSecond: 48000}); }
  catch(e){ toast("تعذّر بدء التسجيل"); return; }
  REC.mr.ondataavailable = function(e){ if(e.data && e.data.size) REC.chunks.push(e.data); };
  REC.mr.onstop = function(){
    try{ REC.stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
    var type = (REC.mime || "audio/webm").split(";")[0];
    REC.dur = Math.max(1, Math.round((Date.now() - REC.t0) / 1000));
    var ext = type.indexOf("mp4") > -1 ? "m4a" : type.indexOf("ogg") > -1 ? "ogg" : "weba";
    var blob = new Blob(REC.chunks, {type: type});
    REC.file = new File([blob], "voice." + ext, {type: type});
    var pv = document.getElementById("rec-prev"); if(pv){ pv.src = URL.createObjectURL(blob); }
    recUI("prev");
  };
  REC.mr.start(500); REC.t0 = Date.now(); recUI("rec");
  var tm = document.getElementById("rec-time");
  clearInterval(REC.timer);
  REC.timer = setInterval(function(){
    var s = Math.floor((Date.now() - REC.t0) / 1000);
    if(tm) tm.textContent = vpFmt(s);
    if(s >= 120) recStop();
  }, 250);
}
function recStop(){ clearInterval(REC.timer); try{ if(REC.mr && REC.mr.state !== "inactive") REC.mr.stop(); }catch(e){} }
function audioNote(){
  return (draft.audio ? '<div class="note">🎙 تسجيل صوتي (' + vpFmt(draft.audio.dur) + ') مرفق <button type="button" class="mini" data-a="rmaudio">✕</button></div>' : "") +

(function initAudioPlayers(){
  function bind(el){
    if(el._b) return; el._b = true;
    var a = el.querySelector("audio"), bar = el.querySelector(".ap-bar i"), tt = el.querySelector(".ap-t"), bt = el.querySelector(".ap-btn");
    a.addEventListener("playing", function(){ el.classList.add("playing"); bt.innerHTML = VPI.pause; });

    a.addEventListener("ended", function(){ el.classList.remove("playing"); bt.innerHTML = VPI.playSm; bar.style.width = "0"; });
    a.addEventListener("timeupdate", function(){ if(a.duration && isFinite(a.duration)){ bar.style.width = (a.currentTime / a.duration * 100) + "%"; tt.textContent = vpFmt(a.currentTime); } });
    a.addEventListener("error", function(){ el.classList.remove("playing"); toast("تعذّر تشغيل التسجيل"); });
  }
  document.addEventListener("click", function(e){
    var el = e.target.closest && e.target.closest(".aplayer"); if(!el) return;
    var k = e.target.closest("[data-ap]"); if(!k) return;
    e.stopPropagation(); e.preventDefault();
    var a = el.querySelector("audio"); bind(el);
    if(k.dataset.ap === "toggle"){
      document.querySelectorAll(".aplayer.playing").forEach(function(o){ if(o !== el){ var oa = o.querySelector("audio"); if(oa) oa.pause(); } });
      if(!a.getAttribute("src")) a.src = el.dataset.src;
      if(a.paused){ var p = a.play(); if(p && p.catch) p.catch(function(){ toast("تعذّر التشغيل"); }); } else a.pause();
    } else if(k.dataset.ap === "seek"){
      var r = k.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      if(!a.getAttribute("src")) a.src = el.dataset.src;
      if(a.duration && isFinite(a.duration)) a.currentTime = f * a.duration;
    }
  }, true);
})();

/* ---- «لك»: ترتيب الموجز حسب القرب والتفاعل ---- */
function feedScore(it, likeCnt, cmCnt){
  var age = Math.max(0, (Date.now() - (it.ts || 0)) / 3600000);
  var lc = it._reel ? (it.likes || 0) : (likeCnt[it.id] || 0), cc = it._reel ? (it.comments || 0) : (cmCnt[it.id] || 0);
  var aff = it.uid === me.uid ? 1.4 : isFriend(it.uid) ? 1.7 : following(me.uid, it.uid) ? 1.5 : isAdminUid(it.uid) ? 1.3 : 1;
  var eng = Math.sqrt(1 + Math.min(lc * 2 + cc * 3, 40)); // التفاعل مهم لكن الحداثة أهم
  return eng * aff * ((it.media || it._reel) ? 1.1 : 1) / Math.pow(age / 4 + 1, 1.5);
}

var tm;

function bindFeedVideos(){
  if(!("IntersectionObserver" in window)) return;
  if(!window._vpIO){
    window._vpIO = new IntersectionObserver(function(es){
      es.forEach(function(en){
        if(en.isIntersecting) return;
        var el = en.target, v = el.querySelector("video");
        if(el.classList.contains("playing") && v && !document.fullscreenElement && !document.webkitFullscreenElement) v.pause();
      });
    }, {threshold: 0.15});
  }
  window._vpIO.disconnect();
  document.querySelectorAll(".vplayer").forEach(function(el){ window._vpIO.observe(el); });
}

function draw(){ clearTimeout(tm); tm = setTimeout(function(){ render(); try{ bindFeedVideos(); }catch(e){} }, 110); }

function render(){

  var keepAu = m.querySelector(".aplayer.playing"), keepAuSrc = keepAu && keepAu.dataset.src;
  var keepVals = {}, aeKey = null, ae = document.activeElement;
  function kOf(el){ return el.id ? "#" + el.id : (el.dataset && el.dataset.ci ? "ci:" + el.dataset.ci : null); }
  m.querySelectorAll('[id^="pge-"],[id^="gre-"],[id^="safe-"],input[data-ci]').forEach(function(el){ var k = kOf(el); if(k && el.type !== "file") keepVals[k] = el.value; });
  if(ae && m.contains(ae)) aeKey = kOf(ae);
  m.innerHTML = fixMedia(view()).replace(/<img (?![^>]*loading=)/g, '<img loading="lazy" decoding="async" ');
  Object.keys(keepVals).forEach(function(k){
    var el = k.indexOf("ci:") === 0 ? m.querySelector('input[data-ci="' + k.slice(3) + '"]') : m.querySelector(k);
    if(el && keepVals[k] !== "" ) el.value = keepVals[k];

  });
  if(keepWas && keepPid){
    var ph = m.querySelector('.vplayer[data-pid="' + keepPid + '"]');
    if(ph){ ph.replaceWith(keep); var kv = keep.querySelector("video"); if(kv && kv.paused){ var kp = kv.play(); if(kp && kp.catch) kp.catch(function(){}); } }

  if(keepAu){

  }
  if($("#mi")) $("#mi").value = mv;

function ensureCatalog(kind){
  var map = { marketplace: { col: "marketplace", key: "marketplace" }, jobs: { col: "jobPosts", key: "jobs" }, academy: { col: "courses", key: "academy" } };
  var cfg = map[kind]; if(!cfg) return;
  if(catalogUnsub[cfg.key]) return;
  function applySnap(snap){
    catalog[cfg.key] = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
    catalog[cfg.key].sort(function(a,b){ return (Number(b.createdAt)||0) - (Number(a.createdAt)||0); });
    if(tab === kind || tab === "marketplace" || tab === "jobs" || tab === "academy") draw();
  }
  try{
    catalogUnsub[cfg.key] = onSnapshot(
      query(collection(db, cfg.col), where("status", "==", "published"), orderBy("createdAt", "desc"), limit(50)),
      applySnap,
      function(err){
        console.warn("catalog index/query", cfg.col, err && err.code, err && err.message);
        // Fallback without orderBy if composite index missing
        try{
          if(catalogUnsub[cfg.key]) { try{ catalogUnsub[cfg.key](); }catch(e){} }
          catalogUnsub[cfg.key] = onSnapshot(
            query(collection(db, cfg.col), where("status", "==", "published"), limit(50)),
            applySnap,
            function(err2){ console.warn("catalog fallback", cfg.col, err2 && err2.message); toast(t("تعذر تحميل القائمة","Failed to load list") + ": " + (err2.code||"")); }
          );
        }catch(e2){ console.warn(e2); }
      }
    );
  }catch(e){ console.warn(e); }
}
function catalogPush(kind, id, data){
  var key = kind === "jobs" ? "jobs" : (kind === "academy" ? "academy" : "marketplace");
  var row = Object.assign({ id: id }, data);
  catalog[key] = [row].concat((catalog[key] || []).filter(function(x){ return x.id !== id; }));
  draw();
}

function renderText(t){
  var s = esc(t);
  s = s.replace(/#([\u0600-\u06FF\w]+)/g, '<span class="hashtag" data-h="$1">#$1</span>');
  s = s.replace(/@([\w\u0600-\u06FF]+)/g, '<span class="mention" data-m="$1">@$1</span>');
  return s;
}
function yt(t){
  var m = (t || "").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))([\w-]{11})/);
  return m ? '<iframe class="media" style="width:100%;aspect-ratio:16/9;border:0" src="https://www.youtube.com/embed/' + m[1] + '" allowfullscreen loading="lazy"></iframe>' : "";
}

  }
  h += '<button type="button" data-a="like" class="fbb' + (on ? " on" : "") + rxCls + '" title="اضغط مطولاً لاختيار التفاعل">' + likeInner + '</button>';

  h += '<button type="button" data-a="share" class="fbb">' + FBI.share + '<span class="fbl">مشاركة</span></button></div>';

  // comments: top-level then replies
  var top = cs.filter(function(c){ return !c.parentId; });
  var replies = cs.filter(function(c){ return c.parentId; });
  function cmBlock(c, isReply){
    var canMod = c.uid === me.uid || own || isAdmin;

    if(c.uid === me.uid || own || isAdmin) s += '<button class="mini" data-a="dcm" data-c="' + c.id + '" style="color:#b3261e">حذف</button>';
    s += '</div></div>';
    return s;
  }
  var expC = tab === "post" || (window._expCm && window._expCm[p.id]);
  (expC ? top : top.slice(-1)).forEach(function(c){
    h += cmBlock(c, false);
    if(expC) replies.filter(function(r){ return r.parentId === c.id; }).forEach(function(r){ h += cmBlock(r, true); });
  });
  if(tab !== "post" && (top.length > 1 || (!expC && replies.length))) h += '<button type="button" class="more-btn" data-a="allcm">' + (expC ? "إخفاء التعليقات" : "عرض كل التعليقات (" + cs.length + ")") + '</button>';
  h += !canComment(p) ? '<div class="note">🔒 التعليقات مقيّدة على هذا المنشور.</div>' : '<div class="row"><input type="text" placeholder="اكتب تعليقا…" data-ci="' + p.id + '" maxlength="2000"' + (isGuest ? " readonly" : "") + '><button class="btn alt" data-a="send" style="margin-top:8px">إرسال</button></div>';
  h += '</article>';
  return h;
}

function adHtml(a){
  var adPid = "ad_" + a.id;
  var u = /^https?:\/\//i.test(a.link || "") ? a.link : "";
  var cs = (adComments || []).filter(function(cm){ return cm.adId === a.id; });
  var lk = likes.filter(function(l){ return l.pid === adPid; });
  var on = lk.some(function(l){ return l.uid === me.uid; });

  var reactEmoji = {like:"👍",love:"❤️",laugh:"😂",sad:"😢",angry:"😡"};
  var reactCounts = {like:0,love:0,laugh:0,sad:0,angry:0};
  lk.forEach(function(l){ var r = l.reaction || "like"; if(reactCounts[r] !== undefined) reactCounts[r]++; });
  var sumHtml = "";
  Object.keys(reactCounts).forEach(function(k){ if(reactCounts[k]) sumHtml += '<span>' + reactEmoji[k] + ' ' + reactCounts[k] + '</span>'; });
  var h = '<article class="card ad" data-id="' + adPid + '" data-ad="' + a.id + '"><span class="tag">إعلان ممول</span><h3>' + esc(a.title) + '</h3>';
  if(/^https?:|^data:image\//i.test(a.img || "")) h += '<img class="media" src="' + esc(a.img) + '" alt="" loading="lazy">';

  if(a.contactEmail) contactBits.push('<a class="ad-contact" href="mailto:'+esc(a.contactEmail)+'">✉ '+esc(a.contactEmail)+'</a>');
  if(contactBits.length) h += '<div class="ad-contacts">'+contactBits.join("")+'</div>';

  h += '<div class="stats"><span class="stats-react">' + (sumHtml || (lk.length ? ("👍 " + lk.length) : "")) + '</span><span>' + (cs.length ? (cs.length + " 💬") : "") + '</span></div>';
  h += '<div class="acts">';
  var likeIcoAd;
  if(myReaction && myReaction.reaction && myReaction.reaction !== "like"){
    likeIcoAd = '<span class="act-ico">' + reactEmoji[myReaction.reaction] + '</span>';
  } else {
    likeIcoAd = LIKE_SVG;
  }
  h += '<button type="button" data-a="like" class="' + (on ? "on" : "") + '" title="اضغط مطولاً للتفاعل">' + likeIcoAd + '<span class="act-n">' + (lk.length || "") + '</span></button>';
  h += '<button type="button" data-a="adcm" data-i="' + a.id + '"><span class="act-ico">💬</span><span class="act-n">' + (cs.length || "") + '</span></button>';
  h += '<button type="button" data-a="share" data-i="' + a.id + '"><span class="act-ico share-ico">↗</span><span class="act-n"></span></button></div>';
  cs.slice(-5).forEach(function(cm){
    h += '<div class="cm"><b>'+esc(cm.name||"عضو")+'</b> <small>'+ago(cm.ts)+'</small><div>'+renderText(cm.t||"")+'</div></div>';
  });
  h += '</article>';
  return h;
}

function homeView(){
  var act = ads.filter(function(a){ return a.on && (!a.end || a.end > Date.now()); });
  var fl;
  if(feedMode === "friends"){
    var fset = friends.filter(function(f){ return f.u1 === me.uid || f.u2 === me.uid; })
      .map(function(f){ return f.u1 === me.uid ? f.u2 : f.u1; });
    fl = posts.filter(function(p){ return fset.indexOf(p.uid) >= 0; });
  } else if(feedMode === "following"){
    fl = posts.filter(function(p){ return following(me.uid, p.uid); });
  } else {
    fl = posts;
  }
  fl = fl.filter(function(p){ return p.privacy !== "friends" || p.uid === me.uid || isFriend(p.uid); });
  var rlist = reels.filter(function(r){
    if(blocks.has(r.uid) || !(r.videoUrl || r.media || r.url)) return false;
    if(feedMode === "friends") return r.uid === me.uid || isFriend(r.uid);
    if(feedMode === "following") return r.uid === me.uid || following(me.uid, r.uid);
    return true;
  }).map(function(r){ return Object.assign({_reel: true}, r); });
  fl = fl.concat(rlist).sort(function(a, b){ return (b.ts || 0) - (a.ts || 0); });
  if(feedMode === "foryou"){
    var likeCnt = {}, cmCnt = {};
    likes.forEach(function(l){ likeCnt[l.pid] = (likeCnt[l.pid] || 0) + 1; });
    comments.forEach(function(c){ cmCnt[c.pid] = (cmCnt[c.pid] || 0) + 1; });
    fl.sort(function(a, b){ return feedScore(b, likeCnt, cmCnt) - feedScore(a, likeCnt, cmCnt); });
  }

  var mySeen = {}, byUid = {}, order = [];
  storyViews.forEach(function(v){ if(v.uid === me.uid) mySeen[v.storyId] = 1; });
  stories.forEach(function(st){
    if(blocks.has(st.uid)) return;
    var g = byUid[st.uid];
    if(!g){ g = byUid[st.uid] = {uid: st.uid, name: st.name, photo: st.photo, ts: 0, unseen: false}; order.push(g); }
    if((st.ts || 0) >= g.ts){ g.ts = st.ts || 0; g.media = st.media || ""; }
    if(!mySeen[st.id] && st.uid !== me.uid) g.unseen = true;
  });
  order.sort(function(x, y){ return (y.unseen ? 1 : 0) - (x.unseen ? 1 : 0) || y.ts - x.ts; });

    '<button type="button" class="story-bubble" data-a="addstory"><div class="story-ring mine"><img src="' + (esc(prof.photo) || DEF) + '" alt=""><i class="story-add">+</i></div><span>' + t("أضف قصة","Add story") + '</span></button>');
  order.forEach(function(g){
    sh += '<button type="button" class="story-bubble" data-a="openstory" data-u="' + esc(g.uid) + '"><div class="story-ring' + (g.unseen ? "" : " seen") + '"><img src="' + (esc(g.media || g.photo) || DEF) + '" alt=""><span class="story-av"><img src="' + (esc(g.photo) || DEF) + '" alt=""></span></div><span>' + (g.uid === me.uid ? t("قصتك","Your story") : esc(g.name || "")) + '</span></button>';
  });
  sh += '</div>';
  if(isGuest && !order.length) sh = "";

  var feedLabel = feedMode === "foryou" ? "✨ لك" : feedMode === "friends" ? "👥 الأصدقاء" : feedMode === "following" ? "➕ المتابعون" : "🕒 الأحدث";
  var toolbar = '<div class="feed-toolbar" aria-label="خيارات الموجز"><div class="feed-toolbar-title"><i></i><span>' + feedLabel + '</span></div>' +
    '<div class="feed-filters" role="tablist" aria-label="تصفية الموجز">' +
    '<button type="button" class="' + (feedMode === "all" ? "on" : "") + '" data-a="fm" data-v="all" role="tab" aria-selected="' + (feedMode === "all") + '">الأحدث</button>' +
    '<button type="button" class="' + (feedMode === "foryou" ? "on" : "") + '" data-a="fm" data-v="foryou" role="tab" aria-selected="' + (feedMode === "foryou") + '">لك</button>' +
    '<button type="button" class="' + (feedMode === "friends" ? "on" : "") + '" data-a="fm" data-v="friends" role="tab" aria-selected="' + (feedMode === "friends") + '">الأصدقاء</button>' +
    '<button type="button" class="' + (feedMode === "following" ? "on" : "") + '" data-a="fm" data-v="following" role="tab" aria-selected="' + (feedMode === "following") + '">المتابعون</button>' +
    '</div></div>';
  var memberMetric = users.length ? fmtN(users.length) : t("عالمي", "Global");
  var memberLabel = users.length ? t("عضو", "members") : t("مجتمع", "community");
  var discovery = '<aside class="desktop-rail discovery-card" aria-label="اكتشف HashidHub"><h3>اكتشف عالمك</h3><div class="note" style="color:rgba(255,255,255,.78)">مجتمع عالمي يجمع الأشخاص والأفكار والمحتوى الذي يهمك.</div>' +
    '<div class="discovery-grid"><div class="discovery-stat"><b>' + memberMetric + '</b><span>' + memberLabel + '</span></div><div class="discovery-stat"><b>' + fmtN(posts.length) + '</b><span>منشور</span></div><div class="discovery-stat"><b>' + fmtN(reels.length) + '</b><span>ريلز</span></div></div>' +
    '<div class="discovery-actions"><button class="btn" data-t="explore">استكشف الآن</button><button class="btn alt" data-t="groups">المجتمعات</button></div></aside>';
  var rs = shelfReels();

  if(rs.length){
    sh += '<div class="reel-shelf">' + rs.slice(0, 8).map(reelTileHtml).join("") + '</div>';
  } else {
    sh += '<div class="card" style="margin-bottom:12px"><div class="note">' + t("لا ريلز بعد — كن أول من ينشر من تبويب الريلز.","No reels yet — be the first from the Reels tab.") + '</div></div>';
  }

  var mps = myPages();
  var composer = '<div class="card composer-card"><div class="composer-head"><strong>✨ شارك لحظتك</strong><span class="composer-kicker">عام · آمن · لك</span></div><div class="row" style="align-items:flex-start">' +
    '<img class="av" src="' + (esc(prof.photo) || DEF) + '" alt="">' +
    '<textarea id="tx" placeholder="بماذا تفكر يا ' + esc((prof.name||"").split(" ")[0]) + '؟" maxlength="5000"></textarea></div>';
  if(draft.file) composer += '<div class="note" style="margin-top:6px">مرفق: ' + esc(draft.file.name) + ' <button class="mini" data-a="cleardraft">إزالة</button></div>';
  composer += '<div class="tools"><label>صورة<input type="file" id="fm" accept="image/*" hidden></label>' +
    '<label title="الحد الأقصى 50 ميجا ويُضغط تلقائياً">فيديو <small style="opacity:.65">≤50MB</small><input type="file" id="fv" accept="video/*" hidden></label>' + '<button type="button" class="vlabel" data-a="recpost">🎙 صوت</button>' + '<button type="button" class="vlabel" data-a="pollmake">📊 استطلاع</button>';
  if(mps.length){

    mps.forEach(function(p){ composer += '<option value="' + p.id + '">صفحة: ' + esc(p.name) + '</option>'; });
    composer += '</select>';
  }
  composer += '<button class="btn" id="pub" style="margin-inline-start:auto">نشر</button></div></div>';

  var tabs = ''; // خيارات موجز المنشورات أصبحت ضمن قائمة أعلى اليسار

  // اقتراحات أصدقاء
  var sug = users.filter(function(u){
    return u.id !== me.uid && !isFriend(u.id) && reqState(u.id) === "none" && !blocks.has(u.id) && !banned[u.id] && !isAdminUid(u.id) && searchable(u);
  }).slice(0, 4);
  var sugHtml = "";

    });
    sugHtml += '<button class="mini" data-t="explore" style="margin-top:6px">عرض المزيد…</button></div>';
  }

  var list = "", n = 0;
  for(var i = 0; i < fl.length; i++){
    list += fl[i]._reel ? reelCardHtml(fl[i]) : postHtml(fl[i]);
    if((i + 1) % 5 === 0 && act.length) list += adHtml(act[n++ % act.length]);
  }
  if(!list) list = '<div class="empty">لا منشورات هنا بعد.</div>';
  if(posts.length >= plim) list += '<button class="btn gray big" data-a="more">عرض المزيد من المنشورات</button>';

  return sh + toolbar + moodStrip() + (isGuest ? guestCta() : challengeCard() + composer + pushPrompt()) + discovery + tabs + sugHtml + list;
}

function exList(q){

    if(u.id !== me.uid && searchable(u) && (u.name || "").indexOf(q) > -1) ou += userRow(u);

async function toggleReelLike(rid, onlyLike){
  if(isGuest){ showAuthModal(); return; }
  var rel = reels.filter(function(x){ return x.id === rid; })[0];
  if(!rel) return;
  if(!window._reelLiked) window._reelLiked = {};
  var was = !!window._reelLiked[rid];
  if(was && onlyLike) return;
  window._reelLiked[rid] = !was;
  rel.likes = Math.max(0, (rel.likes || 0) + (was ? -1 : 1));
  paintReelLike(rid);
  try{
    var rl = doc(db, "reelLikes", rid + "_" + me.uid);
    if(was){ await deleteDoc(rl); await updateDoc(doc(db, "reels", rid), {likes: increment(-1)}); }
    else { await setDoc(rl, {rid: rid, uid: me.uid, ts: Date.now()}); await updateDoc(doc(db, "reels", rid), {likes: increment(1)}); }
  }catch(err){
    window._reelLiked[rid] = was;
    rel.likes = Math.max(0, (rel.likes || 0) + (was ? 1 : -1));
    paintReelLike(rid);
    toast(friendlyErr(err));
  }
}

  var items = Array.prototype.slice.call(scroller.querySelectorAll(".reel-item"));
  var cur = -1, tapT = null, lastTap = 0, lastTapItem = null, viewT = null, seeking = null;

  function vid(it){ return it.querySelector("video"); }
  function setLoading(it, on){ it.classList.toggle("is-loading", !!on); }
  function paintMute(){

  }
  function lowData(){
    if(getPref("dataSaver") === "on") return true;
    try{
      var c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      return !!(c && (c.saveData || /^(slow-2g|2g)$/.test(c.effectiveType || "")));
    }catch(e){ return false; }
  }
  function setSrc(it, url){ var v = vid(it); if(v.getAttribute("src") !== url) v.src = url; }
  function prepare(it, full){
    var u = it.dataset.src, v = vid(it);
    if(!u) return Promise.resolve();
    // لا نحول الفيديو إلى Blob قبل التشغيل؛ ذلك كان يجبر المتصفح على تنزيل الملف كاملاً.
    // نترك عنصر الفيديو يستخدم Range Requests مباشرة من الـWorker/CDN.
    if(!v.getAttribute("src")){
      v.preload = full && !lowData() ? "auto" : "metadata";
      v.setAttribute("data-prepared", full ? "full" : "metadata");
      v.src = u;
    } else if(full && !lowData()) {
      v.preload = "auto";
    }

  }
  function ensureWindow(i){
    items.forEach(function(it, k){
      var v = vid(it);
      if(Math.abs(k - i) > 3 && v.getAttribute("src")){
        try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){}
        setLoading(it, false);
      }
    });
    if(items[i + 1]) prepare(items[i + 1], false);
    if(items[i - 1]) prepare(items[i - 1], false);
  }
  function warm(it){ // بعد أن يبدأ المقطع الحالي: نخزّنه والتالي في الذاكرة المؤقتة ليعمل بلا تقطيع عند الإعادة
    if(lowData()) return;
    setTimeout(function(){
      if(items[cur] !== it) return;
      if(items[cur + 1]) prepare(items[cur + 1], true);
    }, 1500);
  }
  function playItem(it){
    var v = vid(it); if(!v) return;
    if(!v.getAttribute("src") && it.dataset.src){
      v.preload = lowData() ? "metadata" : "auto";
      v.src = it.dataset.src;
    }
    v.muted = !!window._hhReelMuted;
    setLoading(it, v.readyState < 3);

    if(p && p.catch) p.catch(function(err){
      if(err && err.name === "AbortError") return;
      if(!v.muted){
        v.muted = true; window._hhReelMuted = true; paintMute();
        toast(t("الصوت مكتوم — اضغط أيقونة الصوت لتشغيله","Muted — tap the speaker to unmute"), 3000);
        var p2 = v.play();
        if(p2 && p2.catch) p2.catch(function(){ it.classList.add("paused"); setLoading(it, false); });
      } else { it.classList.add("paused"); setLoading(it, false); }

  function countView(rid){

      seen[rid] = 1;
      var r = reels.filter(function(x){ return x.id === rid; })[0];
      if(r && r.uid === me.uid) return;
