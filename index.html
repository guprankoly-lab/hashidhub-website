<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="HashidHub 3.0 — منصة اجتماعية عالمية للشباب">
  <title>HashidHub 3.0</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/profile.css">
  <link rel="stylesheet" href="./css/reels.css">
  <link rel="stylesheet" href="./css/chat.css">
  <style>
    .boot-err{max-width:520px;margin:40px auto;padding:20px;background:#1a1212;color:#fecaca;
      border:1px solid #7f1d1d;border-radius:16px;font-family:system-ui,sans-serif;direction:rtl;text-align:right}
    .boot-err code{display:block;margin-top:10px;padding:10px;background:#0b0f14;border-radius:8px;
      color:#fdba74;font-size:12px;white-space:pre-wrap;direction:ltr;text-align:left}
  </style>
</head>
<body>
  <div id="app">
    <div class="auth-wrap"><div class="note" id="boot-msg">… Loading HashidHub 3.0</div></div>
  </div>
  <script src="./media-config.js"></script>
  <script>
    window.__hhShowErr = function (err) {
      var msg = (err && (err.message || err.stack || String(err))) || "Unknown error";
      console.error("[HashidHub boot]", err);
      var app = document.getElementById("app");
      if (app) {
        app.innerHTML = '<div class="boot-err"><b>تعذّر تشغيل HashidHub 3.0</b><p>انسخ الرسالة التالية وأرسلها للدعم.</p><code>' +
          String(msg).replace(/</g, "&lt;").slice(0, 1500) + "</code></div>";
      }
    };
    window.addEventListener("error", function (e) {
      if (e && e.message && e.message.indexOf("Script error") === 0) return;
      window.__hhShowErr(e.error || e.message || e);
    });
    window.addEventListener("unhandledrejection", function (e) {
      window.__hhShowErr(e.reason || e);
    });
    setTimeout(function () {
      var m = document.getElementById("boot-msg");
      if (m && document.body.innerHTML.indexOf("Loading HashidHub") !== -1) {
        m.textContent = "لا يزال التحميل… إذا استمر، افتح Console (F12) وابحث عن أخطاء JS";
      }
    }, 8000);
  </script>
  <script type="module">
    import("./js/app.js").catch(function (err) {
      window.__hhShowErr(err);
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          // optional: leave SW; new cache name invalidates old
        });
        navigator.serviceWorker.register("./sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
